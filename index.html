                            break;
                        }
                    }
                }

                this.zombis = this.zombis.filter(z => z.vida > 0);

                // Actualizar armas en suelo
                for (let i = this.armasSuelo.length - 1; i >= 0; i--) {
                    const arma = this.armasSuelo[i];
                    arma.timer--;
                    if (arma.timer <= 0) {
                        this.armasSuelo.splice(i, 1);
                        continue;
                    }
                    if (arma.activo) {
                        const dist = distancia(arma.x, arma.y, this.jugador.centroX, this.jugador.centroY);
                        if (dist < this.jugador.ancho / 2 + arma.radio + 10*e) {
                            if (arma.tipo === 'escopeta') {
                                this.jugador.arma_actual = 'escopeta';
                                this.jugador.balas_escopeta = 6;
                            } else if (arma.tipo === 'metralleta') {
                                this.jugador.arma_actual = 'metralleta';
                                this.jugador.balas_metralleta = 30;
                                this.jugador.recargando = false;
                            }
                            arma.activo = false;
                            this.armasSuelo.splice(i, 1);
                            crearParticulas(arma.x, arma.y, C.NARANJA, 20, 5);
                        }
                    }
                }

                // Spawn de zombis
                const spawnRate = Math.max(300, 1200 - (minutos * 20));
                if (tiempoActual - this.ultimoSpawn > spawnRate) {
                    this.zombisPorSpawn = 1 + Math.floor(minutos * 0.2);
                    const cantidad = Math.min(this.zombisPorSpawn, 8);
                    for (let i = 0; i < cantidad; i++) {
                        this.zombis.push(this.spawnZombi(minutos));
                    }
                    this.ultimoSpawn = tiempoActual;
                }

                if (this.tiempoAtaqueZombi > 0) this.tiempoAtaqueZombi--;

                actualizarParticulas();
            }

            dibujar() {
                const e = ESCALA;
                ctx.clearRect(0, 0, ANCHO, ALTO);

                // Fondo
                const grad = ctx.createLinearGradient(0, 0, 0, ALTO);
                grad.addColorStop(0, '#0a0a1a');
                grad.addColorStop(0.5, '#1a1a2e');
                grad.addColorStop(1, '#0d0d1a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, ANCHO, ALTO);

                // Suelo
                ctx.fillStyle = 'rgba(30, 30, 50, 0.5)';
                ctx.fillRect(0, ALTO - 50*e, ANCHO, 50*e);
                ctx.fillStyle = 'rgba(40, 40, 60, 0.3)';
                for (let i = 0; i < ANCHO; i += 40*e) {
                    ctx.fillRect(i, ALTO - 50*e, 1, 50*e);
                }

                // Plataformas
                const plataformas = getPlataformas();
                for (const p of plataformas) {
                    ctx.fillStyle = 'rgba(60, 70, 90, 0.6)';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 10*e;
                    ctx.beginPath();
                    ctx.roundRect(p.x, p.y, p.w, p.h, 4);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(100, 120, 150, 0.3)';
                    ctx.fillRect(p.x + 5*e, p.y + 2*e, p.w - 10*e, 3*e);
                }

                // Granadas en suelo
                for (const g of this.granadasSuelo) {
                    if (!g.activo) continue;
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 20*e;
                    ctx.fillStyle = '#2c3e50';
                    ctx.beginPath();
                    ctx.arc(g.x, g.y, g.radio, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#7f8c8d';
                    ctx.fillRect(g.x - 3*e, g.y - 14*e, 6*e, 4*e);
                    ctx.fillStyle = '#FFD700';
                    ctx.font = `${14*e}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowBlur = 0;
                    ctx.fillText('💣', g.x, g.y);
                    ctx.shadowBlur = 0;
                }

                // Corazones en suelo
                for (const c of this.corazonesSuelo) {
                    c.dibujar();
                }

                // Armas en suelo
                for (const arma of this.armasSuelo) {
                    arma.dibujar();
                }

                // Granadas
                for (const granada of this.granadas) {
                    granada.dibujar();
                }

                // Zombis
                for (const zombi of this.zombis) {
                    zombi.dibujar();
                }

                // Balas
                for (const bala of this.balas) {
                    bala.dibujar();
                }
                for (const bala of this.balasEnemigas) {
                    bala.dibujar();
                }

                // Perro
                if (this.perro && this.perro.vivo) {
                    this.perro.dibujar();
                }

                // Partículas
                dibujarParticulas();

                // Jugador
                if (this.jugador.vivo) {
                    this.jugador.dibujar();
                }

                // UI
                this.dibujarUI();
            }

            dibujarUI() {
                const e = ESCALA;
                const tiempoActual = Date.now();
                const minutos = Math.floor((tiempoActual - this.tiempoInicio) / 60000);
                const segundos = Math.floor((tiempoActual - this.tiempoInicio) / 1000) % 60;

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                ctx.roundRect(10*e, 10*e, 320*e, 80*e, 10*e);
                ctx.fill();

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${20*e}px Arial`;
                ctx.fillText(`💀 ${this.puntuacion}`, 20*e, 15*e);

                ctx.fillStyle = '#00BCD4';
                ctx.font = `${16*e}px Arial`;
                ctx.fillText(`⏱ ${minutos}:${segundos.toString().padStart(2, '0')}`, 120*e, 16*e);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = `${14*e}px Arial`;
                let armaText = `🔫 ${this.jugador.arma_actual.toUpperCase()}`;
                if (this.jugador.arma_actual === 'escopeta') {
                    armaText += ` (${this.jugador.balas_escopeta})`;
                } else if (this.jugador.arma_actual === 'metralleta') {
                    armaText += ` (${this.jugador.balas_metralleta}/${this.jugador.max_metralleta})`;
                    if (this.jugador.recargando) armaText += ' 🔄';
                }
                ctx.fillText(armaText, 20*e, 45*e);

                ctx.fillStyle = '#FFD93D';
                ctx.font = `${14*e}px Arial`;
                ctx.fillText(`⭐ Nivel ${minutos + 1}`, 20*e, 70*e);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = `${14*e}px Arial`;
                ctx.fillText(`🧟 ${this.zombis.length}`, 120*e, 70*e);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = `${14*e}px Arial`;
                ctx.fillText(`💣 ${this.jugador.granadas}`, 190*e, 70*e);

                if (this.perro && this.perro.vivo) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = `${14*e}px Arial`;
                    ctx.fillText(`🐕‍🦺 REX`, 260*e, 70*e);
                }

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${12*e}px Arial`;
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText(`❤️ ${20 - this.eliminadosParaCorazon}`, ANCHO - 20*e, 50*e);

                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,215,0,0.5)';
                ctx.font = `${14*e}px Arial`;
                ctx.fillText(`🏆 Récord: ${puntajeMaximo}`, ANCHO - 20*e, 15*e);
            }

            buclePrincipal() {
                if (!this.juegoTerminado) {
                    this.actualizar();
                    this.dibujar();
                    requestAnimationFrame(() => this.buclePrincipal());
                } else {
                    this.mostrarGameOver();
                }
            }

            mostrarGameOver() {
                const e = ESCALA;
                const esRecord = this.puntuacion > puntajeMaximo;
                if (esRecord) {
                    puntajeMaximo = this.puntuacion;
                    localStorage.setItem('zombiePuntajeMaximo', String(puntajeMaximo));
                }

                let esperando = true;

                const drawGameOver = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.fillStyle = C.ROJO;
                    ctx.font = `bold ${60*e}px Arial`;
                    ctx.fillText('💀 GAME OVER', ANCHO / 2, 140*e);

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = `${36*e}px Arial`;
                    ctx.fillText(`Puntuación: ${this.puntuacion}`, ANCHO / 2, 220*e);

                    if (esRecord) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = `bold ${32*e}px Arial`;
                        ctx.fillText('🏆 ¡NUEVO RÉCORD!', ANCHO / 2, 280*e);
                    } else {
                        ctx.fillStyle = C.GRIS;
                        ctx.font = `${24*e}px Arial`;
                        ctx.fillText(`Récord: ${puntajeMaximo}`, ANCHO / 2, 280*e);
                    }

                    ctx.fillStyle = C.GRIS;
                    ctx.font = `${18*e}px Arial`;
                    const minutos = Math.floor((Date.now() - this.tiempoInicio) / 60000);
                    const segundos = Math.floor((Date.now() - this.tiempoInicio) / 1000) % 60;
                    ctx.fillText(`⏱ Tiempo: ${minutos}:${segundos.toString().padStart(2, '0')}`, ANCHO / 2, 330*e);
                    ctx.fillText(`🔫 Zombis derrotados: ${this.puntuacion}`, ANCHO / 2, 360*e);
                    ctx.fillText(`❤️ Corazones recuperados: ${this.corazonesRecogidos}`, ANCHO / 2, 390*e);

                    const btnX = ANCHO / 2 - 120*e;
                    const btnY = 430*e;
                    const btnW = 240*e;
                    const btnH = 55*e;

                    ctx.shadowColor = 'rgba(0,0,255,0.3)';
                    ctx.shadowBlur = 20*e;

                    const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
                    grad.addColorStop(0, '#2979FF');
                    grad.addColorStop(1, '#0D47A1');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, btnW, btnH, 12);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = `bold ${24*e}px Arial`;
                    ctx.fillText('🔄 VOLVER A JUGAR', ANCHO / 2, btnY + btnH / 2);

                    if (esperando) {
                        const handler = () => {
                            esperando = false;
                            canvas.removeEventListener('click', handler);
                            canvas.removeEventListener('touchstart', handler);
                            this.mostrarMenu();
                        };
                        canvas.addEventListener('click', handler);
                        canvas.addEventListener('touchstart', handler);

                        const keyHandler = (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                esperando = false;
                                document.removeEventListener('keydown', keyHandler);
                                this.mostrarMenu();
                            }
                        };
                        document.addEventListener('keydown', keyHandler);
                    }
                };

                drawGameOver();
            }

            mostrarMenu() {
                const e = ESCALA;
                enMenu = true;

                const drawMenu = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);

                    const grad = ctx.createRadialGradient(ANCHO / 2, ALTO / 2, 0, ANCHO / 2, ALTO / 2, 500*e);
                    grad.addColorStop(0, '#1a1a3e');
                    grad.addColorStop(1, '#0a0a0a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.shadowColor = 'rgba(255,0,0,0.3)';
                    ctx.shadowBlur = 30*e;

                    ctx.fillStyle = C.ROJO;
                    ctx.font = `bold ${50*e}px Arial`;
                    ctx.fillText('🧟 ZOMBIE SURVIVOR', ANCHO / 2, 60*e);

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = `${18*e}px Arial`;
                    ctx.fillText('📋 COMANDOS:', ANCHO / 2, 120*e);

                    ctx.fillStyle = C.GRIS;
                    ctx.font = `${14*e}px Arial`;
                    ctx.fillText('🎮 WASD / Flechas: Moverse   |   🖱️ Click: Disparar', ANCHO / 2, 155*e);
                    ctx.fillText('⬆ / W: Saltar (doble salto)   |   G: Lanzar granada', ANCHO / 2, 180*e);
                    ctx.fillText('E / Q: Cambiar arma   |   📱 Toca pantalla para apuntar', ANCHO / 2, 205*e);

                    ctx.fillStyle = '#FFD700';
                    ctx.font = `bold ${22*e}px Arial`;
                    ctx.fillText('💀 ¿Estás listo para la invasión zombi?', ANCHO / 2, 260*e);
                    ctx.fillStyle = C.ROJO;
                    ctx.font = `${18*e}px Arial`;
                    ctx.fillText('¡Suerte la vas a necesitar!', ANCHO / 2, 295*e);

                    if (puntajeMaximo > 0) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = `${16*e}px Arial`;
                        ctx.fillText(`🏆 Récord: ${puntajeMaximo}`, ANCHO / 2, 340*e);
                    }

                    ctx.fillStyle = C.GRIS;
                    ctx.font = `${16*e}px Arial`;
                    ctx.fillText('🎯 Elige tu personaje:', ANCHO / 2, 390*e);

                    const btnHombre = { x: ANCHO / 2 - 180*e, y: 420*e, w: 160*e, h: 60*e };
                    const btnMujer = { x: ANCHO / 2 + 20*e, y: 420*e, w: 160*e, h: 60*e };

                    ctx.shadowColor = 'rgba(0,0,255,0.3)';
                    ctx.shadowBlur = 20*e;

                    const gradH = ctx.createLinearGradient(btnHombre.x, btnHombre.y, btnHombre.x, btnHombre.y + btnHombre.h);
                    gradH.addColorStop(0, '#4488FF');
                    gradH.addColorStop(1, '#0044AA');
                    ctx.fillStyle = gradH;
                    ctx.beginPath();
                    ctx.roundRect(btnHombre.x, btnHombre.y, btnHombre.w, btnHombre.h, 15);
                    ctx.fill();

                    const gradM = ctx.createLinearGradient(btnMujer.x, btnMujer.y, btnMujer.x, btnMujer.y + btnMujer.h);
                    gradM.addColorStop(0, '#FF6B9D');
                    gradM.addColorStop(1, '#CC3388');
                    ctx.fillStyle = gradM;
                    ctx.beginPath();
                    ctx.roundRect(btnMujer.x, btnMujer.y, btnMujer.w, btnMujer.h, 15);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = `bold ${22*e}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.fillText('👨 Hombre', btnHombre.x + btnHombre.w / 2, btnHombre.y + btnHombre.h / 2);
                    ctx.fillText('👩 Mujer', btnMujer.x + btnMujer.w / 2, btnMujer.y + btnMujer.h / 2);

                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = `${12*e}px Arial`;
                    ctx.fillText('🐕‍🦺 Perro policía (Rex) aparece a los 2 minutos', ANCHO / 2, ALTO - 40*e);

                    if (enMenu) {
                        const handler = (e) => {
                            const rect = canvas.getBoundingClientRect();
                            let x, y;
                            if (e.type === 'touchstart') {
                                const touch = e.touches[0];
                                x = touch.clientX - rect.left;
                                y = touch.clientY - rect.top;
                            } else {
                                x = e.clientX - rect.left;
                                y = e.clientY - rect.top;
                            }

                            if (x > btnHombre.x && x < btnHombre.x + btnHombre.w &&
                                y > btnHombre.y && y < btnHombre.y + btnHombre.h) {
                                enMenu = false;
                                canvas.removeEventListener('click', handler);
                                canvas.removeEventListener('touchstart', handler);
                                juegoActual = new Juego('hombre');
                            } else if (x > btnMujer.x && x < btnMujer.x + btnMujer.w &&
                                y > btnMujer.y && y < btnMujer.y + btnMujer.h) {
                                enMenu = false;
                                canvas.removeEventListener('click', handler);
                                canvas.removeEventListener('touchstart', handler);
                                juegoActual = new Juego('mujer');
                            }
                        };
                        canvas.addEventListener('click', handler);
                        canvas.addEventListener('touchstart', handler);
                    }
                };

                drawMenu();
            }
        }

        // ==================== POLYFILL ROUNDRECT ====================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ==================== INICIAR ====================
        resizeCanvas();
        iniciarMusica();
        
        // Crear el juego pero mostrar el menú PRIMERO
        juegoActual = new Juego('hombre');
        juegoActual.mostrarMenu();
    </script>
</body>
