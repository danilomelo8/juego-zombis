<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survivor - Contra Style Mejorado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            display: block;
            background: #1a1a2e;
            cursor: crosshair;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        #mobileControls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 15;
            pointer-events: none;
        }
        #mobileControls button {
            pointer-events: all;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
            min-width: 40px;
            min-height: 40px;
        }
        #mobileControls button:active {
            background: rgba(255,255,255,0.35);
            transform: scale(0.9);
        }
        .dpad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px 50px;
            gap: 3px;
            pointer-events: none;
        }
        .dpad button {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.15);
            color: white;
            font-size: 1.4rem;
            pointer-events: all;
            backdrop-filter: blur(4px);
            min-width: 40px;
            min-height: 40px;
        }
        .dpad button:active {
            background: rgba(255,255,255,0.3);
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            pointer-events: none;
            align-items: flex-end;
        }
        .action-buttons button {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255,50,50,0.25);
            border: 2px solid rgba(255,50,50,0.4);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            pointer-events: all;
            backdrop-filter: blur(4px);
            min-width: 45px;
            min-height: 45px;
        }
        .action-buttons button:nth-child(2) {
            background: rgba(255,200,50,0.25);
            border-color: rgba(255,200,50,0.4);
        }
        .action-buttons button:nth-child(3) {
            background: rgba(50,200,50,0.25);
            border-color: rgba(50,200,50,0.4);
        }
        .action-buttons button:active {
            transform: scale(0.9);
        }
        @media (max-width: 768px) {
            #mobileControls { display: flex !important; }
            .dpad button { width: 45px; height: 45px; font-size: 1.2rem; }
            .action-buttons button { width: 48px; height: 48px; font-size: 0.6rem; }
        }
        @media (max-width: 480px) {
            .dpad { grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px 40px; gap: 2px; }
            .dpad button { width: 40px; height: 40px; font-size: 1rem; }
            .action-buttons button { width: 42px; height: 42px; font-size: 0.5rem; }
        }
        @media (orientation: portrait) and (max-width: 768px) {
            #gameContainer {
                transform: rotate(90deg);
                transform-origin: center center;
                width: 100vh;
                height: 100vw;
                max-width: 100vh;
                max-height: 100vw;
            }
            body {
                overflow: hidden;
                height: 100vh;
                width: 100vw;
            }
        }
        @media (orientation: landscape) and (max-width: 768px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        
        <div id="mobileControls">
            <div class="dpad">
                <button style="grid-column:2;grid-row:1;" data-action="up">▲</button>
                <button style="grid-column:1;grid-row:2;" data-action="left">◀</button>
                <button style="grid-column:2;grid-row:2;" data-action="down">▼</button>
                <button style="grid-column:3;grid-row:2;" data-action="right">▶</button>
                <button style="grid-column:2;grid-row:3;" data-action="jump">⬆</button>
            </div>
            <div class="action-buttons">
                <button data-action="shoot">🔫</button>
                <button data-action="grenade">💣</button>
                <button data-action="switch">🔄</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ANCHO = 900;
        const ALTO = 600;

        // ==================== PLATAFORMAS ====================
        const PLATAFORMAS = [
            { x: 100, y: 450, w: 180, h: 12 },
            { x: 400, y: 450, w: 180, h: 12 },
            { x: 700, y: 450, w: 150, h: 12 },
            { x: 250, y: 340, w: 150, h: 12 },
            { x: 550, y: 340, w: 150, h: 12 },
            { x: 100, y: 230, w: 130, h: 12 },
            { x: 450, y: 230, w: 130, h: 12 },
            { x: 750, y: 230, w: 120, h: 12 }
        ];

        // ==================== COLORES ====================
        const C = {
            NEGRO: '#000000',
            BLANCO: '#FFFFFF',
            ROJO: '#FF1744',
            VERDE: '#00E676',
            AZUL: '#2979FF',
            AMARILLO: '#FFEA00',
            NARANJA: '#FF9100',
            ROSA: '#FF4081',
            GRIS: '#78909C',
            MORADO: '#7C4DFF',
            CIELO: '#00BCD4',
            CAFE: '#795548',
            PIEL: '#FFCCBC',
            PIEL_OSCURA: '#D7A86E'
        };

        // ==================== ESTADO GLOBAL ====================
        let puntajeMaximo = parseInt(localStorage.getItem('zombiePuntajeMaximo')) || 0;
        let juegoActual = null;
        let enMenu = true;

        // ==================== UTILIDADES ====================
        function distancia(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function aleatorio(min, max) {
            return Math.random() * (max - min) + min;
        }

        function aleatorioInt(min, max) {
            return Math.floor(aleatorio(min, max + 1));
        }

        function colisionRect(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // ==================== PARTÍCULAS ====================
        let particulas = [];

        function crearParticulas(x, y, color, cantidad = 10, velocidad = 3) {
            for (let i = 0; i < cantidad; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const vel = 1 + Math.random() * velocidad;
                particulas.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angulo) * vel,
                    dy: Math.sin(angulo) * vel - 1,
                    vida: 20 + Math.random() * 20,
                    vidaMax: 40,
                    radio: 2 + Math.random() * 4,
                    color: color
                });
            }
        }

        function actualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.1;
                p.vida--;
                if (p.vida <= 0) {
                    particulas.splice(i, 1);
                }
            }
        }

        function dibujarParticulas() {
            for (const p of particulas) {
                const alpha = p.vida / p.vidaMax;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radio * alpha, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ==================== CLASES ====================
        class Personaje {
            constructor(x, y, genero) {
                this.x = x;
                this.y = y;
                this.ancho = 30;
                this.alto = 50;
                this.velX = 0;
                this.velY = 0;
                this.velocidad = 4.5;
                this.fuerzaSalto = -11;
                this.genero = genero;
                this.vivo = true;
                this.enSuelo = false;
                this.saltosRestantes = 2;
                this.mirandoDerecha = true;
                this.arma_actual = 'pistola';
                this.balas_escopeta = 0;
                this.balas_metralleta = 30;
                this.max_metralleta = 30;
                this.animacion = 0;
                this.animacionFrame = 0;
                this.tiempoAnimacion = 0;
                this.anguloArma = 0;
                this.corazones = 3;
                this.maxCorazones = 3;
                this.invulnerable = 0;
                this.granadas = 3;
                this.maxGranadas = 3;
                this.tiempoRecarga = 0;
                this.recargando = false;
            }

            get centroX() { return this.x + this.ancho / 2; }
            get centroY() { return this.y + this.alto / 2; }

            saltar() {
                if (this.saltosRestantes > 0) {
                    this.velY = this.fuerzaSalto;
                    this.saltosRestantes--;
                    this.enSuelo = false;
                    crearParticulas(this.centroX, this.y + this.alto, C.BLANCO, 8, 2);
                }
            }

            mover(teclas, mouseX, mouseY) {
                let dx = 0;
                if (teclas['ArrowLeft'] || teclas['a']) dx = -this.velocidad;
                if (teclas['ArrowRight'] || teclas['d']) dx = this.velocidad;

                // Dirección basada en el mouse
                const anguloMouse = Math.atan2(mouseY - this.centroY, mouseX - this.centroX);
                this.anguloArma = anguloMouse;
                if (Math.abs(anguloMouse) < Math.PI / 2) {
                    this.mirandoDerecha = true;
                } else {
                    this.mirandoDerecha = false;
                }

                this.velX = dx;
                this.x += this.velX;

                // Gravedad
                this.velY += 0.5;
                if (this.velY > 12) this.velY = 12;
                this.y += this.velY;

                // Colisión con plataformas
                this.enSuelo = false;
                for (const p of PLATAFORMAS) {
                    if (this.velY >= 0 &&
                        this.x + this.ancho > p.x + 5 && this.x < p.x + p.w - 5 &&
                        this.y + this.alto > p.y && this.y + this.alto < p.y + p.h + 15) {
                        this.y = p.y - this.alto;
                        this.velY = 0;
                        this.enSuelo = true;
                        this.saltosRestantes = 2;
                    }
                }

                // Colisión con el suelo
                if (this.y + this.alto >= ALTO - 50) {
                    this.y = ALTO - 50 - this.alto;
                    this.velY = 0;
                    this.enSuelo = true;
                    this.saltosRestantes = 2;
                }

                // Límites laterales
                this.x = Math.max(0, Math.min(ANCHO - this.ancho, this.x));

                // Animación
                if (Math.abs(this.velX) > 0.5) {
                    this.tiempoAnimacion += 0.15;
                    if (this.tiempoAnimacion > 1) {
                        this.tiempoAnimacion = 0;
                        this.animacionFrame = (this.animacionFrame + 1) % 4;
                    }
                } else {
                    this.animacionFrame = 0;
                    this.tiempoAnimacion = 0;
                }

                if (this.invulnerable > 0) this.invulnerable--;
                
                // Recarga de metralleta
                if (this.recargando) {
                    this.tiempoRecarga++;
                    if (this.tiempoRecarga > 60) {
                        this.balas_metralleta = this.max_metralleta;
                        this.recargando = false;
                        this.tiempoRecarga = 0;
                    }
                }
            }

            disparar(mouseX, mouseY) {
                if (this.arma_actual === 'pistola') {
                    const angulo = Math.atan2(mouseY - this.centroY, mouseX - this.centroX);
                    const bala = new Bala(this.centroX + Math.cos(angulo) * 20, 
                                         this.centroY + Math.sin(angulo) * 20 - 5, 
                                         angulo, 'pistola');
                    return bala;
                } else if (this.arma_actual === 'escopeta' && this.balas_escopeta > 0) {
                    const angulo = Math.atan2(mouseY - this.centroY, mouseX - this.centroX);
                    const balas = [];
                    for (let i = -3; i <= 3; i++) {
                        const anguloEscopeta = angulo + (i * 0.08);
                        balas.push(new Bala(this.centroX + Math.cos(angulo) * 20,
                                           this.centroY + Math.sin(angulo) * 20 - 5,
                                           anguloEscopeta, 'escopeta'));
                    }
                    this.balas_escopeta--;
                    if (this.balas_escopeta === 0) {
                        this.arma_actual = 'pistola';
                    }
                    return balas;
                } else if (this.arma_actual === 'metralleta' && this.balas_metralleta > 0) {
                    const angulo = Math.atan2(mouseY - this.centroY, mouseX - this.centroX);
                    this.balas_metralleta--;
                    if (this.balas_metralleta === 0) {
                        this.recargando = true;
                        this.tiempoRecarga = 0;
                    }
                    return [new Bala(this.centroX + Math.cos(angulo) * 20,
                                   this.centroY + Math.sin(angulo) * 20 - 5,
                                   angulo, 'metralleta')];
                }
                return null;
            }

            lanzarGranada(mouseX, mouseY) {
                if (this.granadas <= 0) return null;
                const angulo = Math.atan2(mouseY - this.centroY, mouseX - this.centroX);
                this.granadas--;
                return new Granada(this.centroX, this.centroY, angulo);
            }

            cambiarArma() {
                const armas = ['pistola', 'escopeta', 'metralleta'];
                const idx = armas.indexOf(this.arma_actual);
                let nuevaIdx = (idx + 1) % armas.length;
                // Si no tiene balas de escopeta o metralleta, saltar
                while ((armas[nuevaIdx] === 'escopeta' && this.balas_escopeta === 0) ||
                       (armas[nuevaIdx] === 'metralleta' && this.balas_metralleta === 0)) {
                    nuevaIdx = (nuevaIdx + 1) % armas.length;
                    if (nuevaIdx === idx) break;
                }
                this.arma_actual = armas[nuevaIdx];
                this.recargando = false;
                this.tiempoRecarga = 0;
            }

            recibirDaño(daño) {
                if (this.invulnerable > 0) return false;
                this.corazones -= daño;
                this.invulnerable = 60;
                crearParticulas(this.centroX, this.centroY, C.ROJO, 20, 5);
                if (this.corazones <= 0) {
                    this.corazones = 0;
                    this.vivo = false;
                }
                return true;
            }

            dibujar() {
                ctx.save();
                
                if (this.invulnerable > 0 && Math.floor(this.invulnerable / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                const x = this.x;
                const y = this.y;
                const dir = this.mirandoDerecha ? 1 : -1;

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 5;

                // Cuerpo - Diferenciación clara entre hombre y mujer
                if (this.genero === 'hombre') {
                    // Hombre - Cuerpo más cuadrado y ancho
                    const grad = ctx.createLinearGradient(x, y, x + this.ancho, y);
                    grad.addColorStop(0, '#1a237e');
                    grad.addColorStop(0.5, '#283593');
                    grad.addColorStop(1, '#1a237e');
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(x + 3, y + 10, 24, 28);
                    
                    // Cinturón
                    ctx.fillStyle = '#4a2c0a';
                    ctx.fillRect(x + 3, y + 32, 24, 4);
                    
                    // Hombros más anchos
                    ctx.fillStyle = '#1a237e';
                    ctx.fillRect(x + 1, y + 12, 5, 8);
                    ctx.fillRect(x + 24, y + 12, 5, 8);
                } else {
                    // Mujer - Cuerpo más estilizado y curvas
                    // Vestido
                    const grad = ctx.createLinearGradient(x, y, x + this.ancho, y);
                    grad.addColorStop(0, '#4a148c');
                    grad.addColorStop(0.5, '#6a1b9a');
                    grad.addColorStop(1, '#4a148c');
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 10;
                    // Cuerpo más delgado
                    ctx.fillRect(x + 5, y + 10, 20, 22);
                    
                    // Vestido - forma de falda
                    ctx.fillStyle = '#6a1b9a';
                    ctx.beginPath();
                    ctx.moveTo(x + 2, y + 32);
                    ctx.lineTo(x + 28, y + 32);
                    ctx.lineTo(x + 30, y + 40);
                    ctx.lineTo(x + 0, y + 40);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Cintura más marcada
                    ctx.fillStyle = '#4a148c';
                    ctx.fillRect(x + 8, y + 28, 14, 3);
                    
                    // Pecho (sutil)
                    ctx.fillStyle = '#7c4dff';
                    ctx.beginPath();
                    ctx.arc(x + 11, y + 16, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 19, y + 16, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Hombros más estrechos
                    ctx.fillStyle = '#4a148c';
                    ctx.fillRect(x + 3, y + 12, 4, 6);
                    ctx.fillRect(x + 23, y + 12, 4, 6);
                }

                ctx.shadowBlur = 0;

                // Cabeza
                ctx.fillStyle = C.PIEL;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2, y + 10, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Pelo - Diferenciación clara
                if (this.genero === 'hombre') {
                    // Pelo corto masculino
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2, y + 5, 13, 0, Math.PI);
                    ctx.fill();
                    ctx.fillRect(x + 4, y + 1, 22, 5);
                    // Barba (opcional)
                    ctx.fillStyle = 'rgba(30,30,30,0.3)';
                    ctx.fillRect(x + 8, y + 16, 14, 4);
                } else {
                    // Pelo largo femenino
                    ctx.fillStyle = '#8B4513';
                    // Pelo largo cayendo
                    for (let i = -2; i <= 2; i += 0.8) {
                        ctx.beginPath();
                        ctx.moveTo(x + this.ancho / 2 + i * 6, y + 4);
                        ctx.quadraticCurveTo(
                            x + this.ancho / 2 + i * 12 + (i > 0 ? 8 : -8),
                            y + 20 + Math.abs(i) * 4,
                            x + this.ancho / 2 + i * 14 + (i > 0 ? 12 : -12),
                            y + 32 + Math.abs(i) * 6
                        );
                        ctx.lineWidth = 3 + Math.abs(i) * 1.5;
                        ctx.stroke();
                    }
                    // Moño
                    ctx.fillStyle = '#6B3410';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2 + 12 * dir, y + 2, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(x + this.ancho / 2 + 10 * dir, y - 2, 4, 8);
                    // Lazo
                    ctx.fillStyle = '#FF6B9D';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2 + 14 * dir, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2 + 10 * dir, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Ojos
                const ojoX = x + this.ancho / 2 + (this.mirandoDerecha ? 4 : -4);
                ctx.fillStyle = C.BLANCO;
                ctx.beginPath();
                ctx.arc(ojoX - 4, y + 8, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ojoX + 4, y + 8, 3.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Pestañas (más largas para mujer)
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 1.5;
                if (this.genero === 'mujer') {
                    // Pestañas largas
                    for (let i = -1; i <= 1; i+=0.5) {
                        ctx.beginPath();
                        ctx.moveTo(ojoX - 4 + i * 2, y + 6);
                        ctx.lineTo(ojoX - 4 + i * 3, y + 3);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(ojoX + 4 + i * 2, y + 6);
                        ctx.lineTo(ojoX + 4 + i * 3, y + 3);
                        ctx.stroke();
                    }
                }
                
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(ojoX - 3 + (this.mirandoDerecha ? 1 : -1), y + 9, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ojoX + 5 + (this.mirandoDerecha ? 1 : -1), y + 9, 2, 0, Math.PI * 2);
                ctx.fill();

                // Boca - Diferente para hombre y mujer
                ctx.strokeStyle = '#5D4037';
                ctx.lineWidth = 1.5;
                if (this.genero === 'mujer') {
                    // Labios más definidos
                    ctx.fillStyle = '#E57373';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2, y + 15, 4, 0, Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#5D4037';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x + this.ancho / 2 - 4, y + 15);
                    ctx.quadraticCurveTo(x + this.ancho / 2, y + 12, x + this.ancho / 2 + 4, y + 15);
                    ctx.stroke();
                } else {
                    // Boca más simple
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2, y + 15, 4, 0.1 * Math.PI, 0.9 * Math.PI);
                    ctx.stroke();
                }

                // Brazos - Diferentes para hombre y mujer
                ctx.fillStyle = C.PIEL;
                const brazoY = y + 18;
                const brazoX = x + (this.mirandoDerecha ? this.ancho : -8);
                if (this.genero === 'hombre') {
                    // Brazos más gruesos
                    ctx.fillRect(brazoX - 4, brazoY, 8, 14);
                } else {
                    // Brazos más delgados
                    ctx.fillRect(brazoX - 3, brazoY, 6, 14);
                }

                // Mano / Arma
                const manoX = brazoX + (this.mirandoDerecha ? 3 : -3);
                const manoY = brazoY + 12;
                this.dibujarArma(manoX, manoY);

                // Piernas - Diferentes para hombre y mujer
                if (this.genero === 'hombre') {
                    ctx.fillStyle = '#1a237e';
                } else {
                    ctx.fillStyle = '#4a148c';
                }
                const paso = this.animacionFrame * 0.3;
                const offset1 = Math.sin(paso) * 3;
                const offset2 = Math.sin(paso + Math.PI) * 3;
                
                if (this.genero === 'hombre') {
                    // Piernas más gruesas
                    ctx.fillRect(x + 4, y + 38, 8, 12 + offset1);
                    ctx.fillRect(x + 18, y + 38, 8, 12 + offset2);
                } else {
                    // Piernas más delgadas con vestido
                    ctx.fillRect(x + 5, y + 38, 6, 12 + offset1);
                    ctx.fillRect(x + 19, y + 38, 6, 12 + offset2);
                }

                // Zapatos
                ctx.fillStyle = '#4E342E';
                if (this.genero === 'mujer') {
                    // Tacones (sutil)
                    ctx.fillRect(x + 3, y + 50 + offset1, 10, 4);
                    ctx.fillRect(x + 17, y + 50 + offset2, 10, 4);
                    // Tacón
                    ctx.fillRect(x + 1, y + 52 + offset1, 4, 3);
                    ctx.fillRect(x + 25, y + 52 + offset2, 4, 3);
                } else {
                    ctx.fillRect(x + 3, y + 50 + offset1, 10, 4);
                    ctx.fillRect(x + 17, y + 50 + offset2, 10, 4);
                }

                ctx.restore();

                // Corazones
                this.dibujarCorazones();
            }

            dibujarArma(manoX, manoY) {
                const angulo = this.anguloArma;
                const largo = 20;
                const dir = this.mirandoDerecha ? 1 : -1;

                ctx.save();
                ctx.translate(manoX, manoY);
                ctx.rotate(angulo * dir);

                if (this.arma_actual === 'pistola') {
                    ctx.fillStyle = '#37474F';
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, -3, largo, 6);
                    ctx.fillRect(largo - 5, -5, 5, 10);
                    ctx.fillStyle = '#546E7A';
                    ctx.fillRect(largo - 2, -4, 4, 8);
                    ctx.fillStyle = '#263238';
                    ctx.fillRect(8, 0, 2, 4);
                } else if (this.arma_actual === 'escopeta') {
                    ctx.fillStyle = '#5D4037';
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, -4, largo + 5, 8);
                    ctx.fillStyle = '#795548';
                    ctx.fillRect(largo + 3, -5, 4, 10);
                    ctx.fillStyle = '#4E342E';
                    ctx.fillRect(-8, -3, 10, 6);
                    ctx.fillStyle = '#8D6E63';
                    ctx.fillRect(5, -2, 3, 4);
                    ctx.fillRect(12, -2, 3, 4);
                } else if (this.arma_actual === 'metralleta') {
                    ctx.fillStyle = '#263238';
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, -3, largo + 8, 6);
                    ctx.fillStyle = '#37474F';
                    ctx.fillRect(largo + 4, -4, 6, 8);
                    ctx.fillStyle = '#546E7A';
                    ctx.fillRect(largo + 2, -5, 3, 10);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(5, 2, 8, 6);
                }

                ctx.restore();
            }

            dibujarCorazones() {
                const startX = this.x - 10;
                const startY = this.y - 25;
                const spacing = 20;
                
                for (let i = 0; i < this.maxCorazones; i++) {
                    const x = startX + i * spacing;
                    const y = startY;
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (i < this.corazones) {
                        ctx.fillStyle = '#FF1744';
                        ctx.shadowColor = '#FF1744';
                        ctx.shadowBlur = 15;
                        ctx.fillText('❤️', x + 8, y + 10);
                    } else {
                        ctx.fillStyle = '#333';
                        ctx.shadowBlur = 0;
                        ctx.fillText('🖤', x + 8, y + 10);
                    }
                }
                ctx.shadowBlur = 0;
            }
        }

        class Zombi {
            constructor(x, y, nivel) {
                this.x = x;
                this.y = y;
                this.ancho = 28;
                this.alto = 44;
                this.vida = nivel;
                this.maxVida = nivel;
                this.velocidad = 1 + nivel * 0.15;
                this.nivel = nivel;
                this.radio = 16;
                this.tiempoAtaque = 0;
                this.animacion = 0;
                this.animacionFrame = 0;
                this.tiempoAnimacion = 0;
                this.tipo = Math.random() < 0.3 ? 'rapido' : 'normal';
                this.tiempoDisparo = 0;
                this.puedeDisparar = nivel >= 3;
                if (this.tipo === 'rapido') {
                    this.velocidad *= 1.4;
                    this.vida = Math.max(1, this.vida - 1);
                    this.maxVida = this.vida;
                }
            }

            get centroX() { return this.x + this.ancho / 2; }
            get centroY() { return this.y + this.alto / 2; }

            moverHacia(objetivo) {
                const dx = objetivo.centroX - this.centroX;
                const dy = objetivo.centroY - this.centroY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 20) {
                    const movX = (dx / dist) * this.velocidad;
                    const movY = (dy / dist) * this.velocidad;
                    this.x += movX;
                    this.y += movY;
                }

                for (const p of PLATAFORMAS) {
                    if (this.x + this.ancho > p.x + 2 && this.x < p.x + p.w - 2 &&
                        this.y + this.alto > p.y && this.y + this.alto < p.y + p.h + 10) {
                        this.y = p.y - this.alto;
                    }
                }

                this.x = Math.max(0, Math.min(ANCHO - this.ancho, this.x));
                this.y = Math.max(0, Math.min(ALTO - 50 - this.alto, this.y));

                this.tiempoAnimacion += 0.1;
                if (this.tiempoAnimacion > 1) {
                    this.tiempoAnimacion = 0;
                    this.animacionFrame = (this.animacionFrame + 1) % 4;
                }
            }

            dibujar() {
                const x = this.x;
                const y = this.y;
                const colores = [C.VERDE, C.NARANJA, C.ROJO, C.MORADO, '#8B0000'];
                const color = colores[Math.min(this.nivel - 1, colores.length - 1)];

                ctx.save();

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 3;

                ctx.fillStyle = color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.roundRect(x + 3, y + 6, 22, 28, 4);
                ctx.fill();

                ctx.shadowBlur = 0;

                ctx.fillStyle = '#2E7D32';
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2, y + 8, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();

                const grad = ctx.createRadialGradient(x + this.ancho / 2 - 4, y + 6, 0, x + this.ancho / 2 - 4, y + 6, 5);
                grad.addColorStop(0, '#FF1744');
                grad.addColorStop(1, '#B71C1C');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 - 4, y + 6, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + 4, y + 6, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = C.NEGRO;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 - 3, y + 7, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + 5, y + 7, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = C.BLANCO;
                for (let i = -6; i <= 6; i += 4) {
                    ctx.fillRect(x + this.ancho / 2 + i - 1, y + 12, 3, 4);
                }

                if (this.nivel >= 3) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(x + 5, y + 8);
                    ctx.lineTo(x + 15, y + 18);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + this.ancho - 5, y + 8);
                    ctx.lineTo(x + this.ancho - 15, y + 18);
                    ctx.stroke();
                }

                ctx.fillStyle = '#1B5E20';
                const paso = this.animacionFrame * 0.2;
                ctx.fillRect(x - 4, y + 14 + Math.sin(paso) * 3, 5, 12);
                ctx.fillRect(x + this.ancho - 1, y + 14 + Math.sin(paso + Math.PI) * 3, 5, 12);

                ctx.fillStyle = color;
                const paso2 = this.animacionFrame * 0.3;
                ctx.fillRect(x + 4, y + 34 + Math.sin(paso2) * 2, 7, 10 + Math.sin(paso2) * 2);
                ctx.fillRect(x + 17, y + 34 + Math.sin(paso2 + Math.PI) * 2, 7, 10 + Math.sin(paso2 + Math.PI) * 2);

                ctx.restore();

                if (this.vida < this.maxVida) {
                    const anchoBarra = this.ancho + 10;
                    const xBarra = x - 5;
                    const yBarra = y - 12;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(xBarra, yBarra, anchoBarra, 4);
                    ctx.fillStyle = this.vida / this.maxVida > 0.5 ? C.VERDE : C.ROJO;
                    ctx.fillRect(xBarra, yBarra, anchoBarra * (this.vida / this.maxVida), 4);
                }

                if (this.tipo === 'rapido') {
                    ctx.fillStyle = 'rgba(255,255,0,0.3)';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚡', this.centroX, y - 16);
                }
            }

            recibirDaño(daño) {
                this.vida -= daño;
                crearParticulas(this.centroX, this.centroY, C.ROJO, 10, 3);
                return this.vida <= 0;
            }
        }

        class Bala {
            constructor(x, y, angulo, tipo = 'pistola', esEnemiga = false) {
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.esEnemiga = esEnemiga;
                this.velocidad = tipo === 'pistola' ? 14 : tipo === 'metralleta' ? 16 : 10;
                this.radio = tipo === 'pistola' ? 4 : tipo === 'metralleta' ? 3 : 8;
                this.dx = Math.cos(angulo) * this.velocidad;
                this.dy = Math.sin(angulo) * this.velocidad;
                this.dano = tipo === 'escopeta' ? 3 : tipo === 'metralleta' ? 1 : 1;
                this.trail = [];
                this.vida = 80;
            }

            mover() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();
                this.x += this.dx;
                this.y += this.dy;
                this.vida--;
            }

            dibujar() {
                for (let i = 0; i < this.trail.length; i++) {
                    const alpha = i / this.trail.length * 0.4;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, this.radio * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = this.esEnemiga ?
                        `rgba(255, 0, 0, ${alpha})` :
                        this.tipo === 'pistola' ? `rgba(255, 255, 0, ${alpha})` : 
                        this.tipo === 'metralleta' ? `rgba(0, 200, 255, ${alpha})` :
                        `rgba(255, 165, 0, ${alpha})`;
                    ctx.fill();
                }

                const grad = ctx.createRadialGradient(
                    this.x - 2, this.y - 2, 0,
                    this.x, this.y, this.radio
                );
                if (this.esEnemiga) {
                    grad.addColorStop(0, '#FF6666');
                    grad.addColorStop(1, '#CC0000');
                } else if (this.tipo === 'pistola') {
                    grad.addColorStop(0, '#FFFF88');
                    grad.addColorStop(1, '#CCAA00');
                } else if (this.tipo === 'metralleta') {
                    grad.addColorStop(0, '#88FFFF');
                    grad.addColorStop(1, '#0099CC');
                } else {
                    grad.addColorStop(0, '#FFAA44');
                    grad.addColorStop(1, '#CC6600');
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - 1, this.y - 2, this.radio * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }
        }

        class Granada {
            constructor(x, y, angulo) {
                this.x = x;
                this.y = y;
                // Velocidad reducida a la mitad
                this.vx = Math.cos(angulo) * 3;
                this.vy = Math.sin(angulo) * 3 - 2;
                this.radio = 10;
                this.alive = true;
                this.timer = 90;
                this.exploto = false;
                this.explosionRadio = 0;
                this.maxExplosion = 130;
                this.explosionTimer = 0;
                this.haExplotado = false;
            }

            mover() {
                if (this.exploto) {
                    this.explosionTimer++;
                    this.explosionRadio += 4;
                    if (this.explosionTimer > 25) this.alive = false;
                    return;
                }

                this.timer--;
                this.vy += 0.3;
                this.x += this.vx;
                this.y += this.vy;

                for (const p of PLATAFORMAS) {
                    if (this.x > p.x && this.x < p.x + p.w &&
                        this.y + this.radio > p.y && this.y + this.radio < p.y + p.h + 10) {
                        this.y = p.y - this.radio;
                        this.vy *= -0.3;
                    }
                }

                if (this.y + this.radio > ALTO - 50) {
                    this.y = ALTO - 50 - this.radio;
                    this.vy *= -0.3;
                }

                if (this.timer <= 0) {
                    this.exploto = true;
                    this.haExplotado = true;
                }
            }

            // Verificar colisión con zombi (explosión al contacto)
            colisionaCon(zombi) {
                if (this.exploto) return false;
                const dist = distancia(this.x, this.y, zombi.centroX, zombi.centroY);
                return dist < this.radio + 16;
            }

            dibujar() {
                if (this.exploto) {
                    const alpha = 1 - (this.explosionTimer / 25);
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.explosionRadio);
                    grad.addColorStop(0, `rgba(255,200,50,${alpha * 0.9})`);
                    grad.addColorStop(0.3, `rgba(255,100,20,${alpha * 0.7})`);
                    grad.addColorStop(0.7, `rgba(200,50,0,${alpha * 0.5})`);
                    grad.addColorStop(1, `rgba(100,20,0,0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.explosionRadio, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.shadowColor = '#ff8800';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = `rgba(255,200,100,${alpha * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.explosionRadio * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    return;
                }

                ctx.shadowColor = '#333';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(this.x - 3, this.y - 12, 6, 4);
                if (Math.floor(this.timer / 10) % 2 === 0) {
                    ctx.fillStyle = '#ff3333';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            getDaño(zombi) {
                if (!this.exploto) return 0;
                const dist = distancia(this.x, this.y, zombi.centroX, zombi.centroY);
                if (dist < this.explosionRadio) {
                    const factor = 1 - (dist / this.explosionRadio);
                    return Math.floor(8 * factor);
                }
                return 0;
            }
        }

        class ArmaSuelo {
            constructor(x, y, tipo) {
                this.x = x;
                this.y = this.encontrarPiso(x, y);
                this.tipo = tipo;
                this.radio = 14;
                this.activo = true;
                this.tiempo = 0;
                this.flotando = 0;
                this.brillo = 0;
                this.timer = 600;
            }

            encontrarPiso(x, y) {
                let pisoY = ALTO - 50;
                for (const p of PLATAFORMAS) {
                    if (x > p.x && x < p.x + p.w && y < p.y) {
                        if (p.y < pisoY) pisoY = p.y;
                    }
                }
                return pisoY - 20;
            }

            dibujar() {
                if (!this.activo || this.timer <= 0) return;
                this.tiempo++;
                this.flotando = Math.sin(this.tiempo * 0.05) * 4;
                this.brillo = 0.5 + Math.sin(this.tiempo * 0.1) * 0.3;

                ctx.save();

                ctx.shadowColor = `rgba(255, 165, 0, ${this.brillo})`;
                ctx.shadowBlur = 25;

                const grad = ctx.createRadialGradient(
                    this.x, this.y + this.flotando, 0,
                    this.x, this.y + this.flotando, this.radio
                );
                grad.addColorStop(0, '#FFB74D');
                grad.addColorStop(1, '#E65100');
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.flotando, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = C.BLANCO;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;

                ctx.fillStyle = C.BLANCO;
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const icono = this.tipo === 'escopeta' ? '🔫' : '🔫';
                ctx.fillText(icono, this.x, this.y + this.flotando);

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '9px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(this.tipo.toUpperCase(), this.x, this.y + this.flotando + this.radio + 4);

                ctx.restore();
            }
        }

        // ==================== CLASE PRINCIPAL ====================
        class Juego {
            constructor(genero) {
                this.jugador = new Personaje(ANCHO / 2 - 15, ALTO - 100, genero);
                this.zombis = [];
                this.balas = [];
                this.balasEnemigas = [];
                this.armasSuelo = [];
                this.granadas = [];
                this.puntuacion = 0;
                this.tiempoInicio = Date.now();
                this.ultimoSpawn = 0;
                this.juegoTerminado = false;
                this.zombisPorSpawn = 1;
                this.tiempoEntreSpawn = 1500;
                this.ultimoDisparo = 0;
                this.tiempoEntreDisparos = 100;
                this.teclas = {};
                this.mouseX = ANCHO / 2;
                this.mouseY = ALTO / 2;
                this.mousePresionado = false;
                this.tiempoAtaqueZombi = 0;
                this.disparoCooldown = 0;
                this.minutoActual = 0;
                this.spawnCount = 0;

                this.setupEventListeners();
                this.buclePrincipal();
            }

            setupEventListeners() {
                const keyHandler = (e) => {
                    const key = e.key.toLowerCase();
                    this.teclas[key] = e.type === 'keydown';
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                        e.preventDefault();
                    }
                    if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && e.type === 'keydown') {
                        this.jugador.saltar();
                    }
                    if (e.key === 'g' && e.type === 'keydown') {
                        const granada = this.jugador.lanzarGranada(this.mouseX, this.mouseY);
                        if (granada) this.granadas.push(granada);
                    }
                    if ((e.key === 'e' || e.key === 'q') && e.type === 'keydown') {
                        this.jugador.cambiarArma();
                    }
                };

                document.addEventListener('keydown', keyHandler);
                document.addEventListener('keyup', keyHandler);

                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    this.mouseX = (e.clientX - rect.left) * scaleX;
                    this.mouseY = (e.clientY - rect.top) * scaleY;
                });

                canvas.addEventListener('mousedown', (e) => {
                    if (e.button === 0) {
                        this.mousePresionado = true;
                        if (this.jugador.vivo && !this.juegoTerminado) {
                            this.disparar();
                        }
                    }
                });

                canvas.addEventListener('mouseup', (e) => {
                    if (e.button === 0) {
                        this.mousePresionado = false;
                    }
                });

                canvas.addEventListener('mouseleave', () => {
                    this.mousePresionado = false;
                });

                canvas.addEventListener('contextmenu', (e) => e.preventDefault());

                setInterval(() => {
                    if (this.mousePresionado && this.jugador.vivo && !this.juegoTerminado) {
                        this.disparar();
                    }
                }, 50);

                document.querySelectorAll('#mobileControls button').forEach(btn => {
                    const action = btn.dataset.action;
                    
                    const startAction = (e) => {
                        e.preventDefault();
                        if (!this.jugador.vivo || this.juegoTerminado) return;
                        if (action === 'up') this.teclas['w'] = true;
                        else if (action === 'down') this.teclas['s'] = true;
                        else if (action === 'left') this.teclas['a'] = true;
                        else if (action === 'right') this.teclas['d'] = true;
                        else if (action === 'jump') this.jugador.saltar();
                        else if (action === 'shoot') this.disparar();
                        else if (action === 'grenade') {
                            const granada = this.jugador.lanzarGranada(this.mouseX, this.mouseY);
                            if (granada) this.granadas.push(granada);
                        }
                        else if (action === 'switch') this.jugador.cambiarArma();
                    };
                    
                    const endAction = (e) => {
                        e.preventDefault();
                        if (action === 'up') this.teclas['w'] = false;
                        else if (action === 'down') this.teclas['s'] = false;
                        else if (action === 'left') this.teclas['a'] = false;
                        else if (action === 'right') this.teclas['d'] = false;
                    };
                    
                    btn.addEventListener('touchstart', startAction, { passive: false });
                    btn.addEventListener('touchend', endAction, { passive: false });
                    btn.addEventListener('touchcancel', endAction, { passive: false });
                    btn.addEventListener('mousedown', startAction);
                    btn.addEventListener('mouseup', endAction);
                    btn.addEventListener('mouseleave', endAction);
                });

                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                }, { passive: false });
            }

            disparar() {
                if (this.disparoCooldown > 0) return;
                if (!this.jugador.vivo) return;

                const balas = this.jugador.disparar(this.mouseX, this.mouseY);
                if (balas) {
                    if (Array.isArray(balas)) {
                        this.balas.push(...balas);
                    } else {
                        this.balas.push(balas);
                    }
                    this.disparoCooldown = 8;
                    this.ultimoDisparo = Date.now();
                    
                    const angulo = Math.atan2(this.mouseY - this.jugador.centroY, this.mouseX - this.jugador.centroX);
                    crearParticulas(this.jugador.centroX + Math.cos(angulo) * 25,
                                   this.jugador.centroY + Math.sin(angulo) * 25, '#FFD700', 5, 2);
                }
            }

            spawnZombi(minutos) {
                const nivelResistencia = Math.min(minutos + 1, 8);
                const margen = 50;
                let x, y;

                const lado = Math.floor(Math.random() * 4);
                if (lado === 0) { x = Math.random() * ANCHO; y = -margen; }
                else if (lado === 1) { x = Math.random() * ANCHO; y = ALTO - 50 + margen; }
                else if (lado === 2) { x = -margen; y = Math.random() * (ALTO - 50); }
                else { x = ANCHO + margen; y = Math.random() * (ALTO - 50); }

                const dist = distancia(x, y, this.jugador.centroX, this.jugador.centroY);
                if (dist < 250) {
                    x = Math.random() * ANCHO;
                    y = Math.random() * (ALTO - 50);
                }

                this.zombis.push(new Zombi(x, y, nivelResistencia));
            }

            actualizar() {
                if (!this.jugador.vivo || this.juegoTerminado) return;

                const tiempoActual = Date.now();
                const minutos = Math.floor((tiempoActual - this.tiempoInicio) / 60000);
                this.minutoActual = minutos;

                this.jugador.mover(this.teclas, this.mouseX, this.mouseY);
                this.disparoCooldown = Math.max(0, this.disparoCooldown - 1);

                // Actualizar balas del jugador
                for (let i = this.balas.length - 1; i >= 0; i--) {
                    const bala = this.balas[i];
                    bala.mover();
                    if (bala.x < -20 || bala.x > ANCHO + 20 || bala.y < -20 || bala.y > ALTO + 20 || bala.vida <= 0) {
                        this.balas.splice(i, 1);
                    }
                }

                // Actualizar balas enemigas
                for (let i = this.balasEnemigas.length - 1; i >= 0; i--) {
                    const bala = this.balasEnemigas[i];
                    bala.mover();
                    if (bala.x < -20 || bala.x > ANCHO + 20 || bala.y < -20 || bala.y > ALTO + 20 || bala.vida <= 0) {
                        this.balasEnemigas.splice(i, 1);
                    }
                    if (this.jugador.vivo) {
                        const dist = distancia(bala.x, bala.y, this.jugador.centroX, this.jugador.centroY);
                        if (dist < bala.radio + 15) {
                            this.jugador.recibirDaño(1);
                            this.balasEnemigas.splice(i, 1);
                            if (!this.jugador.vivo) {
                                this.juegoTerminado = true;
                                return;
                            }
                        }
                    }
                }

                // Actualizar granadas
                for (let i = this.granadas.length - 1; i >= 0; i--) {
                    const granada = this.granadas[i];
                    granada.mover();
                    
                    // Verificar colisión con zombis (explosión al contacto)
                    if (!granada.exploto) {
                        for (const zombi of this.zombis) {
                            if (granada.colisionaCon(zombi)) {
                                granada.exploto = true;
                                granada.haExplotado = true;
                                break;
                            }
                        }
                    }
                    
                    if (!granada.alive) {
                        this.granadas.splice(i, 1);
                        continue;
                    }
                    
                    if (granada.exploto) {
                        for (const zombi of this.zombis) {
                            const daño = granada.getDaño(zombi);
                            if (daño > 0) {
                                if (zombi.recibirDaño(daño)) {
                                    this.puntuacion += 10 + minutos;
                                    this.spawnCount++;
                                    if (Math.random() < 0.15) {
                                        const tipos = ['escopeta', 'metralleta'];
                                        const tipo = tipos[Math.floor(Math.random() * tipos.length)];
                                        this.armasSuelo.push(new ArmaSuelo(zombi.x, zombi.y, tipo));
                                    }
                                    crearParticulas(zombi.centroX, zombi.centroY, C.VERDE, 20, 5);
                                }
                            }
                        }
                    }
                }

                // Actualizar zombis
                for (let i = this.zombis.length - 1; i >= 0; i--) {
                    const zombi = this.zombis[i];
                    zombi.moverHacia(this.jugador);

                    const dist = distancia(zombi.centroX, zombi.centroY, this.jugador.centroX, this.jugador.centroY);
                    if (dist < 30) {
                        if (this.tiempoAtaqueZombi <= 0) {
                            this.jugador.recibirDaño(1);
                            this.tiempoAtaqueZombi = 40;
                            if (!this.jugador.vivo) {
                                this.juegoTerminado = true;
                                return;
                            }
                        }
                    }

                    if (zombi.puedeDisparar && dist < 350 && dist > 50) {
                        zombi.tiempoDisparo++;
                        if (zombi.tiempoDisparo > 40 + Math.random() * 30) {
                            zombi.tiempoDisparo = 0;
                            const angulo = Math.atan2(this.jugador.centroY - zombi.centroY,
                                                    this.jugador.centroX - zombi.centroX);
                            this.balasEnemigas.push(new Bala(zombi.centroX, zombi.centroY, angulo, 'pistola', true));
                        }
                    }

                    for (let j = this.balas.length - 1; j >= 0; j--) {
                        const bala = this.balas[j];
                        const distBala = distancia(bala.x, bala.y, zombi.centroX, zombi.centroY);
                        if (distBala < bala.radio + 16) {
                            if (zombi.recibirDaño(bala.dano)) {
                                this.zombis.splice(i, 1);
                                this.puntuacion += 5 + Math.floor(minutos * 0.5);
                                this.spawnCount++;
                                if (Math.random() < 0.12) {
                                    const tipos = ['escopeta', 'metralleta'];
                                    const tipo = tipos[Math.floor(Math.random() * tipos.length)];
                                    this.armasSuelo.push(new ArmaSuelo(zombi.x, zombi.y, tipo));
                                }
                                crearParticulas(zombi.centroX, zombi.centroY, C.VERDE, 20, 5);
                            }
                            this.balas.splice(j, 1);
                            break;
                        }
                    }
                }

                this.zombis = this.zombis.filter(z => z.vida > 0);

                for (let i = this.armasSuelo.length - 1; i >= 0; i--) {
                    const arma = this.armasSuelo[i];
                    arma.timer--;
                    if (arma.timer <= 0) {
                        this.armasSuelo.splice(i, 1);
                        continue;
                    }
                    if (arma.activo) {
                        const dist = distancia(arma.x, arma.y, this.jugador.centroX, this.jugador.centroY);
                        if (dist < this.jugador.ancho / 2 + arma.radio + 10) {
                            if (arma.tipo === 'escopeta') {
                                this.jugador.arma_actual = 'escopeta';
                                this.jugador.balas_escopeta = 6;
                            } else if (arma.tipo === 'metralleta') {
                                this.jugador.arma_actual = 'metralleta';
                                this.jugador.balas_metralleta = 30;
                                this.jugador.recargando = false;
                            }
                            arma.activo = false;
                            this.armasSuelo.splice(i, 1);
                            crearParticulas(arma.x, arma.y, C.NARANJA, 20, 5);
                        }
                    }
                }

                const spawnRate = Math.max(300, 1200 - (minutos * 20));
                if (tiempoActual - this.ultimoSpawn > spawnRate) {
                    this.zombisPorSpawn = 1 + Math.floor(minutos * 0.2);
                    const cantidad = Math.min(this.zombisPorSpawn, 8);
                    for (let i = 0; i < cantidad; i++) {
                        this.spawnZombi(minutos);
                    }
                    this.ultimoSpawn = tiempoActual;
                }

                if (this.tiempoAtaqueZombi > 0) this.tiempoAtaqueZombi--;

                actualizarParticulas();
            }

            dibujar() {
                ctx.clearRect(0, 0, ANCHO, ALTO);

                const grad = ctx.createLinearGradient(0, 0, 0, ALTO);
                grad.addColorStop(0, '#0a0a1a');
                grad.addColorStop(0.5, '#1a1a2e');
                grad.addColorStop(1, '#0d0d1a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, ANCHO, ALTO);

                ctx.fillStyle = 'rgba(30, 30, 50, 0.5)';
                ctx.fillRect(0, ALTO - 50, ANCHO, 50);
                ctx.fillStyle = 'rgba(40, 40, 60, 0.3)';
                for (let i = 0; i < ANCHO; i += 40) {
                    ctx.fillRect(i, ALTO - 50, 1, 50);
                }

                for (const p of PLATAFORMAS) {
                    ctx.fillStyle = 'rgba(60, 70, 90, 0.6)';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.roundRect(p.x, p.y, p.w, p.h, 4);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(100, 120, 150, 0.3)';
                    ctx.fillRect(p.x + 5, p.y + 2, p.w - 10, 3);
                }

                for (const arma of this.armasSuelo) {
                    arma.dibujar();
                }

                for (const granada of this.granadas) {
                    granada.dibujar();
                }

                for (const zombi of this.zombis) {
                    zombi.dibujar();
                }

                for (const bala of this.balas) {
                    bala.dibujar();
                }

                for (const bala of this.balasEnemigas) {
                    bala.dibujar();
                }

                dibujarParticulas();

                if (this.jugador.vivo) {
                    this.jugador.dibujar();
                }

                this.dibujarUI();
            }

            dibujarUI() {
                const tiempoActual = Date.now();
                const minutos = Math.floor((tiempoActual - this.tiempoInicio) / 60000);
                const segundos = Math.floor((tiempoActual - this.tiempoInicio) / 1000) % 60;

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                ctx.roundRect(10, 10, 280, 80, 10);
                ctx.fill();

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(`💀 ${this.puntuacion}`, 20, 15);

                ctx.fillStyle = '#00BCD4';
                ctx.font = '16px Arial';
                ctx.fillText(`⏱ ${minutos}:${segundos.toString().padStart(2, '0')}`, 120, 16);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = '14px Arial';
                let armaText = `🔫 ${this.jugador.arma_actual.toUpperCase()}`;
                if (this.jugador.arma_actual === 'escopeta') {
                    armaText += ` (${this.jugador.balas_escopeta})`;
                } else if (this.jugador.arma_actual === 'metralleta') {
                    armaText += ` (${this.jugador.balas_metralleta}/${this.jugador.max_metralleta})`;
                    if (this.jugador.recargando) armaText += ' 🔄';
                }
                ctx.fillText(armaText, 20, 45);

                ctx.fillStyle = '#FFD93D';
                ctx.font = '14px Arial';
                ctx.fillText(`⭐ Nivel ${minutos + 1}`, 20, 70);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = '14px Arial';
                ctx.fillText(`🧟 ${this.zombis.length}`, 120, 70);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = '14px Arial';
                ctx.fillText(`💣 ${this.jugador.granadas}`, 180, 70);

                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,215,0,0.5)';
                ctx.font = '14px Arial';
                ctx.fillText(`🏆 Récord: ${puntajeMaximo}`, ANCHO - 20, 15);
            }

            buclePrincipal() {
                if (!this.juegoTerminado) {
                    this.actualizar();
                    this.dibujar();
                    requestAnimationFrame(() => this.buclePrincipal());
                } else {
                    this.mostrarGameOver();
                }
            }

            mostrarGameOver() {
                const esRecord = this.puntuacion > puntajeMaximo;
                if (esRecord) {
                    puntajeMaximo = this.puntuacion;
                    localStorage.setItem('zombiePuntajeMaximo', String(puntajeMaximo));
                }

                let esperando = true;

                const drawGameOver = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.fillStyle = C.ROJO;
                    ctx.font = 'bold 60px Arial';
                    ctx.fillText('💀 GAME OVER', ANCHO / 2, 140);

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = '36px Arial';
                    ctx.fillText(`Puntuación: ${this.puntuacion}`, ANCHO / 2, 220);

                    if (esRecord) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = 'bold 32px Arial';
                        ctx.fillText('🏆 ¡NUEVO RÉCORD MUNDIAL!', ANCHO / 2, 280);
                    } else {
                        ctx.fillStyle = C.GRIS;
                        ctx.font = '24px Arial';
                        ctx.fillText(`Récord: ${puntajeMaximo}`, ANCHO / 2, 280);
                    }

                    ctx.fillStyle = C.GRIS;
                    ctx.font = '18px Arial';
                    const minutos = Math.floor((Date.now() - this.tiempoInicio) / 60000);
                    const segundos = Math.floor((Date.now() - this.tiempoInicio) / 1000) % 60;
                    ctx.fillText(`⏱ Tiempo: ${minutos}:${segundos.toString().padStart(2, '0')}`, ANCHO / 2, 330);
                    ctx.fillText(`🔫 Zombis derrotados: ${this.puntuacion}`, ANCHO / 2, 360);

                    const btnX = ANCHO / 2 - 120;
                    const btnY = 410;
                    const btnW = 240;
                    const btnH = 55;

                    ctx.shadowColor = 'rgba(0,0,255,0.3)';
                    ctx.shadowBlur = 20;

                    const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
                    grad.addColorStop(0, '#2979FF');
                    grad.addColorStop(1, '#0D47A1');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, btnW, btnH, 12);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = 'bold 24px Arial';
                    ctx.fillText('🔄 VOLVER A JUGAR', ANCHO / 2, btnY + btnH / 2);

                    if (esperando) {
                        const handler = (e) => {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = canvas.width / rect.width;
                            const scaleY = canvas.height / rect.height;
                            const x = (e.clientX - rect.left) * scaleX;
                            const y = (e.clientY - rect.top) * scaleY;

                            if (x > btnX && x < btnX + btnW &&
                                y > btnY && y < btnY + btnH) {
                                esperando = false;
                                canvas.removeEventListener('click', handler);
                                this.mostrarMenu();
                            }
                        };
                        canvas.addEventListener('click', handler);

                        const keyHandler = (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                esperando = false;
                                document.removeEventListener('keydown', keyHandler);
                                this.mostrarMenu();
                            }
                        };
                        document.addEventListener('keydown', keyHandler);
                    }
                };

                drawGameOver();
            }

            mostrarMenu() {
                enMenu = true;
                let generoSeleccionado = null;

                const drawMenu = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);

                    const grad = ctx.createRadialGradient(ANCHO / 2, ALTO / 2, 0, ANCHO / 2, ALTO / 2, 500);
                    grad.addColorStop(0, '#1a1a3e');
                    grad.addColorStop(1, '#0a0a0a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    for (let i = 0; i < 30; i++) {
                        ctx.fillStyle = `rgba(255,255,255,${0.02 + Math.random() * 0.03})`;
                        ctx.beginPath();
                        ctx.arc(Math.random() * ANCHO, Math.random() * ALTO, 1 + Math.random() * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.shadowColor = 'rgba(255,0,0,0.3)';
                    ctx.shadowBlur = 30;

                    ctx.fillStyle = C.ROJO;
                    ctx.font = 'bold 60px Arial';
                    ctx.fillText('🧟 ZOMBIE SURVIVOR', ANCHO / 2, 80);

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = C.GRIS;
                    ctx.font = '18px Arial';
                    ctx.fillText('🎯 Elige tu personaje', ANCHO / 2, 150);

                    const btnHombre = { x: ANCHO / 2 - 180, y: 200, w: 160, h: 70 };
                    const btnMujer = { x: ANCHO / 2 + 20, y: 200, w: 160, h: 70 };

                    ctx.shadowColor = 'rgba(0,0,255,0.3)';
                    ctx.shadowBlur = 20;

                    const gradH = ctx.createLinearGradient(btnHombre.x, btnHombre.y, btnHombre.x, btnHombre.y + btnHombre.h);
                    gradH.addColorStop(0, '#4488FF');
                    gradH.addColorStop(1, '#0044AA');
                    ctx.fillStyle = gradH;
                    ctx.beginPath();
                    ctx.roundRect(btnHombre.x, btnHombre.y, btnHombre.w, btnHombre.h, 15);
                    ctx.fill();

                    const gradM = ctx.createLinearGradient(btnMujer.x, btnMujer.y, btnMujer.x, btnMujer.y + btnMujer.h);
                    gradM.addColorStop(0, '#FF6B9D');
                    gradM.addColorStop(1, '#CC3388');
                    ctx.fillStyle = gradM;
                    ctx.beginPath();
                    ctx.roundRect(btnMujer.x, btnMujer.y, btnMujer.w, btnMujer.h, 15);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = C.BLANCO;
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.fillText('👨 Hombre', btnHombre.x + btnHombre.w / 2, btnHombre.y + btnHombre.h / 2);
                    ctx.fillText('👩 Mujer', btnMujer.x + btnMujer.w / 2, btnMujer.y + btnMujer.h / 2);

                    if (puntajeMaximo > 0) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = '20px Arial';
                        ctx.fillText(`🏆 Récord: ${puntajeMaximo}`, ANCHO / 2, 320);
                    }

                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = '15px Arial';
                    ctx.fillText('🎮 WASD / Flechas: Moverse | Click: Disparar', ANCHO / 2, 400);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '13px Arial';
                    ctx.fillText('💡 Doble salto | G: Granada | E/Q: Cambiar arma', ANCHO / 2, 430);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '12px Arial';
                    ctx.fillText('📱 Controles táctiles disponibles en móvil', ANCHO / 2, 460);

                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '12px Arial';
                    ctx.fillText('🔥 Contra Style - Run & Gun', ANCHO / 2, 580);

                    if (enMenu) {
                        const handler = (e) => {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = canvas.width / rect.width;
                            const scaleY = canvas.height / rect.height;
                            const x = (e.clientX - rect.left) * scaleX;
                            const y = (e.clientY - rect.top) * scaleY;

                            if (x > btnHombre.x && x < btnHombre.x + btnHombre.w &&
                                y > btnHombre.y && y < btnHombre.y + btnHombre.h) {
                                enMenu = false;
                                canvas.removeEventListener('click', handler);
                                juegoActual = new Juego('hombre');
                            } else if (x > btnMujer.x && x < btnMujer.x + btnMujer.w &&
                                y > btnMujer.y && y < btnMujer.y + btnMujer.h) {
                                enMenu = false;
                                canvas.removeEventListener('click', handler);
                                juegoActual = new Juego('mujer');
                            }
                        };
                        canvas.addEventListener('click', handler);
                    }
                };

                drawMenu();
            }
        }

        // ==================== POLYFILL ROUNDRECT ====================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ==================== INICIAR JUEGO ====================
        const juegoInicial = new Juego();
        juegoInicial.mostrarMenu();
    </script>
