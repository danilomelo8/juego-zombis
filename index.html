<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survivor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Constantes
        const ANCHO = 800;
        const ALTO = 600;
        const NEGRO = '#000000';
        const BLANCO = '#FFFFFF';
        const ROJO = '#FF0000';
        const VERDE = '#00FF00';
        const AZUL = '#0000FF';
        const AMARILLO = '#FFFF00';
        const NARANJA = '#FF8C00';
        const ROSA = '#FFB6C1';
        const GRIS = '#808080';

        // Variables globales del juego
        let juegoActual = null;
        let puntajeMaximo = parseInt(localStorage.getItem('zombiePuntajeMaximo')) || 0;

        class Jugador {
            constructor(x, y, genero) {
                this.x = x;
                this.y = y;
                this.radio = 15;
                this.velocidad = 5;
                this.genero = genero;
                this.color = AZUL if genero === 'hombre' else ROSA;
                this.arma_actual = 'pistola';
                this.balas_escopeta = 0;
                this.vivo = true;
            }

            mover(teclas) {
                let dx = 0, dy = 0;
                if (teclas['ArrowLeft'] || teclas['a']) dx = -this.velocidad;
                if (teclas['ArrowRight'] || teclas['d']) dx = this.velocidad;
                if (teclas['ArrowUp'] || teclas['w']) dy = -this.velocidad;
                if (teclas['ArrowDown'] || teclas['s']) dy = this.velocidad;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }

                this.x += dx;
                this.y += dy;
                this.x = Math.max(this.radio, Math.min(ANCHO - this.radio, this.x));
                this.y = Math.max(this.radio, Math.min(ALTO - this.radio, this.y));
            }

            dibujar() {
                // Cuerpo
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = NEGRO;
                ctx.stroke();

                // Cara
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio - 3, 0, Math.PI * 2);
                ctx.fillStyle = BLANCO;
                ctx.fill();

                // Ojos
                ctx.fillStyle = NEGRO;
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();

                // Pelo según género
                if (this.genero === 'hombre') {
                    ctx.fillStyle = NEGRO;
                    ctx.fillRect(this.x - 10, this.y - 18, 20, 5);
                } else {
                    ctx.strokeStyle = NEGRO;
                    ctx.lineWidth = 2;
                    for (let i = -10; i <= 10; i += 4) {
                        ctx.beginPath();
                        ctx.moveTo(this.x + i, this.y - 15);
                        ctx.lineTo(this.x + i + 5, this.y - 25);
                        ctx.stroke();
                    }
                }
            }
        }

        class Zombi {
            constructor(x, y, nivel_resistencia, velocidad) {
                this.x = x;
                this.y = y;
                this.radio = 12;
                this.vida = nivel_resistencia;
                this.max_vida = nivel_resistencia;
                this.velocidad = velocidad;
                this.color = nivel_resistencia === 1 ? VERDE : 
                           nivel_resistencia === 2 ? NARANJA : ROJO;
            }

            mover_hacia(objetivo) {
                const dx = objetivo.x - this.x;
                const dy = objetivo.y - this.y;
                const distancia = Math.sqrt(dx * dx + dy * dy);
                if (distancia > 0) {
                    this.x += (dx / distancia) * this.velocidad;
                    this.y += (dy / distancia) * this.velocidad;
                }
            }

            dibujar() {
                // Cuerpo
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = NEGRO;
                ctx.stroke();

                // Ojos rojos
                ctx.fillStyle = ROJO;
                ctx.beginPath();
                ctx.arc(this.x - 4, this.y - 2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y - 2, 2, 0, Math.PI * 2);
                ctx.fill();

                // Barra de vida
                const ancho_barra = this.radio * 2;
                const vida_porcentaje = this.vida / this.max_vida;
                ctx.fillStyle = ROJO;
                ctx.fillRect(this.x - this.radio, this.y - this.radio - 10, ancho_barra, 4);
                ctx.fillStyle = VERDE;
                ctx.fillRect(this.x - this.radio, this.y - this.radio - 10, ancho_barra * vida_porcentaje, 4);
            }
        }

        class Bala {
            constructor(x, y, angulo, tipo = 'pistola') {
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.velocidad = tipo === 'pistola' ? 10 : 8;
                this.radio = tipo === 'pistola' ? 3 : 6;
                this.dx = Math.cos(angulo) * this.velocidad;
                this.dy = Math.sin(angulo) * this.velocidad;
                this.dano = tipo === 'pistola' ? 1 : 3;
            }

            mover() {
                this.x += this.dx;
                this.y += this.dy;
            }

            dibujar() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = this.tipo === 'pistola' ? AMARILLO : NARANJA;
                ctx.fill();
            }
        }

        class ArmaEnSuelo {
            constructor(x, y, tipo) {
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.radio = 10;
                this.activo = true;
            }

            dibujar() {
                if (!this.activo) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = NARANJA;
                ctx.fill();
                ctx.strokeStyle = BLANCO;
                ctx.stroke();

                ctx.fillStyle = BLANCO;
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', this.x, this.y);
            }
        }

        class Juego {
            constructor(genero) {
                this.jugador = new Jugador(ANCHO/2, ALTO/2, genero);
                this.zombis = [];
                this.balas = [];
                this.armas_suelo = [];
                this.puntuacion = 0;
                this.tiempo_inicio = Date.now();
                this.ultimo_spawn = 0;
                this.juego_terminado = false;
                this.velocidad_base = 2;
                this.zombis_por_spawn = 1;
                this.tiempo_entre_spawn = 1000;
                this.ultimo_disparo = 0;
                this.tiempo_entre_disparos = 200;
                this.teclas = {};
                this.mouseX = ANCHO/2;
                this.mouseY = ALTO/2;

                this.setupEventListeners();
                this.buclePrincipal();
            }

            setupEventListeners() {
                const keyHandler = (e) => {
                    this.teclas[e.key.toLowerCase()] = e.type === 'keydown';
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                        e.preventDefault();
                    }
                };

                document.addEventListener('keydown', keyHandler);
                document.addEventListener('keyup', keyHandler);

                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                });

                canvas.addEventListener('click', () => {
                    if (this.jugador.vivo) {
                        this.disparar();
                    }
                });
            }

            disparar() {
                const tiempo_actual = Date.now();
                if (tiempo_actual - this.ultimo_disparo < this.tiempo_entre_disparos) return;

                const dx = this.mouseX - this.jugador.x;
                const dy = this.mouseY - this.jugador.y;
                const angulo = Math.atan2(dy, dx);

                if (this.jugador.arma_actual === 'pistola') {
                    this.balas.push(new Bala(this.jugador.x, this.jugador.y, angulo, 'pistola'));
                    this.ultimo_disparo = tiempo_actual;
                } else if (this.jugador.arma_actual === 'escopeta' && this.jugador.balas_escopeta > 0) {
                    for (let i = -1; i <= 1; i++) {
                        const angulo_escopeta = angulo + (i * 0.2);
                        this.balas.push(new Bala(this.jugador.x, this.jugador.y, angulo_escopeta, 'escopeta'));
                    }
                    this.jugador.balas_escopeta--;
                    if (this.jugador.balas_escopeta === 0) {
                        this.jugador.arma_actual = 'pistola';
                    }
                    this.ultimo_disparo = tiempo_actual;
                }
            }

            actualizar() {
                if (!this.jugador.vivo) return;

                const tiempo_actual = Date.now();
                const minutos = Math.floor((tiempo_actual - this.tiempo_inicio) / 60000);

                this.jugador.mover(this.teclas);

                // Actualizar balas
                for (let i = this.balas.length - 1; i >= 0; i--) {
                    const bala = this.balas[i];
                    bala.mover();
                    if (bala.x < 0 || bala.x > ANCHO || bala.y < 0 || bala.y > ALTO) {
                        this.balas.splice(i, 1);
                    }
                }

                // Actualizar zombis y colisiones
                for (let i = this.zombis.length - 1; i >= 0; i--) {
                    const zombi = this.zombis[i];
                    zombi.mover_hacia(this.jugador);

                    // Colisión con jugador
                    const distancia = Math.sqrt(
                        (zombi.x - this.jugador.x) ** 2 + 
                        (zombi.y - this.jugador.y) ** 2
                    );
                    if (distancia < this.jugador.radio + zombi.radio) {
                        this.jugador.vivo = false;
                        this.juego_terminado = true;
                        return;
                    }

                    // Colisión con balas
                    for (let j = this.balas.length - 1; j >= 0; j--) {
                        const bala = this.balas[j];
                        const distBala = Math.sqrt(
                            (bala.x - zombi.x) ** 2 + 
                            (bala.y - zombi.y) ** 2
                        );
                        if (distBala < bala.radio + zombi.radio) {
                            zombi.vida -= bala.dano;
                            this.balas.splice(j, 1);
                            if (zombi.vida <= 0) {
                                this.zombis.splice(i, 1);
                                this.puntuacion++;
                                if (Math.random() < 0.15) {
                                    this.armas_suelo.push(new ArmaEnSuelo(zombi.x, zombi.y, 'escopeta'));
                                }
                            }
                            break;
                        }
                    }
                }

                // Actualizar armas en suelo
                for (let i = this.armas_suelo.length - 1; i >= 0; i--) {
                    const arma = this.armas_suelo[i];
                    if (arma.activo) {
                        const distancia = Math.sqrt(
                            (arma.x - this.jugador.x) ** 2 + 
                            (arma.y - this.jugador.y) ** 2
                        );
                        if (distancia < this.jugador.radio + arma.radio) {
                            this.jugador.arma_actual = 'escopeta';
                            this.jugador.balas_escopeta = 5;
                            arma.activo = false;
                            this.armas_suelo.splice(i, 1);
                        }
                    }
                }

                // Spawn de zombis
                const nivel_resistencia = Math.min(minutos + 1, 5);
                if (tiempo_actual - this.ultimo_spawn > this.tiempo_entre_spawn) {
                    this.zombis_por_spawn = 1 + Math.floor(minutos / 1);
                    
                    for (let i = 0; i < Math.min(this.zombis_por_spawn, 10); i++) {
                        const lado = Math.floor(Math.random() * 4);
                        let x, y;
                        if (lado === 0) { x = Math.random() * ANCHO; y = -20; }
                        else if (lado === 1) { x = Math.random() * ANCHO; y = ALTO + 20; }
                        else if (lado === 2) { x = -20; y = Math.random() * ALTO; }
                        else { x = ANCHO + 20; y = Math.random() * ALTO; }

                        let velocidad = this.velocidad_base;
                        if (minutos >= 3) {
                            velocidad = this.velocidad_base + (Math.random() - 0.5) * 2;
                            velocidad = Math.max(1, velocidad);
                        }

                        this.zombis.push(new Zombi(x, y, nivel_resistencia, velocidad));
                    }
                    this.ultimo_spawn = tiempo_actual;
                    this.tiempo_entre_spawn = Math.max(300, 1000 - (minutos * 50));
                }
            }

            dibujar() {
                ctx.clearRect(0, 0, ANCHO, ALTO);
                ctx.fillStyle = NEGRO;
                ctx.fillRect(0, 0, ANCHO, ALTO);

                this.jugador.dibujar();

                for (const zombi of this.zombis) {
                    zombi.dibujar();
                }

                for (const bala of this.balas) {
                    bala.dibujar();
                }

                for (const arma of this.armas_suelo) {
                    arma.dibujar();
                }

                // UI
                ctx.fillStyle = BLANCO;
                ctx.font = '20px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`Zombis: ${this.puntuacion}`, 10, 10);
                
                const tiempo_actual = Date.now();
                const minutos = Math.floor((tiempo_actual - this.tiempo_inicio) / 60000);
                const segundos = Math.floor((tiempo_actual - this.tiempo_inicio) / 1000) % 60;
                ctx.fillText(`Tiempo: ${minutos}:${segundos.toString().padStart(2, '0')}`, 10, 40);

                let arma_texto = `Arma: ${this.jugador.arma_actual}`;
                if (this.jugador.arma_actual === 'escopeta') {
                    arma_texto += ` (${this.jugador.balas_escopeta} balas)`;
                }
                ctx.fillText(arma_texto, 10, 70);

                const nivel = Math.min(Math.floor((tiempo_actual - this.tiempo_inicio) / 60000) + 1, 5);
                ctx.fillText(`Nivel resistencia: ${nivel}`, 10, 100);
            }

            buclePrincipal() {
                if (!this.juego_terminado) {
                    this.actualizar();
                    this.dibujar();
                    requestAnimationFrame(() => this.buclePrincipal());
                } else {
                    this.mostrarGameOver();
                }
            }

            mostrarGameOver() {
                const esRecord = this.puntuacion > puntajeMaximo;
                if (esRecord) {
                    puntajeMaximo = this.puntuacion;
                    localStorage.setItem('zombiePuntajeMaximo', String(puntajeMaximo));
                }

                let reiniciar = false;

                const drawGameOver = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);
                    ctx.fillStyle = NEGRO;
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    ctx.fillStyle = ROJO;
                    ctx.font = '60px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('GAME OVER', ANCHO/2, 150);

                    ctx.fillStyle = BLANCO;
                    ctx.font = '40px Arial';
                    ctx.fillText(`Puntuación: ${this.puntuacion}`, ANCHO/2, 250);

                    if (esRecord) {
                        ctx.fillStyle = AMARILLO;
                        ctx.font = '36px Arial';
                        ctx.fillText('¡NUEVO RÉCORD!', ANCHO/2, 320);
                    } else {
                        ctx.fillStyle = BLANCO;
                        ctx.font = '28px Arial';
                        ctx.fillText(`Récord: ${puntajeMaximo}`, ANCHO/2, 320);
                    }

                    // Botón de reinicio
                    ctx.fillStyle = AZUL;
                    ctx.fillRect(ANCHO/2 - 100, 400, 200, 50);
                    ctx.fillStyle = BLANCO;
                    ctx.font = '24px Arial';
                    ctx.fillText('Volver a jugar', ANCHO/2, 425);

                    // Detectar click en el botón
                    const handler = (e) => {
                        const rect = canvas.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        if (x > ANCHO/2 - 100 && x < ANCHO/2 + 100 &&
                            y > 400 && y < 450) {
                            reiniciar = true;
                            canvas.removeEventListener('click', handler);
                            this.mostrarMenu();
                        }
                    };
                    canvas.addEventListener('click', handler);
                };

                drawGameOver();
            }

            mostrarMenu() {
                let generoSeleccionado = null;

                const drawMenu = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);
                    ctx.fillStyle = NEGRO;
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    ctx.fillStyle = ROJO;
                    ctx.font = '60px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('ZOMBIE SURVIVOR', ANCHO/2, 120);

                    // Botones
                    const btnHombre = { x: ANCHO/2 - 160, y: 280, w: 140, h: 50 };
                    const btnMujer = { x: ANCHO/2 + 20, y: 280, w: 140, h: 50 };

                    ctx.fillStyle = AZUL;
                    ctx.fillRect(btnHombre.x, btnHombre.y, btnHombre.w, btnHombre.h);
                    ctx.fillStyle = ROSA;
                    ctx.fillRect(btnMujer.x, btnMujer.y, btnMujer.w, btnMujer.h);

                    ctx.fillStyle = BLANCO;
                    ctx.font = '28px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('Hombre', btnHombre.x + btnHombre.w/2, btnHombre.y + btnHombre.h/2);
                    ctx.fillText('Mujer', btnMujer.x + btnMujer.w/2, btnMujer.y + btnMujer.h/2);

                    if (puntajeMaximo > 0) {
                        ctx.fillStyle = BLANCO;
                        ctx.font = '24px Arial';
                        ctx.fillText(`Récord: ${puntajeMaximo}`, ANCHO/2, 450);
                    }

                    // Event listener para los botones
                    const handler = (e) => {
                        const rect = canvas.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        if (x > btnHombre.x && x < btnHombre.x + btnHombre.w &&
                            y > btnHombre.y && y < btnHombre.y + btnHombre.h) {
                            generoSeleccionado = 'hombre';
                            canvas.removeEventListener('click', handler);
                            juegoActual = new Juego('hombre');
                        } else if (x > btnMujer.x && x < btnMujer.x + btnMujer.w &&
                            y > btnMujer.y && y < btnMujer.y + btnMujer.h) {
                            generoSeleccionado = 'mujer';
                            canvas.removeEventListener('click', handler);
                            juegoActual = new Juego('mujer');
                        }
                    };
                    canvas.addEventListener('click', handler);
                };

                drawMenu();
            }
        }

        // Iniciar el juego mostrando el menú
        const juego = new Juego();
        juego.mostrarMenu();
    </script>
</body>
</html>
