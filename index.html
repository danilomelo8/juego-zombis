<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival - Mejorado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            background: #16213e;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #0f3460;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
            flex-wrap: wrap;
            gap: 5px;
        }
        #ui > div {
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        #menu h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233,69,96,0.5);
        }
        #menu .subtitle {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #aaa;
        }
        #menu .controls-info {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 400px;
            width: 100%;
        }
        #menu .controls-info p {
            margin: 6px 0;
            font-size: 0.9rem;
            color: #ddd;
        }
        #menu .controls-info .key {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            color: #ffd700;
            margin: 0 3px;
        }
        #menu .controls-info .mobile-note {
            color: #88d8f7;
            font-size: 0.8rem;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }
        .menu-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .menu-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }
        .menu-btn:hover {
            transform: scale(1.05);
        }
        .menu-btn.hombre {
            background: #4a9eff;
            color: white;
        }
        .menu-btn.hombre:hover {
            background: #6ab0ff;
            box-shadow: 0 0 20px rgba(74,158,255,0.4);
        }
        .menu-btn.mujer {
            background: #ff6b9d;
            color: white;
        }
        .menu-btn.mujer:hover {
            background: #ff8ab0;
            box-shadow: 0 0 20px rgba(255,107,157,0.4);
        }
        .menu-btn.start {
            background: #e94560;
            color: white;
            font-size: 1.3rem;
            padding: 14px 40px;
        }
        .menu-btn.start:hover {
            background: #ff6b7a;
            box-shadow: 0 0 30px rgba(233,69,96,0.5);
        }
        #mobileControls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 15;
            pointer-events: none;
        }
        #mobileControls button {
            pointer-events: all;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #mobileControls button:active {
            background: rgba(255,255,255,0.4);
            transform: scale(0.92);
        }
        .dpad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 4px;
            pointer-events: none;
        }
        .dpad button {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.8rem;
            pointer-events: all;
            backdrop-filter: blur(4px);
        }
        .dpad button:active {
            background: rgba(255,255,255,0.35);
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            pointer-events: none;
            align-items: flex-end;
        }
        .action-buttons button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255,50,50,0.3);
            border: 2px solid rgba(255,50,50,0.5);
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            pointer-events: all;
            backdrop-filter: blur(4px);
        }
        .action-buttons button:nth-child(2) {
            background: rgba(50,200,50,0.3);
            border-color: rgba(50,200,50,0.5);
        }
        .action-buttons button:nth-child(3) {
            background: rgba(255,200,50,0.3);
            border-color: rgba(255,200,50,0.5);
        }
        .action-buttons button:active {
            transform: scale(0.9);
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 25;
            padding: 20px;
        }
        #gameOver h1 {
            color: #e94560;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        #gameOver .stats {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #ddd;
        }
        #gameOver .restart-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: #e94560;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        #gameOver .restart-btn:hover {
            background: #ff6b7a;
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            #ui { font-size: 12px; }
            #ui > div { padding: 3px 10px; }
            #menu h1 { font-size: 1.8rem; }
            #menu .controls-info { padding: 10px 15px; }
            #menu .controls-info p { font-size: 0.75rem; }
            .menu-btn { padding: 10px 20px; font-size: 0.9rem; min-width: 90px; }
            #mobileControls { display: flex !important; }
            .dpad button { width: 50px; height: 50px; font-size: 1.4rem; }
            .action-buttons button { width: 55px; height: 55px; font-size: 0.7rem; }
            #mobileControls { bottom: 10px; padding: 0 8px; }
        }
        @media (max-width: 480px) {
            .dpad { grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; gap: 3px; }
            .dpad button { width: 50px; height: 50px; font-size: 1.2rem; }
            .action-buttons button { width: 48px; height: 48px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div id="ui">
        <div id="scoreDisplay">💀 0</div>
        <div id="timeDisplay">⏱️ 0:00</div>
        <div id="healthDisplay">❤️ 100</div>
        <div id="weaponDisplay">🔫 Pistola</div>
        <div id="ammoDisplay">🔸 ∞</div>
    </div>

    <div id="menu">
        <h1>🧟 ZOMBIE SURVIVAL</h1>
        <div class="subtitle">Sobrevive el mayor tiempo posible</div>
        <div class="controls-info">
            <p><span class="key">W A S D</span> o <span class="key">⬆ ⬇ ⬅ ➡</span> Moverse</p>
            <p><span class="key">ESPACIO</span> Saltar &nbsp;|&nbsp; <span class="key">CLICK</span> Disparar</p>
            <p><span class="key">G</span> Lanzar granada</p>
            <p class="mobile-note">📱 En móvil usa los botones táctiles</p>
        </div>
        <div style="margin-bottom:15px; color:#aaa; font-size:0.9rem;">Elige tu personaje:</div>
        <div class="menu-buttons">
            <button class="menu-btn hombre" onclick="selectCharacter('hombre')">👨 Hombre</button>
            <button class="menu-btn mujer" onclick="selectCharacter('mujer')">👩 Mujer</button>
        </div>
        <div style="margin-top:20px;">
            <button class="menu-btn start" id="startBtn" onclick="startGame()">▶ INICIAR</button>
        </div>
    </div>

    <div id="gameOver">
        <h1>💀 GAME OVER</h1>
        <div class="stats" id="finalScore">Puntuación: 0</div>
        <div class="stats" id="finalTime">Tiempo: 0:00</div>
        <button class="restart-btn" onclick="restartGame()">🔄 REINTENTAR</button>
    </div>

    <div id="mobileControls">
        <div class="dpad">
            <button style="grid-column:2;grid-row:1;" data-action="up">▲</button>
            <button style="grid-column:1;grid-row:2;" data-action="left">◀</button>
            <button style="grid-column:2;grid-row:2;" data-action="down">▼</button>
            <button style="grid-column:3;grid-row:2;" data-action="right">▶</button>
            <button style="grid-column:2;grid-row:3;" data-action="jump">⬆</button>
        </div>
        <div class="action-buttons">
            <button data-action="shoot">🔫</button>
            <button data-action="grenade">💣</button>
            <button data-action="switch">🔄</button>
        </div>
    </div>
</div>

<script>
// ============ CONFIGURACIÓN ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;

// ============ ESTADO DEL JUEGO ============
let gameRunning = false;
let gameTime = 0;
let score = 0;
let zombiesKilled = 0;
let character = 'hombre'; // 'hombre' o 'mujer'
let frameCount = 0;
let difficultyTimer = 0; // para spawn de zombies más fuertes
let grenadeCooldown = 0;
let weaponDropTimer = 0;

// ============ SONIDO (suspenso) ============
// Usamos Web Audio para generar sonido de suspenso simple
let audioCtx = null;
let suspensoInterval = null;

function iniciarMusicaSuspenso() {
    if (audioCtx) {
        try { audioCtx.close(); } catch(e) {}
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscilador, ganancia;
    
    function tocarNota(frec, duracion, volumen = 0.15) {
        if (!audioCtx) return;
        try {
            oscilador = audioCtx.createOscillator();
            ganancia = audioCtx.createGain();
            oscilador.type = 'sawtooth';
            oscilador.frequency.value = frec;
            ganancia.gain.value = volumen;
            ganancia.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracion);
            oscilador.connect(ganancia);
            ganancia.connect(audioCtx.destination);
            oscilador.start();
            oscilador.stop(audioCtx.currentTime + duracion);
        } catch(e) {}
    }
    
    if (suspensoInterval) clearInterval(suspensoInterval);
    // Patrón de suspenso aleatorio
    suspensoInterval = setInterval(() => {
        if (!gameRunning) return;
        const notas = [200, 250, 300, 350, 400, 450];
        const nota = notas[Math.floor(Math.random() * notas.length)];
        const duracion = 0.1 + Math.random() * 0.2;
        const vol = 0.05 + Math.random() * 0.08;
        tocarNota(nota, duracion, vol);
        // A veces doble nota
        if (Math.random() > 0.6) {
            setTimeout(() => {
                tocarNota(nota + 30, duracion * 0.6, vol * 0.7);
            }, 100 + Math.random() * 150);
        }
    }, 600 + Math.random() * 400);
}

function pararMusicaSuspenso() {
    if (suspensoInterval) {
        clearInterval(suspensoInterval);
        suspensoInterval = null;
    }
    if (audioCtx) {
        try { audioCtx.close(); } catch(e) {}
        audioCtx = null;
    }
}

// ============ CLASES ============
class Jugador {
    constructor() {
        this.w = 28;
        this.h = 40;
        this.x = 100;
        this.y = H - this.h - 60;
        this.vx = 0;
        this.vy = 0;
        this.speed = 3.5;
        this.jumpPower = -9;
        this.gravity = 0.5;
        this.onGround = false;
        this.health = 100;
        this.maxHealth = 100;
        this.weaponIndex = 0;
        this.weapons = [
            { name: 'Pistola', damage: 1, ammo: Infinity, maxAmmo: Infinity, fireRate: 10, type: 'pistol' },
            { name: 'Escopeta', damage: 3, ammo: 6, maxAmmo: 6, fireRate: 25, type: 'shotgun' },
            { name: 'Metralleta', damage: 1, ammo: 30, maxAmmo: 30, fireRate: 4, type: 'smg' }
        ];
        this.fireCooldown = 0;
        this.grenades = 3;
        this.maxGrenades = 3;
        this.invincible = 0;
        this.facingRight = true;
        this.shooting = false;
        // Animación
        this.frame = 0;
        this.frameTimer = 0;
    }

    get currentWeapon() {
        return this.weapons[this.weaponIndex];
    }

    switchWeapon() {
        this.weaponIndex = (this.weaponIndex + 1) % this.weapons.length;
        this.updateUI();
    }

    updateUI() {
        const w = this.currentWeapon;
        document.getElementById('weaponDisplay').textContent = '🔫 ' + w.name;
        document.getElementById('ammoDisplay').textContent = w.ammo === Infinity ? '🔸 ∞' : '🔸 ' + w.ammo;
        document.getElementById('healthDisplay').textContent = '❤️ ' + Math.ceil(this.health);
    }

    shoot(projectiles) {
        if (this.fireCooldown > 0) return false;
        const w = this.currentWeapon;
        if (w.ammo === 0) return false;
        
        const angle = this.facingRight ? 0 : Math.PI;
        const spread = w.type === 'shotgun' ? 0.3 : 0.05;
        const count = w.type === 'shotgun' ? 5 : 1;
        
        for (let i = 0; i < count; i++) {
            const a = angle + (Math.random() - 0.5) * spread;
            const spd = w.type === 'shotgun' ? 10 : 14;
            const proj = new Proyectil(
                this.x + this.w/2 + (this.facingRight ? 10 : -10),
                this.y + 10,
                Math.cos(a) * spd,
                Math.sin(a) * spd,
                w.damage,
                w.type === 'shotgun' ? '#ffaa44' : '#ffdd44',
                4,
                w.type === 'shotgun'
            );
            projectiles.push(proj);
        }
        
        if (w.ammo !== Infinity) {
            w.ammo--;
        }
        this.fireCooldown = w.fireRate;
        this.shooting = true;
        this.updateUI();
        return true;
    }

    throwGrenade(grenades) {
        if (this.grenades <= 0) return;
        if (grenadeCooldown > 0) return;
        grenadeCooldown = 60; // 1 segundo
        this.grenades--;
        const g = new Granada(
            this.x + this.w/2 + (this.facingRight ? 15 : -15),
            this.y + 5,
            this.facingRight ? 5 : -5,
            -3
        );
        grenades.push(g);
        this.updateUI();
    }

    update(keys) {
        this.fireCooldown = Math.max(0, this.fireCooldown - 1);
        this.invincible = Math.max(0, this.invincible - 1);
        grenadeCooldown = Math.max(0, grenadeCooldown - 1);
        
        // Movimiento
        let moveX = 0;
        if (keys['a'] || keys['left']) moveX = -1;
        if (keys['d'] || keys['right']) moveX = 1;
        
        if (moveX !== 0) this.facingRight = moveX > 0;
        this.vx = moveX * this.speed;
        
        // Salto
        if ((keys['w'] || keys['up'] || keys['space']) && this.onGround) {
            this.vy = this.jumpPower;
            this.onGround = false;
        }
        
        // Gravedad
        this.vy += this.gravity;
        if (this.vy > 12) this.vy = 12;
        
        // Movimiento X
        this.x += this.vx;
        if (this.x < 0) this.x = 0;
        if (this.x + this.w > W) this.x = W - this.w;
        
        // Movimiento Y
        this.y += this.vy;
        if (this.y + this.h > H - 60) {
            this.y = H - 60 - this.h;
            this.vy = 0;
            this.onGround = true;
        } else {
            this.onGround = false;
        }
        
        // Animación
        if (Math.abs(this.vx) > 0.5) {
            this.frameTimer++;
            if (this.frameTimer > 8) {
                this.frameTimer = 0;
                this.frame = (this.frame + 1) % 4;
            }
        } else {
            this.frame = 0;
        }
    }

    draw(ctx) {
        const cx = this.x + this.w/2;
        const cy = this.y + this.h/2;
        
        ctx.save();
        ctx.translate(cx, cy);
        if (!this.facingRight) ctx.scale(-1, 1);
        ctx.translate(-cx, -cy);
        
        // Sombra
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 10;
        
        // Cuerpo
        const colores = character === 'hombre' ? 
            { piel: '#f5cba7', ropa: '#3498db', pantalon: '#2c3e50' } :
            { piel: '#fad7a0', ropa: '#e74c8b', pantalon: '#5d4e37' };
        
        // Piernas
        ctx.fillStyle = colores.pantalon;
        ctx.fillRect(this.x + 4, this.y + 24, 7, 14);
        ctx.fillRect(this.x + 17, this.y + 24, 7, 14);
        
        // Cuerpo
        ctx.fillStyle = colores.ropa;
        ctx.fillRect(this.x + 4, this.y + 8, 20, 20);
        
        // Cabeza
        ctx.fillStyle = colores.piel;
        ctx.beginPath();
        ctx.arc(this.x + 14, this.y + 4, 11, 0, Math.PI * 2);
        ctx.fill();
        
        // Pelo (diferenciar)
        if (character === 'hombre') {
            ctx.fillStyle = '#4a2c0a';
            ctx.beginPath();
            ctx.arc(this.x + 14, this.y, 12, Math.PI, 2 * Math.PI);
            ctx.fill();
        } else {
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.arc(this.x + 14, this.y - 2, 13, Math.PI, 2 * Math.PI);
            ctx.fill();
            // Lazo
            ctx.fillStyle = '#ff6b9d';
            ctx.beginPath();
            ctx.arc(this.x + 2, this.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.x + 26, this.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Ojos
        ctx.fillStyle = '#222';
        ctx.fillRect(this.x + 8, this.y + 2, 4, 4);
        ctx.fillRect(this.x + 16, this.y + 2, 4, 4);
        
        // Arma
        ctx.fillStyle = '#555';
        const armaX = this.facingRight ? this.x + 24 : this.x - 8;
        ctx.fillRect(armaX, this.y + 12, 12, 4);
        ctx.fillRect(armaX + 10, this.y + 11, 4, 6);
        
        ctx.shadowBlur = 0;
        ctx.restore();
        
        // Barra de vida
        const barraAncho = 30;
        const barraX = this.x;
        const barraY = this.y - 8;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barraX, barraY, barraAncho, 4);
        const vidaPorcentaje = this.health / this.maxHealth;
        ctx.fillStyle = vidaPorcentaje > 0.5 ? '#2ecc71' : vidaPorcentaje > 0.25 ? '#f1c40f' : '#e74c3c';
        ctx.fillRect(barraX, barraY, barraAncho * vidaPorcentaje, 4);
    }
}

class Proyectil {
    constructor(x, y, vx, vy, damage, color, size, isShotgun = false) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.damage = damage;
        this.color = color;
        this.size = size || 4;
        this.isShotgun = isShotgun;
        this.life = 120;
        this.alive = true;
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20 || this.life <= 0) {
            this.alive = false;
        }
    }
    
    draw(ctx) {
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Granada {
    constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = 8;
        this.alive = true;
        this.timer = 60; // 1 segundo
        this.exploded = false;
        this.explosionRadius = 0;
        this.maxExplosionRadius = 120;
        this.explosionTimer = 0;
    }
    
    update() {
        if (this.exploded) {
            this.explosionTimer++;
            this.explosionRadius += 3;
            if (this.explosionTimer > 20) this.alive = false;
            return;
        }
        
        this.timer--;
        this.vy += 0.3;
        this.x += this.vx;
        this.y += this.vy;
        if (this.y > H - 60) {
            this.y = H - 60;
            this.vy = -this.vy * 0.4;
        }
        if (this.timer <= 0) {
            this.exploded = true;
            this.explosionRadius = 10;
        }
    }
    
    draw(ctx) {
        if (this.exploded) {
            const alpha = 1 - (this.explosionTimer / 20);
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.explosionRadius);
            grad.addColorStop(0, `rgba(255,200,50,${alpha * 0.9})`);
            grad.addColorStop(0.3, `rgba(255,100,20,${alpha * 0.7})`);
            grad.addColorStop(0.7, `rgba(200,50,0,${alpha * 0.5})`);
            grad.addColorStop(1, `rgba(100,20,0,0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.explosionRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Resplandor
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 40;
            ctx.fillStyle = `rgba(255,200,100,${alpha * 0.3})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.explosionRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            return;
        }
        
        // Granada
        ctx.shadowColor = '#333';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(this.x - 3, this.y - 10, 6, 4);
        // Parpadeo
        if (Math.floor(this.timer / 10) % 2 === 0) {
            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }
    
    getExplosionDamage(zombie) {
        if (!this.exploded) return 0;
        const dist = Math.hypot(this.x - zombie.x - zombie.w/2, this.y - zombie.y - zombie.h/2);
        if (dist < this.explosionRadius) {
            const factor = 1 - (dist / this.explosionRadius);
            return 8 * factor; // Daño máximo 8
        }
        return 0;
    }
}

class Zombie {
    constructor(difficulty = 1) {
        this.w = 30;
        this.h = 40;
        this.x = Math.random() < 0.5 ? -30 : W + 10;
        this.y = H - 60 - this.h;
        this.speed = 0.8 + difficulty * 0.15;
        this.health = difficulty;
        this.maxHealth = difficulty;
        this.damage = 1 + Math.floor(difficulty / 3);
        this.type = difficulty <= 2 ? 'normal' : difficulty <= 4 ? 'fuerte' : 'elite';
        this.shootTimer = 0;
        this.canShoot = difficulty >= 3;
        this.shootCooldown = 60 + Math.random() * 40;
        this.alive = true;
        this.hitFlash = 0;
        this.color = this.type === 'elite' ? '#8e44ad' : this.type === 'fuerte' ? '#c0392b' : '#27ae60';
        this.size = this.type === 'elite' ? 1.3 : this.type === 'fuerte' ? 1.15 : 1;
        this.attackCooldown = 0;
        // Velocidad extra para elites
        if (this.type === 'elite') this.speed *= 1.4;
        // Para que algunos zombies aparezcan en el techo (sorpresa)
        if (Math.random() > 0.7 && difficulty > 2) {
            this.y = 20 + Math.random() * 100;
        }
    }
    
    update(player, projectiles) {
        if (!this.alive) return;
        this.hitFlash = Math.max(0, this.hitFlash - 1);
        this.attackCooldown = Math.max(0, this.attackCooldown - 1);
        
        // Movimiento hacia el jugador
        const dx = player.x - this.x;
        const dy = (player.y + player.h/2) - (this.y + this.h/2);
        const dist = Math.hypot(dx, dy);
        
        if (dist > 20) {
            const moveX = dx / dist * this.speed;
            const moveY = dy / dist * this.speed * 0.3;
            this.x += moveX;
            this.y += moveY;
        }
        
        // Mantener en pantalla
        this.x = Math.max(-20, Math.min(W - this.w + 20, this.x));
        this.y = Math.max(-20, Math.min(H - 60 - this.h, this.y));
        
        // Disparo (a partir del minuto 3)
        if (this.canShoot && dist < 400) {
            this.shootTimer++;
            if (this.shootTimer >= this.shootCooldown) {
                this.shootTimer = 0;
                this.shootCooldown = 50 + Math.random() * 40;
                const angle = Math.atan2(dy, dx);
                const spd = 3 + this.damage * 0.5;
                const proj = new Proyectil(
                    this.x + this.w/2,
                    this.y + 10,
                    Math.cos(angle) * spd,
                    Math.sin(angle) * spd,
                    1,
                    '#ff4444',
                    5,
                    false
                );
                projectiles.push(proj);
            }
        }
        
        // Daño al jugador por contacto
        if (this.attackCooldown === 0) {
            if (this.x < player.x + player.w && this.x + this.w > player.x &&
                this.y < player.y + player.h && this.y + this.h > player.y) {
                player.health -= this.damage * 0.5;
                this.attackCooldown = 30;
                if (player.health < 0) player.health = 0;
                player.invincible = 20;
            }
        }
    }
    
    draw(ctx) {
        if (!this.alive) return;
        const cx = this.x + this.w/2;
        const cy = this.y + this.h/2;
        const s = this.size;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(s, s);
        ctx.translate(-cx, -cy);
        
        // Sombra
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 8;
        
        // Cuerpo
        ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : this.color;
        ctx.fillRect(this.x + 4, this.y + 8, 22, 22);
        
        // Cabeza
        ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#2d2d2d';
        ctx.beginPath();
        ctx.arc(this.x + 15, this.y + 4, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Ojos rojos
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 10;
        ctx.fillRect(this.x + 8, this.y + 2, 5, 4);
        ctx.fillRect(this.x + 17, this.y + 2, 5, 4);
        ctx.shadowBlur = 0;
        
        // Boca
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(this.x + 10, this.y + 10, 10, 4);
        // Dientes
        ctx.fillStyle = '#ddd';
        ctx.fillRect(this.x + 12, this.y + 10, 2, 4);
        ctx.fillRect(this.x + 16, this.y + 10, 2, 4);
        ctx.fillRect(this.x + 20, this.y + 10, 2, 4);
        
        // Piernas (zombie)
        ctx.fillStyle = '#1a2a1a';
        ctx.fillRect(this.x + 4, this.y + 30, 7, 10);
        ctx.fillRect(this.x + 19, this.y + 30, 7, 10);
        
        // Barra de vida
        ctx.shadowBlur = 0;
        const barraAncho = 28;
        const barraX = this.x + 1;
        const barraY = this.y - 6;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barraX, barraY, barraAncho, 3);
        const vidaPorcentaje = this.health / this.maxHealth;
        ctx.fillStyle = vidaPorcentaje > 0.5 ? '#2ecc71' : vidaPorcentaje > 0.25 ? '#f1c40f' : '#e74c3c';
        ctx.fillRect(barraX, barraY, barraAncho * vidaPorcentaje, 3);
        
        ctx.restore();
    }
    
    takeDamage(damage) {
        this.health -= damage;
        this.hitFlash = 8;
        if (this.health <= 0) {
            this.alive = false;
            return true;
        }
        return false;
    }
}

// ============ VARIABLES GLOBALES ============
let player = null;
let zombies = [];
let projectiles = [];
let grenades = [];
let weaponsOnGround = [];
let keys = {};
let selectedCharacter = null;
let gameStarted = false;
let spawnTimer = 0;
let zombieCount = 0;
let minuteCounter = 0;

// ============ FUNCIONES DEL JUEGO ============
function selectCharacter(char) {
    selectedCharacter = char;
    character = char;
    document.querySelectorAll('.menu-btn.hombre, .menu-btn.mujer').forEach(b => {
        b.style.border = '2px solid transparent';
        b.style.boxShadow = 'none';
    });
    document.querySelector(`.menu-btn.${char}`).style.border = '2px solid #ffd700';
    document.querySelector(`.menu-btn.${char}`).style.boxShadow = '0 0 20px rgba(255,215,0,0.3)';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').style.opacity = '1';
}

function startGame() {
    if (!selectedCharacter) {
        alert('¡Elige un personaje primero!');
        return;
    }
    document.getElementById('menu').style.display = 'none';
    gameStarted = true;
    gameRunning = true;
    iniciarMusicaSuspenso();
    initGame();
}

function initGame() {
    player = new Jugador();
    zombies = [];
    projectiles = [];
    grenades = [];
    weaponsOnGround = [];
    gameTime = 0;
    score = 0;
    zombiesKilled = 0;
    spawnTimer = 0;
    zombieCount = 0;
    minuteCounter = 0;
    grenadeCooldown = 0;
    document.getElementById('gameOver').style.display = 'none';
    player.updateUI();
    document.getElementById('scoreDisplay').textContent = '💀 0';
    document.getElementById('timeDisplay').textContent = '⏱️ 0:00';
    gameLoop();
}

function restartGame() {
    document.getElementById('gameOver').style.display = 'none';
    gameRunning = true;
    document.getElementById('menu').style.display = 'none';
    initGame();
    iniciarMusicaSuspenso();
}

function gameLoop() {
    if (!gameRunning && gameStarted) {
        // Mostrar game over
        document.getElementById('gameOver').style.display = 'flex';
        document.getElementById('finalScore').textContent = 'Puntuación: ' + score;
        const mins = Math.floor(gameTime / 60);
        const segs = Math.floor(gameTime % 60);
        document.getElementById('finalTime').textContent = 'Tiempo: ' + mins + ':' + (segs < 10 ? '0' : '') + segs;
        pararMusicaSuspenso();
        return;
    }
    if (!gameStarted) return;
    
    frameCount++;
    gameTime += 1/60;
    const minutos = Math.floor(gameTime / 60);
    const segundos = Math.floor(gameTime % 60);
    document.getElementById('timeDisplay').textContent = '⏱️ ' + minutos + ':' + (segundos < 10 ? '0' : '') + segundos;
    
    // Actualizar dificultad por minuto
    const currentDifficulty = 1 + Math.floor(gameTime / 60);
    
    // Spawn de zombies
    const spawnRate = Math.max(15, 60 - currentDifficulty * 2);
    spawnTimer++;
    if (spawnTimer >= spawnRate) {
        spawnTimer = 0;
        const diff = currentDifficulty + Math.floor(Math.random() * 2);
        const zombie = new Zombie(diff);
        // Posición aleatoria en bordes
        if (Math.random() > 0.5) {
            zombie.x = Math.random() < 0.5 ? -30 : W + 10;
        } else {
            zombie.x = Math.random() * W;
            zombie.y = Math.random() < 0.5 ? -30 : H - 30;
        }
        zombies.push(zombie);
        zombieCount++;
    }
    
    // Actualizar jugador
    player.update(keys);
    if (player.health <= 0) {
        gameRunning = false;
        return;
    }
    
    // Disparo automático si se mantiene click/shoot
    if (keys['shoot'] || keys['click']) {
        player.shoot(projectiles);
    }
    
    // Actualizar proyectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.update();
        if (!p.alive) {
            projectiles.splice(i, 1);
            continue;
        }
        // Colisión con zombies
        for (const zombie of zombies) {
            if (!zombie.alive) continue;
            if (p.x > zombie.x && p.x < zombie.x + zombie.w &&
                p.y > zombie.y && p.y < zombie.y + zombie.h) {
                if (zombie.takeDamage(p.damage)) {
                    score += 10 + currentDifficulty * 2;
                    zombiesKilled++;
                    document.getElementById('scoreDisplay').textContent = '💀 ' + score;
                    // Dropear arma al azar
                    if (Math.random() > 0.7) {
                        const tipos = ['pistol', 'shotgun', 'smg'];
                        const tipo = tipos[Math.floor(Math.random() * tipos.length)];
                        const arma = new ArmaEnSuelo(zombie.x, zombie.y, tipo);
                        weaponsOnGround.push(arma);
                    }
                }
                p.alive = false;
                projectiles.splice(i, 1);
                break;
            }
        }
    }
    
    // Actualizar granadas
    for (let i = grenades.length - 1; i >= 0; i--) {
        const g = grenades[i];
        g.update();
        if (!g.alive) {
            grenades.splice(i, 1);
            continue;
        }
        // Daño de explosión a zombies
        if (g.exploded) {
            for (const zombie of zombies) {
                if (!zombie.alive) continue;
                const dmg = g.getExplosionDamage(zombie);
                if (dmg > 0) {
                    if (zombie.takeDamage(dmg)) {
                        score += 15 + currentDifficulty * 2;
                        zombiesKilled++;
                        document.getElementById('scoreDisplay').textContent = '💀 ' + score;
                        if (Math.random() > 0.7) {
                            const tipos = ['pistol', 'shotgun', 'smg'];
                            const tipo = tipos[Math.floor(Math.random() * tipos.length)];
                            const arma = new ArmaEnSuelo(zombie.x, zombie.y, tipo);
                            weaponsOnGround.push(arma);
                        }
                    }
                }
            }
        }
    }
    
    // Actualizar zombies
    for (const zombie of zombies) {
        if (!zombie.alive) continue;
        zombie.update(player, projectiles);
    }
    
    // Limpiar zombies muertos
    zombies = zombies.filter(z => z.alive);
    
    // Actualizar armas en suelo
    for (let i = weaponsOnGround.length - 1; i >= 0; i--) {
        const arma = weaponsOnGround[i];
        arma.update();
        if (arma.timer <= 0) {
            weaponsOnGround.splice(i, 1);
            continue;
        }
        // Recoger arma
        if (arma.x > player.x - 10 && arma.x < player.x + player.w + 10 &&
            arma.y > player.y - 10 && arma.y < player.y + player.h + 10) {
            // Reemplazar o añadir arma
            const idx = player.weapons.findIndex(w => w.type === arma.type);
            if (idx !== -1) {
                player.weapons[idx].ammo = player.weapons[idx].maxAmmo;
            } else {
                // Añadir nueva arma
                if (arma.type === 'shotgun') {
                    player.weapons.push({ name: 'Escopeta', damage: 3, ammo: 6, maxAmmo: 6, fireRate: 25, type: 'shotgun' });
                } else if (arma.type === 'smg') {
                    player.weapons.push({ name: 'Metralleta', damage: 1, ammo: 30, maxAmmo: 30, fireRate: 4, type: 'smg' });
                }
            }
            weaponsOnGround.splice(i, 1);
            player.updateUI();
            continue;
        }
    }
    
    // Recargar metralleta automáticamente si está vacía y hay balas
    const w = player.currentWeapon;
    if (w.type === 'smg' && w.ammo === 0 && w.maxAmmo > 0) {
        // Recarga automática después de 1 segundo
        if (!w.reloading) {
            w.reloading = true;
            w.reloadTimer = 60;
        }
        if (w.reloading) {
            w.reloadTimer--;
            if (w.reloadTimer <= 0) {
                w.ammo = w.maxAmmo;
                w.reloading = false;
                player.updateUI();
            }
        }
    }
    
    // Verificar si hay granadas en el suelo (por si caen)
    // Las granadas ya se manejan como objetos
    
    // Dibujar
    draw();
    
    requestAnimationFrame(gameLoop);
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Fondo - cielo nocturno
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(0.5, '#1a1a3a');
    grad.addColorStop(1, '#1a2a2a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Estrellas
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + 42) % W;
        const sy = (i * 237 + 13) % (H * 0.6);
        const size = (i % 3) + 1;
        ctx.fillRect(sx, sy, size, size);
    }
    
    // Suelo
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, H - 60, W, 60);
    ctx.fillStyle = '#2a3a2a';
    ctx.fillRect(0, H - 60, W, 2);
    // Líneas de suelo
    for (let i = 0; i < W; i += 40) {
        ctx.fillStyle = 'rgba(50,80,50,0.3)';
        ctx.fillRect(i, H - 55, 2, 10);
    }
    
    // Plataformas (2 pisos adicionales)
    const plataformas = [
        { x: 150, y: 320, w: 150, h: 12 },
        { x: 500, y: 320, w: 150, h: 12 },
        { x: 320, y: 220, w: 150, h: 12 },
        { x: 80, y: 150, w: 120, h: 12 },
        { x: 600, y: 150, w: 120, h: 12 }
    ];
    for (const p of plataformas) {
        ctx.fillStyle = '#3a4a3a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#4a5a4a';
        ctx.fillRect(p.x, p.y, p.w, 2);
        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(p.x + 4, p.y + 4, p.w, p.h);
        ctx.fillStyle = '#3a4a3a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
    }
    // Guardar plataformas para colisiones
    window.plataformas = plataformas;
    // Colisiones con plataformas (simplificadas)
    if (player) {
        for (const p of plataformas) {
            if (player.vy >= 0 &&
                player.x + player.w > p.x + 4 && player.x < p.x + p.w - 4 &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    }
    
    // Dibujar armas en suelo
    for (const arma of weaponsOnGround) {
        arma.draw(ctx);
    }
    
    // Dibujar granadas
    for (const g of grenades) {
        g.draw(ctx);
    }
    
    // Dibujar proyectiles
    for (const p of projectiles) {
        p.draw(ctx);
    }
    
    // Dibujar zombies
    for (const z of zombies) {
        z.draw(ctx);
    }
    
    // Dibujar jugador
    if (player) player.draw(ctx);
    
    // UI adicional - granadas
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('💣 ' + player.grenades, 10, 30);
    
    // Mostrar dificultad
    const mins = Math.floor(gameTime / 60);
    ctx.fillStyle = '#ffd700';
    ctx.font = '12px Arial';
    ctx.fillText('Dificultad: ' + (1 + mins), W - 100, 30);
}

// ============ ARMAS EN SUELO ============
class ArmaEnSuelo {
    constructor(x, y, type) {
        this.x = x + 10;
        this.y = y + 10;
        this.type = type;
        this.timer = 600; // 10 segundos
        this.bob = Math.random() * Math.PI * 2;
        this.colors = {
            pistol: '#ffdd44',
            shotgun: '#ff8844',
            smg: '#44ddff'
        };
        this.names = {
            pistol: '🔫 Pistola',
            shotgun: '🔫 Escopeta',
            smg: '🔫 Metralleta'
        };
    }
    
    update() {
        this.timer--;
        this.bob += 0.05;
        this.y += Math.sin(this.bob) * 0.2;
    }
    
    draw(ctx) {
        if (this.timer < 0) return;
        const alpha = this.timer < 60 ? this.timer / 60 : 1;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = this.colors[this.type];
        ctx.shadowBlur = 15;
        ctx.fillStyle = this.colors[this.type];
        ctx.fillRect(this.x, this.y, 20, 6);
        ctx.fillRect(this.x + 18, this.y - 2, 4, 10);
        // Texto
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        ctx.font = '10px Arial';
        ctx.fillText(this.names[this.type], this.x - 8, this.y - 8);
        ctx.globalAlpha = 1;
    }
}

// ============ CONTROLES ============
// Teclado
document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    keys[key] = true;
    if (key === ' ' || key === 'space') {
        e.preventDefault();
        keys['space'] = true;
        if (player && player.onGround) {
            player.vy = player.jumpPower;
            player.onGround = false;
        }
    }
    if (key === 'g') {
        if (player) player.throwGrenade(grenades);
    }
    if (key === 'e' || key === 'q') {
        if (player) player.switchWeapon();
    }
    // Disparo con clic simulado
    if (key === 'f') {
        keys['shoot'] = true;
    }
});

document.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    keys[key] = false;
    if (key === ' ' || key === 'space') keys['space'] = false;
    if (key === 'f') keys['shoot'] = false;
});

// Mouse
canvas.addEventListener('mousedown', (e) => {
    if (!gameRunning) return;
    keys['click'] = true;
    // Apuntar hacia el mouse
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    if (mx > player.x) player.facingRight = true;
    else player.facingRight = false;
    player.shoot(projectiles);
});

canvas.addEventListener('mouseup', () => {
    keys['click'] = false;
});

canvas.addEventListener('mouseleave', () => {
    keys['click'] = false;
});

// Controles móviles
document.querySelectorAll('#mobileControls button').forEach(btn => {
    const action = btn.dataset.action;
    
    const startAction = (e) => {
        e.preventDefault();
        if (!gameRunning) return;
        if (action === 'up') keys['w'] = true;
        else if (action === 'down') keys['s'] = true;
        else if (action === 'left') keys['a'] = true;
        else if (action === 'right') keys['d'] = true;
        else if (action === 'jump') {
            if (player && player.onGround) {
                player.vy = player.jumpPower;
                player.onGround = false;
            }
        } else if (action === 'shoot') {
            keys['shoot'] = true;
            if (player) player.shoot(projectiles);
        } else if (action === 'grenade') {
            if (player) player.throwGrenade(grenades);
        } else if (action === 'switch') {
            if (player) player.switchWeapon();
        }
    };
    
    const endAction = (e) => {
        e.preventDefault();
        if (action === 'up') keys['w'] = false;
        else if (action === 'down') keys['s'] = false;
        else if (action === 'left') keys['a'] = false;
        else if (action === 'right') keys['d'] = false;
        else if (action === 'shoot') keys['shoot'] = false;
    };
    
    btn.addEventListener('touchstart', startAction, { passive: false });
    btn.addEventListener('touchend', endAction, { passive: false });
    btn.addEventListener('touchcancel', endAction, { passive: false });
    btn.addEventListener('mousedown', startAction);
    btn.addEventListener('mouseup', endAction);
    btn.addEventListener('mouseleave', endAction);
});

// Evitar scroll en móvil
document.addEventListener('touchmove', (e) => {
    e.preventDefault();
}, { passive: false });
