<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: #1a1a2e;
        }
        #musicToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <button id="musicToggle">🔊 Música</button>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN INICIAL
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, S;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            S = Math.min(W / 800, H / 600);
        }
        window.addEventListener('resize', resize);
        resize();

        // ============================================================
        // ESTADO DEL JUEGO
        // ============================================================
        let juego = {
            menu: true,
            jugando: false,
            gameOver: false,
            genero: null,
            puntuacion: 0,
            tiempo: 0,
            tiempoInicio: 0,
            ultimoSpawn: 0,
            eliminados: 0,
            record: parseInt(localStorage.getItem('zombieRecord')) || 0
        };

        // ============================================================
        // MUSICA
        // ============================================================
        let musicaActiva = true;
        let audioCtx = null;
        let musicaInterval = null;

        function toggleMusica() {
            musicaActiva = !musicaActiva;
            document.getElementById('musicToggle').textContent = musicaActiva ? '🔊 Música' : '🔇 Música';
            if (musicaActiva) iniciarMusica();
            else detenerMusica();
        }
        document.getElementById('musicToggle').addEventListener('click', toggleMusica);

        function iniciarMusica() {
            if (!musicaActiva) return;
            try {
                if (audioCtx) audioCtx.close();
                audioCtx = new AudioContext();
                musicaInterval = setInterval(() => {
                    if (!musicaActiva || juego.gameOver || juego.menu) return;
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.value = 180 + Math.random() * 200;
                        gain.gain.value = 0.03 + Math.random() * 0.04;
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.2);
                    } catch(e) {}
                }, 500 + Math.random() * 400);
            } catch(e) {}
        }

        function detenerMusica() {
            if (musicaInterval) { clearInterval(musicaInterval);
                musicaInterval = null; }
            if (audioCtx) { try { audioCtx.close(); } catch(e) {}
                audioCtx = null; }
        }

        // ============================================================
        // PLATAFORMAS (escaladas)
        // ============================================================
        function getPlataformas() {
            const s = S;
            return [
                { x: 80 * s, y: 460 * s, w: 150 * s, h: 10 * s },
                { x: 350 * s, y: 460 * s, w: 150 * s, h: 10 * s },
                { x: 600 * s, y: 460 * s, w: 150 * s, h: 10 * s },
                { x: 200 * s, y: 350 * s, w: 130 * s, h: 10 * s },
                { x: 480 * s, y: 350 * s, w: 130 * s, h: 10 * s },
                { x: 80 * s, y: 240 * s, w: 110 * s, h: 10 * s },
                { x: 350 * s, y: 240 * s, w: 110 * s, h: 10 * s },
                { x: 620 * s, y: 240 * s, w: 110 * s, h: 10 * s }
            ];
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        function dist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randInt(min, max) {
            return Math.floor(rand(min, max + 1));
        }

        // ============================================================
        // PARTÍCULAS
        // ============================================================
        let particulas = [];

        function crearParticulas(x, y, color, n = 10, vel = 3) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const v = (1 + Math.random() * vel) * S;
                particulas.push({
                    x,
                    y,
                    dx: Math.cos(a) * v,
                    dy: Math.sin(a) * v - S,
                    vida: 20 + Math.random() * 20,
                    maxVida: 40,
                    radio: (2 + Math.random() * 4) * S,
                    color
                });
            }
        }

        function actualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.1 * S;
                p.vida--;
                if (p.vida <= 0) particulas.splice(i, 1);
            }
        }

        function dibujarParticulas() {
            for (const p of particulas) {
                const a = p.vida / p.maxVida;
                ctx.globalAlpha = a;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radio * a, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ============================================================
        // CLASES
        // ============================================================
        class Jugador {
            constructor(genero) {
                const s = S;
                this.x = W / 2 - 15 * s;
                this.y = H - 100 * s;
                this.w = 30 * s;
                this.h = 50 * s;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4 * s;
                this.genero = genero;
                this.vivo = true;
                this.enSuelo = false;
                this.saltos = 2;
                this.vidas = 3;
                this.maxVidas = 3;
                this.invulnerable = 0;
                this.arma = 'pistola';
                this.balasEscopeta = 0;
                this.balasMetralleta = 30;
                this.granadas = 3;
                this.mirando = 1;
                this.angulo = 0;
                this.frame = 0;
                this.tiempoFrame = 0;
                this.recargando = false;
                this.tiempoRecarga = 0;
            }

            get cx() { return this.x + this.w / 2; }
            get cy() { return this.y + this.h / 2; }

            saltar() {
                if (this.saltos > 0) {
                    this.vy = -11 * S;
                    this.saltos--;
                    this.enSuelo = false;
                    crearParticulas(this.cx, this.y + this.h, '#fff', 8, 2);
                }
            }

            mover(teclas, mx, my) {
                const s = S;
                const plataformas = getPlataformas();

                let dx = 0;
                if (teclas['ArrowLeft'] || teclas['a']) dx = -this.speed;
                if (teclas['ArrowRight'] || teclas['d']) dx = this.speed;

                this.angulo = Math.atan2(my - this.cy, mx - this.cx);
                this.mirando = Math.abs(this.angulo) < Math.PI / 2 ? 1 : -1;

                this.vx = dx;
                this.x += this.vx;

                this.vy += 0.5 * s;
                if (this.vy > 12 * s) this.vy = 12 * s;
                this.y += this.vy;

                this.enSuelo = false;
                for (const p of plataformas) {
                    if (this.vy >= 0 &&
                        this.x + this.w > p.x + 5 && this.x < p.x + p.w - 5 &&
                        this.y + this.h > p.y && this.y + this.h < p.y + p.h + 15) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.enSuelo = true;
                        this.saltos = 2;
                    }
                }

                if (this.y + this.h >= H - 50 * s) {
                    this.y = H - 50 * s - this.h;
                    this.vy = 0;
                    this.enSuelo = true;
                    this.saltos = 2;
                }

                this.x = Math.max(0, Math.min(W - this.w, this.x));

                if (Math.abs(this.vx) > 0.5 * s) {
                    this.tiempoFrame += 0.15;
                    if (this.tiempoFrame > 1) {
                        this.tiempoFrame = 0;
                        this.frame = (this.frame + 1) % 4;
                    }
                } else {
                    this.frame = 0;
                    this.tiempoFrame = 0;
                }

                if (this.invulnerable > 0) this.invulnerable--;

                if (this.recargando) {
                    this.tiempoRecarga++;
                    if (this.tiempoRecarga > 60) {
                        this.balasMetralleta = 30;
                        this.recargando = false;
                        this.tiempoRecarga = 0;
                    }
                }
            }

            disparar(mx, my) {
                if (this.arma === 'pistola') {
                    const a = Math.atan2(my - this.cy, mx - this.cx);
                    return new Bala(this.cx + Math.cos(a) * 20 * S, this.cy + Math.sin(a) * 20 * S - 5 * S, a, 'pistola');
                } else if (this.arma === 'escopeta' && this.balasEscopeta > 0) {
                    const a = Math.atan2(my - this.cy, mx - this.cx);
                    const balas = [];
                    for (let i = -3; i <= 3; i++) {
                        balas.push(new Bala(this.cx + Math.cos(a) * 20 * S, this.cy + Math.sin(a) * 20 * S - 5 * S, a + i * 0.08, 'escopeta'));
                    }
                    this.balasEscopeta--;
                    if (this.balasEscopeta === 0) this.arma = 'pistola';
                    return balas;
                } else if (this.arma === 'metralleta' && this.balasMetralleta > 0) {
                    const a = Math.atan2(my - this.cy, mx - this.cx);
                    this.balasMetralleta--;
                    if (this.balasMetralleta === 0) { this.recargando = true;
                        this.tiempoRecarga = 0; }
                    return [new Bala(this.cx + Math.cos(a) * 20 * S, this.cy + Math.sin(a) * 20 * S - 5 * S, a, 'metralleta')];
                }
                return null;
            }

            lanzarGranada(mx, my) {
                if (this.granadas <= 0) return null;
                const a = Math.atan2(my - this.cy, mx - this.cx);
                this.granadas--;
                return new Granada(this.cx, this.cy, a);
            }

            cambiarArma() {
                const armas = ['pistola', 'escopeta', 'metralleta'];
                let idx = armas.indexOf(this.arma);
                let nuevo = (idx + 1) % armas.length;
                let intentos = 0;
                while ((armas[nuevo] === 'escopeta' && this.balasEscopeta === 0) ||
                    (armas[nuevo] === 'metralleta' && this.balasMetralleta === 0)) {
                    nuevo = (nuevo + 1) % armas.length;
                    intentos++;
                    if (intentos > 3) break;
                }
                this.arma = armas[nuevo];
                this.recargando = false;
                this.tiempoRecarga = 0;
            }

            recibirDaño() {
                if (this.invulnerable > 0) return false;
                this.vidas--;
                this.invulnerable = 60;
                crearParticulas(this.cx, this.cy, '#ff1744', 20, 5);
                if (this.vidas <= 0) { this.vidas = 0;
                    this.vivo = false; }
                return true;
            }

            dibujar() {
                const s = S;
                const x = this.x,
                    y = this.y;

                if (this.invulnerable > 0 && Math.floor(this.invulnerable / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10 * s;

                // Cuerpo
                const color = this.genero === 'hombre' ? '#1a237e' : '#4a148c';
                ctx.fillStyle = color;
                ctx.fillRect(x + 4 * s, y + 12 * s, 22 * s, 24 * s);

                // Cabeza
                ctx.fillStyle = '#ffccbc';
                ctx.beginPath();
                ctx.arc(x + this.w / 2, y + 9 * s, 12 * s, 0, Math.PI * 2);
                ctx.fill();

                // Pelo
                if (this.genero === 'hombre') {
                    ctx.fillStyle = '#2c1810';
                    ctx.fillRect(x + 4 * s, y + 2 * s, 22 * s, 5 * s);
                    ctx.fillRect(x + 6 * s, y + 1 * s, 18 * s, 4 * s);
                    // Anteojos
                    ctx.strokeStyle = '#1a1a1a';
                    ctx.lineWidth = 2 * s;
                    ctx.beginPath();
                    ctx.arc(x + 10 * s, y + 8 * s, 6 * s, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(x + 20 * s, y + 8 * s, 6 * s, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(20,20,20,0.7)';
                    ctx.beginPath();
                    ctx.arc(x + 10 * s, y + 8 * s, 5 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 20 * s, y + 8 * s, 5 * s, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#8D6E63';
                    ctx.beginPath();
                    ctx.moveTo(x + 4 * s, y + 4 * s);
                    ctx.quadraticCurveTo(x, y + 16 * s, x + 4 * s, y + 28 * s);
                    ctx.quadraticCurveTo(x + 8 * s, y + 32 * s, x + 12 * s, y + 28 * s);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + 26 * s, y + 4 * s);
                    ctx.quadraticCurveTo(x + 30 * s, y + 16 * s, x + 26 * s, y + 28 * s);
                    ctx.quadraticCurveTo(x + 22 * s, y + 32 * s, x + 18 * s, y + 28 * s);
                    ctx.fill();
                    // Moño
                    ctx.fillStyle = '#E91E63';
                    ctx.beginPath();
                    ctx.arc(x + this.w / 2 + 12 * s * this.mirando, y + 2 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                    // Ojos grandes
                    const ox = x + this.w / 2 + (this.mirando > 0 ? 4 * s : -4 * s);
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(ox - 4 * s, y + 8 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ox + 4 * s, y + 8 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#5D4037';
                    ctx.beginPath();
                    ctx.arc(ox - 3 * s + this.mirando * s, y + 9 * s, 2.5 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ox + 5 * s + this.mirando * s, y + 9 * s, 2.5 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#E57373';
                    ctx.beginPath();
                    ctx.arc(x + this.w / 2, y + 15 * s, 4 * s, 0, Math.PI);
                    ctx.fill();
                }

                ctx.shadowBlur = 0;

                // Brazos y arma
                ctx.fillStyle = '#ffccbc';
                const by = y + 18 * s;
                const bx = x + (this.mirando > 0 ? this.w : -8 * s);
                ctx.fillRect(bx - 3 * s, by, 6 * s, 14 * s);

                // Arma
                const mx2 = bx + (this.mirando > 0 ? 3 * s : -3 * s);
                const my2 = by + 12 * s;
                ctx.save();
                ctx.translate(mx2, my2);
                ctx.rotate(this.angulo * this.mirando);
                ctx.fillStyle = '#37474F';
                ctx.shadowBlur = 5 * s;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, -3 * s, 20 * s, 6 * s);
                if (this.arma === 'escopeta') {
                    ctx.fillStyle = '#5D4037';
                    ctx.fillRect(-8 * s, -3 * s, 10 * s, 6 * s);
                    ctx.fillRect(18 * s, -4 * s, 4 * s, 8 * s);
                } else if (this.arma === 'metralleta') {
                    ctx.fillStyle = '#263238';
                    ctx.fillRect(0, -3 * s, 24 * s, 6 * s);
                    ctx.fillRect(5 * s, 2 * s, 8 * s, 6 * s);
                }
                ctx.restore();

                // Piernas
                ctx.fillStyle = color;
                const paso = this.frame * 0.3;
                ctx.fillRect(x + 4 * s, y + 38 * s, 7 * s, 12 * s + Math.sin(paso) * 3 * s);
                ctx.fillRect(x + 19 * s, y + 38 * s, 7 * s, 12 * s + Math.sin(paso + Math.PI) * 3 * s);

                ctx.fillStyle = '#4E342E';
                ctx.fillRect(x + 3 * s, y + 50 * s + Math.sin(paso) * 3 * s, 9 * s, 4 * s);
                ctx.fillRect(x + 18 * s, y + 50 * s + Math.sin(paso + Math.PI) * 3 * s, 9 * s, 4 * s);

                ctx.restore();

                // Corazones
                for (let i = 0; i < this.maxVidas; i++) {
                    ctx.font = `${18*s}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const cx2 = x + i * 20 * s;
                    const cy2 = y - 25 * s;
                    ctx.fillStyle = i < this.vidas ? '#ff1744' : '#333';
                    ctx.shadowColor = i < this.vidas ? '#ff1744' : 'transparent';
                    ctx.shadowBlur = i < this.vidas ? 10 * s : 0;
                    ctx.fillText('❤️', cx2 + 8 * s, cy2 + 10 * s);
                }
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        // ============================================================
        class Perro {
            constructor(x, y) {
                const s = S;
                this.x = x;
                this.y = y;
                this.w = 25 * s;
                this.h = 20 * s;
                this.vivo = true;
                this.speed = 3 * s;
                this.objetivo = null;
                this.tiempoAtaque = 0;
                this.frame = 0;
                this.tiempoFrame = 0;
                this.mirando = 1;
            }

            get cx() { return this.x + this.w / 2; }
            get cy() { return this.y + this.h / 2; }

            buscar(zombis) {
                let mejor = null,
                    distMin = Infinity;
                for (const z of zombis) {
                    if (!z.vivo) continue;
                    const d = dist(this, z);
                    if (d < distMin && d < 400 * S) {
                        distMin = d;
                        mejor = z;
                    }
                }
                this.objetivo = mejor;
            }

            mover(jugador) {
                const s = S;
                const plataformas = getPlataformas();
                if (!this.vivo) return;

                let dx = 0,
                    dy = 0;
                if (this.objetivo && this.objetivo.vivo) {
                    dx = this.objetivo.cx - this.cx;
                    dy = this.objetivo.cy - this.cy;
                    const d = Math.hypot(dx, dy);
                    if (d > 10 * s) { this.x += (dx / d) * this.speed;
                        this.y += (dy / d) * this.speed; }
                    this.mirando = dx > 0 ? 1 : -1;
                } else {
                    dx = jugador.cx - this.cx;
                    dy = jugador.cy - this.cy;
                    const d = Math.hypot(dx, dy);
                    if (d > 60 * s) { this.x += (dx / d) * this.speed * 0.5;
                        this.y += (dy / d) * this.speed * 0.5; }
                    this.mirando = dx > 0 ? 1 : -1;
                }

                for (const p of plataformas) {
                    if (this.x + this.w > p.x + 2 && this.x < p.x + p.w - 2 &&
                        this.y + this.h > p.y && this.y + this.h < p.y + p.h + 10) {
                        this.y = p.y - this.h;
                    }
                }
                if (this.y + this.h >= H - 50 * s) this.y = H - 50 * s - this.h;

                this.x = Math.max(0, Math.min(W - this.w, this.x));
                this.y = Math.max(0, Math.min(H - 50 * s - this.h, this.y));

                this.tiempoFrame += 0.15;
                if (this.tiempoFrame > 1) { this.tiempoFrame = 0;
                    this.frame = (this.frame + 1) % 4; }
                if (this.tiempoAtaque > 0) this.tiempoAtaque--;
            }

            atacar(zombis) {
                if (this.tiempoAtaque > 0 || !this.objetivo || !this.objetivo.vivo) return false;
                const d = dist(this, this.objetivo);
                if (d < 40 * S) {
                    this.objetivo.vida -= 2;
                    this.tiempoAtaque = 30;
                    crearParticulas(this.objetivo.cx, this.objetivo.cy, '#ff6b00', 15, 4);
                    if (this.objetivo.vida <= 0) {
                        this.objetivo.vivo = false;
                        this.objetivo = null;
                        return true;
                    }
                }
                return false;
            }

            dibujar() {
                const s = S;
                if (!this.vivo) return;
                const x = this.x,
                    y = this.y;

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8 * s;

                ctx.fillStyle = '#8D6E63';
                ctx.beginPath();
                ctx.roundRect(x + 4 * s, y + 6 * s, 17 * s, 12 * s, 4 * s);
                ctx.fill();

                ctx.fillStyle = '#8D6E63';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? 6 * s : -6 * s), y + 6 * s, 8 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#6D4C41';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? 12 * s : -12 * s), y + 8 * s, 4 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? 15 * s : -15 * s), y + 7 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? 8 * s : -8 * s), y + 4 * s, 3 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#4a2c0a';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? 9 * s : -9 * s), y + 5 * s, 1.5 * s, 0, Math.PI * 2);
                ctx.fill();

                // Orejas
                ctx.fillStyle = '#6D4C41';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? -2 * s : 2 * s), y + 1 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + (this.mirando > 0 ? 6 * s : -6 * s), y + 1 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();

                // Collar
                ctx.fillStyle = '#D32F2F';
                ctx.fillRect(x + 4 * s, y + 10 * s, 17 * s, 3 * s);

                // Patas
                ctx.fillStyle = '#6D4C41';
                const paso = this.frame * 0.3;
                ctx.fillRect(x + 3 * s, y + 18 * s + Math.sin(paso) * 2 * s, 4 * s, 6 * s);
                ctx.fillRect(x + 9 * s, y + 18 * s + Math.sin(paso + Math.PI) * 2 * s, 4 * s, 6 * s);
                ctx.fillRect(x + 15 * s, y + 18 * s + Math.sin(paso + Math.PI * 0.5) * 2 * s, 4 * s, 6 * s);

                // Cola
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 3 * s;
                const cx2 = this.mirando > 0 ? x : x + this.w;
                ctx.beginPath();
                ctx.moveTo(cx2, y + 8 * s);
                ctx.quadraticCurveTo(cx2 + (this.mirando > 0 ? -8 * s : 8 * s), y - 4 * s, cx2 + (this.mirando > 0 ? -12 * s : 12 * s), y - 8 * s);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.restore();

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${8*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('🐕 REX', this.cx, y - 6 * s);
            }
        }

        // ============================================================
        class Zombi {
            constructor(x, y, nivel) {
                const s = S;
                this.x = x;
                this.y = y;
                this.w = 28 * s;
                this.h = 44 * s;
                this.vida = nivel;
                this.maxVida = nivel;
                this.speed = (1 + nivel * 0.15) * s;
                this.nivel = nivel;
                this.vivo = true;
                this.tipo = 'normal';
                this.dispara = false;
                this.tiempoDisparo = 0;
                this.frame = 0;
                this.tiempoFrame = 0;
            }

            get cx() { return this.x + this.w / 2; }
            get cy() { return this.y + this.h / 2; }

            configurar(minutos) {
                if (minutos >= 2) {
                    const prob = Math.min(0.25 + (minutos - 2) * 0.03, 0.45);
                    if (Math.random() < prob) {
                        this.tipo = 'disparador';
                        this.dispara = true;
                        this.speed *= 0.7;
                    }
                }
            }

            mover(jugador) {
                const s = S;
                const plataformas = getPlataformas();
                if (!this.vivo) return;

                const dx = jugador.cx - this.cx;
                const dy = jugador.cy - this.cy;
                const d = Math.hypot(dx, dy);

                if (d > 20 * s) {
                    this.x += (dx / d) * this.speed;
                    this.y += (dy / d) * this.speed;
                }

                for (const p of plataformas) {
                    if (this.x + this.w > p.x + 2 && this.x < p.x + p.w - 2 &&
                        this.y + this.h > p.y && this.y + this.h < p.y + p.h + 10) {
                        this.y = p.y - this.h;
                    }
                }

                this.x = Math.max(0, Math.min(W - this.w, this.x));
                this.y = Math.max(0, Math.min(H - 50 * s - this.h, this.y));

                this.tiempoFrame += 0.1;
                if (this.tiempoFrame > 1) { this.tiempoFrame = 0;
                    this.frame = (this.frame + 1) % 4; }
            }

            dibujar() {
                const s = S;
                if (!this.vivo) return;
                const x = this.x,
                    y = this.y;
                const colores = ['#00E676', '#FF9100', '#FF1744', '#7C4DFF', '#8B0000'];
                const color = colores[Math.min(this.nivel - 1, colores.length - 1)];

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8 * s;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x + 3 * s, y + 6 * s, 22 * s, 28 * s, 4 * s);
                ctx.fill();

                ctx.shadowBlur = 0;

                ctx.fillStyle = '#2E7D32';
                ctx.beginPath();
                ctx.arc(x + this.w / 2, y + 8 * s, 12 * s, 0, Math.PI * 2);
                ctx.fill();

                const grad = ctx.createRadialGradient(x + this.w / 2 - 4 * s, y + 6 * s, 0, x + this.w / 2 - 4 * s, y + 6 * s, 5 * s);
                grad.addColorStop(0, '#FF1744');
                grad.addColorStop(1, '#B71C1C');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x + this.w / 2 - 4 * s, y + 6 * s, 3.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + 4 * s, y + 6 * s, 3.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x + this.w / 2 - 3 * s, y + 7 * s, 1.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.w / 2 + 5 * s, y + 7 * s, 1.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                for (let i = -6 * s; i <= 6 * s; i += 4 * s) {
                    ctx.fillRect(x + this.w / 2 + i - 1 * s, y + 12 * s, 3 * s, 4 * s);
                }

                const paso = this.frame * 0.2;
                ctx.fillStyle = '#1B5E20';
                ctx.fillRect(x - 4 * s, y + 14 * s + Math.sin(paso) * 3 * s, 5 * s, 12 * s);
                ctx.fillRect(x + this.w - 1 * s, y + 14 * s + Math.sin(paso + Math.PI) * 3 * s, 5 * s, 12 * s);

                ctx.fillStyle = color;
                const paso2 = this.frame * 0.3;
                ctx.fillRect(x + 4 * s, y + 34 * s + Math.sin(paso2) * 2 * s, 7 * s, 10 * s + Math.sin(paso2) * 2 * s);
                ctx.fillRect(x + 17 * s, y + 34 * s + Math.sin(paso2 + Math.PI) * 2 * s, 7 * s, 10 * s + Math.sin(paso2 + Math.PI) * 2 * s);

                ctx.restore();

                if (this.dispara) {
                    ctx.fillStyle = 'rgba(255,0,0,0.3)';
                    ctx.font = `${10*s}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('🔫', this.cx, y - 16 * s);
                }

                if (this.vida < this.maxVida) {
                    const bw = this.w + 10 * s;
                    const bx = x - 5 * s;
                    const by = y - 12 * s;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(bx, by, bw, 4 * s);
                    ctx.fillStyle = this.vida / this.maxVida > 0.5 ? '#00E676' : '#FF1744';
                    ctx.fillRect(bx, by, bw * (this.vida / this.maxVida), 4 * s);
                }
            }

            recibirDaño(d) {
                this.vida -= d;
                crearParticulas(this.cx, this.cy, '#ff1744', 10, 3);
                if (this.vida <= 0) { this.vivo = false; }
                return !this.vivo;
            }
        }

        // ============================================================
        class Bala {
            constructor(x, y, angulo, tipo, enemiga = false) {
                const s = S;
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.enemiga = enemiga;
                this.vel = (tipo === 'pistola' ? 14 : tipo === 'metralleta' ? 16 : 10) * s;
                this.radio = (tipo === 'pistola' ? 4 : tipo === 'metralleta' ? 3 : 8) * s;
                this.dx = Math.cos(angulo) * this.vel;
                this.dy = Math.sin(angulo) * this.vel;
                this.daño = tipo === 'escopeta' ? 3 : 1;
                this.vida = 80;
                this.trail = [];
            }

            mover() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();
                this.x += this.dx;
                this.y += this.dy;
                this.vida--;
            }

            dibujar() {
                const s = S;
                for (let i = 0; i < this.trail.length; i++) {
                    const a = i / this.trail.length * 0.4;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, this.radio * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = this.enemiga ? `rgba(255,0,0,${a})` :
                        this.tipo === 'pistola' ? `rgba(255,255,0,${a})` :
                        this.tipo === 'metralleta' ? `rgba(0,200,255,${a})` :
                        `rgba(255,165,0,${a})`;
                    ctx.fill();
                }

                const grad = ctx.createRadialGradient(this.x - 2 * s, this.y - 2 * s, 0, this.x, this.y, this.radio);
                if (this.enemiga) {
                    grad.addColorStop(0, '#FF6666');
                    grad.addColorStop(1, '#CC0000');
                } else if (this.tipo === 'pistola') {
                    grad.addColorStop(0, '#FFFF88');
                    grad.addColorStop(1, '#CCAA00');
                } else if (this.tipo === 'metralleta') {
                    grad.addColorStop(0, '#88FFFF');
                    grad.addColorStop(1, '#0099CC');
                } else {
                    grad.addColorStop(0, '#FFAA44');
                    grad.addColorStop(1, '#CC6600');
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
            }
        }

        // ============================================================
        class Granada {
            constructor(x, y, angulo) {
                const s = S;
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angulo) * 3 * s;
                this.vy = Math.sin(angulo) * 3 * s - 2 * s;
                this.radio = 10 * s;
                this.alive = true;
                this.timer = 90;
                this.exploto = false;
                this.explosionR = 0;
                this.maxR = 130 * s;
                this.timerExp = 0;
            }

            mover() {
                const s = S;
                const plataformas = getPlataformas();
                if (this.exploto) {
                    this.timerExp++;
                    this.explosionR += 4 * s;
                    if (this.timerExp > 25) this.alive = false;
                    return;
                }
                this.timer--;
                this.vy += 0.3 * s;
                this.x += this.vx;
                this.y += this.vy;

                for (const p of plataformas) {
                    if (this.x > p.x && this.x < p.x + p.w &&
                        this.y + this.radio > p.y && this.y + this.radio < p.y + p.h + 10) {
                        this.y = p.y - this.radio;
                        this.vy *= -0.3;
                    }
                }
                if (this.y + this.radio > H - 50 * s) {
                    this.y = H - 50 * s - this.radio;
                    this.vy *= -0.3;
                }
                if (this.timer <= 0) this.exploto = true;
            }

            colisiona(zombi) {
                if (this.exploto) return false;
                return dist(this, zombi) < this.radio + 16 * S;
            }

            dibujar() {
                const s = S;
                if (this.exploto) {
                    const a = 1 - (this.timerExp / 25);
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.explosionR);
                    grad.addColorStop(0, `rgba(255,200,50,${a*0.9})`);
                    grad.addColorStop(0.3, `rgba(255,100,20,${a*0.7})`);
                    grad.addColorStop(0.7, `rgba(200,50,0,${a*0.5})`);
                    grad.addColorStop(1, `rgba(100,20,0,0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.explosionR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowColor = '#ff8800';
                    ctx.shadowBlur = 40 * s;
                    ctx.fillStyle = `rgba(255,200,100,${a*0.3})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.explosionR * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    return;
                }
                ctx.shadowColor = '#333';
                ctx.shadowBlur = 8 * s;
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(this.x - 3 * s, this.y - 12 * s, 6 * s, 4 * s);
                if (Math.floor(this.timer / 10) % 2 === 0) {
                    ctx.fillStyle = '#ff3333';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 5 * s, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            getDaño(zombi) {
                if (!this.exploto) return 0;
                const d = dist(this, zombi);
                if (d < this.explosionR) return Math.floor(8 * (1 - d / this.explosionR));
                return 0;
            }
        }

        // ============================================================
        class ArmaSuelo {
            constructor(x, y, tipo) {
                const s = S;
                this.x = x;
                this.y = this.encontrarPiso(x, y);
                this.tipo = tipo;
                this.radio = 14 * s;
                this.activo = true;
                this.timer = 600;
                this.flotando = 0;
                this.tiempo = 0;
            }

            encontrarPiso(x, y) {
                const s = S;
                const plataformas = getPlataformas();
                let piso = H - 50 * s;
                for (const p of plataformas) {
                    if (x > p.x && x < p.x + p.w && y < p.y && p.y < piso) piso = p.y;
                }
                return piso - 20 * s;
            }

            dibujar() {
                const s = S;
                if (!this.activo || this.timer <= 0) return;
                this.tiempo++;
                this.flotando = Math.sin(this.tiempo * 0.05) * 4 * s;

                ctx.save();
                ctx.shadowColor = 'rgba(255,165,0,0.5)';
                ctx.shadowBlur = 25 * s;

                const grad = ctx.createRadialGradient(this.x, this.y + this.flotando, 0, this.x, this.y + this.flotando, this.radio);
                grad.addColorStop(0, '#FFB74D');
                grad.addColorStop(1, '#E65100');
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.flotando, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * s;
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = `${16*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🔫', this.x, this.y + this.flotando);

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = `${9*s}px Arial`;
                ctx.textBaseline = 'top';
                ctx.fillText(this.tipo.toUpperCase(), this.x, this.y + this.flotando + this.radio + 4 * s);
                ctx.restore();
            }
        }

        class CorazonSuelo {
            constructor(x, y) {
                const s = S;
                this.x = x;
                this.y = y;
                this.radio = 15 * s;
                this.activo = true;
                this.timer = 600;
                this.flotando = 0;
                this.tiempo = 0;
            }

            dibujar() {
                const s = S;
                if (!this.activo || this.timer <= 0) return;
                this.tiempo++;
                this.flotando = Math.sin(this.tiempo * 0.05) * 4 * s;

                ctx.save();
                ctx.shadowColor = 'rgba(255,0,0,0.5)';
                ctx.shadowBlur = 30 * s;

                ctx.font = `${30*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('❤️', this.x, this.y + this.flotando);

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = `${8*s}px Arial`;
                ctx.textBaseline = 'top';
                ctx.fillText('+1 VIDA', this.x, this.y + this.flotando + 18 * s);
                ctx.restore();
            }
        }

        // ============================================================
        // VARIABLES DEL JUEGO
        // ============================================================
        let jugador = null;
        let zombis = [];
        let balas = [];
        let balasEnemigas = [];
        let granadas = [];
        let armasSuelo = [];
        let corazonesSuelo = [];
        let granadasSuelo = [];
        let perro = null;
        let teclas = {};
        let mouseX = 0,
            mouseY = 0;
        let mousePresionado = false;
        let disparoCooldown = 0;
        let spawnTimer = 0;
        let granadaSueloTimer = 0;
        let perroActivo = false;
        let eliminadosParaCorazon = 0;

        // ============================================================
        // FUNCIONES DEL JUEGO
        // ============================================================
        function reiniciarJuego(genero) {
            const s = S;
            jugador = new Jugador(genero);
            zombis = [];
            balas = [];
            balasEnemigas = [];
            granadas = [];
            armasSuelo = [];
            corazonesSuelo = [];
            granadasSuelo = [];
            perro = null;
            perroActivo = false;
            eliminadosParaCorazon = 0;
            juego.puntuacion = 0;
            juego.tiempo = 0;
            juego.tiempoInicio = Date.now();
            juego.ultimoSpawn = 0;
            juego.gameOver = false;
            juego.jugando = true;
            juego.menu = false;
            mousePresionado = false;
            disparoCooldown = 0;
            spawnTimer = 0;
            granadaSueloTimer = 0;
            particulas = [];
        }

        function spawnZombi() {
            const s = S;
            const minutos = Math.floor(juego.tiempo / 60);
            const nivel = Math.min(minutos + 1, 8);
            const margen = 80 * s;
            let x, y;
            let intentos = 0;
            do {
                const lado = randInt(0, 3);
                if (lado === 0) { x = rand(0, W);
                    y = -margen; } else if (lado === 1) { x = rand(0, W);
                    y = H - 50 * s + margen; } else if (lado === 2) { x = -margen;
                    y = rand(0, H - 50 * s); } else { x = W + margen;
                    y = rand(0, H - 50 * s); }
                intentos++;
            } while (dist({ x, y }, jugador) < 200 * s && intentos < 20);

            const z = new Zombi(x, y, nivel);
            z.configurar(minutos);
            return z;
        }

        function disparar() {
            if (disparoCooldown > 0 || !jugador || !jugador.vivo) return;
            const balas2 = jugador.disparar(mouseX, mouseY);
            if (balas2) {
                if (Array.isArray(balas2)) balas.push(...balas2);
                else balas.push(balas2);
                disparoCooldown = 8;
                const a = Math.atan2(mouseY - jugador.cy, mouseX - jugador.cx);
                crearParticulas(jugador.cx + Math.cos(a) * 25 * S, jugador.cy + Math.sin(a) * 25 * S, '#FFD700', 5, 2);
            }
        }

        function actualizar() {
            if (juego.menu || juego.gameOver || !jugador || !jugador.vivo) return;

            const tiempo = (Date.now() - juego.tiempoInicio) / 1000;
            juego.tiempo = tiempo;
            const minutos = Math.floor(tiempo / 60);

            // Actualizar jugador
            jugador.mover(teclas, mouseX, mouseY);
            disparoCooldown = Math.max(0, disparoCooldown - 1);

            // Perro (minuto 2)
            if (minutos >= 2 && !perroActivo && !perro) {
                perro = new Perro(jugador.x - 40 * S, jugador.y);
                perroActivo = true;
                crearParticulas(perro.cx, perro.cy, '#FFD700', 30, 5);
            }

            if (perro && perro.vivo) {
                perro.buscar(zombis);
                perro.mover(jugador);
                if (perro.atacar(zombis)) {
                    juego.puntuacion += 5;
                    eliminadosParaCorazon++;
                    if (eliminadosParaCorazon >= 20) {
                        eliminadosParaCorazon = 0;
                        const cx = perro.cx + rand(-50 * S, 50 * S);
                        const cy = perro.cy + rand(-50 * S, 50 * S);
                        corazonesSuelo.push(new CorazonSuelo(
                            Math.max(20 * S, Math.min(W - 20 * S, cx)),
                            Math.max(20 * S, Math.min(H - 80 * S, cy))
                        ));
                    }
                }
                zombis = zombis.filter(z => z.vivo);
            }

            // Granadas en suelo
            granadaSueloTimer++;
            if (granadaSueloTimer > 1800 && granadasSuelo.length < 3) {
                granadaSueloTimer = 0;
                granadasSuelo.push({
                    x: 50 * S + rand(0, W - 100 * S),
                    y: 50 * S + rand(0, H - 150 * S),
                    radio: 12 * S,
                    activo: true
                });
                crearParticulas(granadasSuelo[granadasSuelo.length - 1].x, granadasSuelo[granadasSuelo.length - 1].y, '#FFD700', 10, 3);
            }

            // Recoger granadas
            for (let i = granadasSuelo.length - 1; i >= 0; i--) {
                const g = granadasSuelo[i];
                if (!g.activo) { granadasSuelo.splice(i, 1); continue; }
                if (dist(g, jugador) < 35 * S) {
                    if (jugador.granadas < jugador.maxGranadas) {
                        jugador.granadas++;
                        g.activo = false;
                        granadasSuelo.splice(i, 1);
                        crearParticulas(g.x, g.y, '#FFD700', 15, 4);
                    }
                }
            }

            // Recoger corazones
            for (let i = corazonesSuelo.length - 1; i >= 0; i--) {
                const c = corazonesSuelo[i];
                if (!c.activo) { corazonesSuelo.splice(i, 1); continue; }
                if (dist(c, jugador) < 30 * S) {
                    if (jugador.vidas < jugador.maxVidas) {
                        jugador.vidas++;
                        c.activo = false;
                        corazonesSuelo.splice(i, 1);
                        crearParticulas(c.x, c.y, '#FF1744', 20, 5);
                    }
                }
            }

            // Balas del jugador
            for (let i = balas.length - 1; i >= 0; i--) {
                const b = balas[i];
                b.mover();
                if (b.x < -20 * S || b.x > W + 20 * S || b.y < -20 * S || b.y > H + 20 * S || b.vida <= 0) {
                    balas.splice(i, 1);
                    continue;
                }
                // Colisión con zombis
                for (const z of zombis) {
                    if (!z.vivo) continue;
                    if (dist(b, z) < b.radio + 16 * S) {
                        if (z.recibirDaño(b.daño)) {
                            juego.puntuacion += 5 + Math.floor(minutos * 0.5);
                            eliminadosParaCorazon++;
                            if (eliminadosParaCorazon >= 20) {
                                eliminadosParaCorazon = 0;
                                const cx = z.cx + rand(-50 * S, 50 * S);
                                const cy = z.cy + rand(-50 * S, 50 * S);
                                corazonesSuelo.push(new CorazonSuelo(
                                    Math.max(20 * S, Math.min(W - 20 * S, cx)),
                                    Math.max(20 * S, Math.min(H - 80 * S, cy))
                                ));
                            }
                            if (Math.random() < 0.12) {
                                const tipos = ['escopeta', 'metralleta'];
                                armasSuelo.push(new ArmaSuelo(z.x, z.y, tipos[randInt(0, 1)]));
                            }
                            crearParticulas(z.cx, z.cy, '#00E676', 20, 5);
                        }
                        balas.splice(i, 1);
                        break;
                    }
                }
            }

            // Balas enemigas
            for (let i = balasEnemigas.length - 1; i >= 0; i--) {
                const b = balasEnemigas[i];
                b.mover();
                if (b.x < -20 * S || b.x > W + 20 * S || b.y < -20 * S || b.y > H + 20 * S || b.vida <= 0) {
                    balasEnemigas.splice(i, 1);
                    continue;
                }
                if (jugador.vivo && dist(b, jugador) < b.radio + 15 * S) {
                    jugador.recibirDaño();
                    balasEnemigas.splice(i, 1);
                    if (!jugador.vivo) { juego.gameOver = true; return; }
                }
            }

            // Granadas
            for (let i = granadas.length - 1; i >= 0; i--) {
                const g = granadas[i];
                g.mover();
                if (!g.alive) { granadas.splice(i, 1); continue; }

                if (!g.exploto) {
                    for (const z of zombis) {
                        if (g.colisiona(z)) { g.exploto = true; break; }
                    }
                }

                if (g.exploto) {
                    for (const z of zombis) {
                        const d = g.getDaño(z);
                        if (d > 0 && z.recibirDaño(d)) {
                            juego.puntuacion += 10 + minutos;
                            eliminadosParaCorazon++;
                            if (eliminadosParaCorazon >= 20) {
                                eliminadosParaCorazon = 0;
                                const cx = z.cx + rand(-50 * S, 50 * S);
                                const cy = z.cy + rand(-50 * S, 50 * S);
                                corazonesSuelo.push(new CorazonSuelo(
                                    Math.max(20 * S, Math.min(W - 20 * S, cx)),
                                    Math.max(20 * S, Math.min(H - 80 * S, cy))
                                ));
                            }
                            if (Math.random() < 0.15) {
                                const tipos = ['escopeta', 'metralleta'];
                                armasSuelo.push(new ArmaSuelo(z.x, z.y, tipos[randInt(0, 1)]));
                            }
                            crearParticulas(z.cx, z.cy, '#00E676', 20, 5);
                        }
                    }
                }
            }

            // Zombis
            for (const z of zombis) {
                if (!z.vivo) continue;
                z.mover(jugador);

                if (dist(z, jugador) < 30 * S) {
                    if (z.tiempoAtaque <= 0) {
                        jugador.recibirDaño();
                        z.tiempoAtaque = 40;
                        if (!jugador.vivo) { juego.gameOver = true; return; }
                    }
                }

                if (z.dispara && dist(z, jugador) < 350 * S && dist(z, jugador) > 50 * S) {
                    z.tiempoDisparo++;
                    if (z.tiempoDisparo > 60 + rand(0, 40)) {
                        z.tiempoDisparo = 0;
                        const a = Math.atan2(jugador.cy - z.cy, jugador.cx - z.cx);
                        balasEnemigas.push(new Bala(z.cx, z.cy, a, 'pistola', true));
                        crearParticulas(z.cx, z.cy, '#FF6B6B', 5, 2);
                    }
                }
            }
            zombis = zombis.filter(z => z.vivo);

            // Armas en suelo
            for (let i = armasSuelo.length - 1; i >= 0; i--) {
                const a = armasSuelo[i];
                a.timer--;
                if (a.timer <= 0) { armasSuelo.splice(i, 1); continue; }
                if (a.activo && dist(a, jugador) < jugador.w / 2 + a.radio + 10 * S) {
                    if (a.tipo === 'escopeta') { jugador.arma = 'escopeta';
                        jugador.balasEscopeta = 6; } else if (a.tipo === 'metralleta') { jugador.arma = 'metralleta';
                        jugador.balasMetralleta = 30;
                        jugador.recargando = false; }
                    a.activo = false;
                    armasSuelo.splice(i, 1);
                    crearParticulas(a.x, a.y, '#FF9100', 20, 5);
                }
            }

            // Spawn de zombis
            const spawnRate = Math.max(300, 1200 - (minutos * 20));
            spawnTimer++;
            if (spawnTimer > spawnRate / 16) {
                spawnTimer = 0;
                const cantidad = Math.min(1 + Math.floor(minutos * 0.2), 8);
                for (let i = 0; i < cantidad; i++) {
                    zombis.push(spawnZombi());
                }
            }

            actualizarParticulas();
        }

        // ============================================================
        // DIBUJADO
        // ============================================================
        function dibujar() {
            const s = S;
            ctx.clearRect(0, 0, W, H);

            // Fondo
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.5, '#1a1a2e');
            grad.addColorStop(1, '#0d0d1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Suelo
            ctx.fillStyle = 'rgba(30,30,50,0.5)';
            ctx.fillRect(0, H - 50 * s, W, 50 * s);

            // Plataformas
            for (const p of getPlataformas()) {
                ctx.fillStyle = 'rgba(60,70,90,0.6)';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10 * s;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(100,120,150,0.3)';
                ctx.fillRect(p.x + 5 * s, p.y + 2 * s, p.w - 10 * s, 3 * s);
            }

            // Elementos
            for (const g of granadasSuelo) {
                if (!g.activo) continue;
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 20 * s;
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(g.x, g.y, g.radio, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(g.x - 3 * s, g.y - 14 * s, 6 * s, 4 * s);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#FFD700';
                ctx.font = `${14*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💣', g.x, g.y);
            }

            for (const c of corazonesSuelo) c.dibujar();
            for (const a of armasSuelo) a.dibujar();
            for (const g of granadas) g.dibujar();
            for (const z of zombis) z.dibujar();
            for (const b of balas) b.dibujar();
            for (const b of balasEnemigas) b.dibujar();
            if (perro && perro.vivo) perro.dibujar();
            dibujarParticulas();
            if (jugador && jugador.vivo) jugador.dibujar();

            // UI
            if (juego.jugando && !juego.gameOver) {
                const mins = Math.floor(juego.tiempo / 60);
                const segs = Math.floor(juego.tiempo % 60);

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                ctx.roundRect(10 * s, 10 * s, 280 * s, 70 * s, 10 * s);
                ctx.fill();

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${18*s}px Arial`;
                ctx.fillText(`💀 ${juego.puntuacion}`, 20 * s, 15 * s);

                ctx.fillStyle = '#00BCD4';
                ctx.font = `${14*s}px Arial`;
                ctx.fillText(`⏱ ${mins}:${segs.toString().padStart(2,'0')}`, 110 * s, 17 * s);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = `${12*s}px Arial`;
                let armaText = `🔫 ${jugador.arma.toUpperCase()}`;
                if (jugador.arma === 'escopeta') armaText += ` (${jugador.balasEscopeta})`;
                else if (jugador.arma === 'metralleta') armaText += ` (${jugador.balasMetralleta}/30)`;
                ctx.fillText(armaText, 20 * s, 42 * s);

                ctx.fillStyle = '#FFD93D';
                ctx.font = `${12*s}px Arial`;
                ctx.fillText(`⭐ Nivel ${mins+1}`, 20 * s, 60 * s);

                ctx.fillStyle = '#FF6B6B';
                ctx.font = `${12*s}px Arial`;
                ctx.fillText(`🧟 ${zombis.length}`, 110 * s, 60 * s);
                ctx.fillText(`💣 ${jugador.granadas}`, 170 * s, 60 * s);

                if (perro && perro.vivo) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = `${12*s}px Arial`;
                    ctx.fillText('🐕 REX', 230 * s, 60 * s);
                }

                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,215,0,0.5)';
                ctx.font = `${12*s}px Arial`;
                ctx.fillText(`🏆 ${juego.record}`, W - 20 * s, 15 * s);

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${10*s}px Arial`;
                ctx.fillText(`❤️ ${20-eliminadosParaCorazon}`, W - 20 * s, 40 * s);
            }

            // Menú
            if (juego.menu) dibujarMenu();

            // Game Over
            if (juego.gameOver) dibujarGameOver();
        }

        function dibujarMenu() {
            const s = S;
            const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 500 * s);
            grad.addColorStop(0, '#1a1a3e');
            grad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = 'rgba(255,0,0,0.3)';
            ctx.shadowBlur = 30 * s;
            ctx.fillStyle = '#FF1744';
            ctx.font = `bold ${45*s}px Arial`;
            ctx.fillText('🧟 ZOMBIE SURVIVOR', W / 2, 60 * s);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `${16*s}px Arial`;
            ctx.fillText('📋 COMANDOS:', W / 2, 120 * s);

            ctx.fillStyle = '#aaa';
            ctx.font = `${13*s}px Arial`;
            ctx.fillText('🎮 WASD / Flechas: Moverse   |   🖱️ Click: Disparar', W / 2, 150 * s);
            ctx.fillText('⬆ / W: Saltar (doble salto)   |   G: Lanzar granada', W / 2, 175 * s);
            ctx.fillText('E / Q: Cambiar arma', W / 2, 200 * s);

            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${20*s}px Arial`;
            ctx.fillText('💀 ¿Estás listo para la invasión zombi?', W / 2, 255 * s);
            ctx.fillStyle = '#FF1744';
            ctx.font = `${16*s}px Arial`;
            ctx.fillText('¡Suerte la vas a necesitar!', W / 2, 285 * s);

            if (juego.record > 0) {
                ctx.fillStyle = '#FFD700';
                ctx.font = `${14*s}px Arial`;
                ctx.fillText(`🏆 Récord: ${juego.record}`, W / 2, 330 * s);
            }

            ctx.fillStyle = '#aaa';
            ctx.font = `${14*s}px Arial`;
            ctx.fillText('🎯 Elige tu personaje:', W / 2, 380 * s);

            const bx = W / 2 - 190 * s;
            const by = 410 * s;
            const bw = 170 * s;
            const bh = 55 * s;

            ctx.shadowColor = 'rgba(0,0,255,0.3)';
            ctx.shadowBlur = 20 * s;

            const gradH = ctx.createLinearGradient(bx, by, bx, by + bh);
            gradH.addColorStop(0, '#4488FF');
            gradH.addColorStop(1, '#0044AA');
            ctx.fillStyle = gradH;
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 12);
            ctx.fill();

            const gradM = ctx.createLinearGradient(bx + bw + 20 * s, by, bx + bw + 20 * s, by + bh);
            gradM.addColorStop(0, '#FF6B9D');
            gradM.addColorStop(1, '#CC3388');
            ctx.fillStyle = gradM;
            ctx.beginPath();
            ctx.roundRect(bx + bw + 20 * s, by, bw, bh, 12);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${18*s}px Arial`;
            ctx.fillText('👨 Hombre', bx + bw / 2, by + bh / 2);
            ctx.fillText('👩 Mujer', bx + bw + 20 * s + bw / 2, by + bh / 2);

            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = `${10*s}px Arial`;
            ctx.fillText('🐕 Perro policía (Rex) aparece a los 2 minutos', W / 2, H - 30 * s);

            // Detectar clic en botones
            if (juego.menu) {
                const handler = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    let x, y;
                    if (e.type === 'touchstart') {
                        const touch = e.touches[0];
                        x = touch.clientX - rect.left;
                        y = touch.clientY - rect.top;
                    } else {
                        x = e.clientX - rect.left;
                        y = e.clientY - rect.top;
                    }
                    if (x > bx && x < bx + bw && y > by && y < by + bh) {
                        juego.menu = false;
                        canvas.removeEventListener('click', handler);
                        canvas.removeEventListener('touchstart', handler);
                        reiniciarJuego('hombre');
                        iniciarMusica();
                    } else if (x > bx + bw + 20 * s && x < bx + 2 * bw + 20 * s && y > by && y < by + bh) {
                        juego.menu = false;
                        canvas.removeEventListener('click', handler);
                        canvas.removeEventListener('touchstart', handler);
                        reiniciarJuego('mujer');
                        iniciarMusica();
                    }
                };
                canvas.addEventListener('click', handler);
                canvas.addEventListener('touchstart', handler);
            }
        }

        function dibujarGameOver() {
            const s = S;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = '#FF1744';
            ctx.font = `bold ${55*s}px Arial`;
            ctx.fillText('💀 GAME OVER', W / 2, 130 * s);

            ctx.fillStyle = '#fff';
            ctx.font = `${30*s}px Arial`;
            ctx.fillText(`Puntuación: ${juego.puntuacion}`, W / 2, 200 * s);

            const esRecord = juego.puntuacion > juego.record;
            if (esRecord) {
                juego.record = juego.puntuacion;
                localStorage.setItem('zombieRecord', String(juego.record));
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${28*s}px Arial`;
                ctx.fillText('🏆 ¡NUEVO RÉCORD!', W / 2, 255 * s);
            } else {
                ctx.fillStyle = '#aaa';
                ctx.font = `${20*s}px Arial`;
                ctx.fillText(`Récord: ${juego.record}`, W / 2, 255 * s);
            }

            ctx.fillStyle = '#aaa';
            ctx.font = `${16*s}px Arial`;
            const mins = Math.floor(juego.tiempo / 60);
            const segs = Math.floor(juego.tiempo % 60);
            ctx.fillText(`⏱ Tiempo: ${mins}:${segs.toString().padStart(2,'0')}`, W / 2, 305 * s);
            ctx.fillText(`🔫 Zombis derrotados: ${juego.puntuacion}`, W / 2, 335 * s);

            const btnX = W / 2 - 110 * s;
            const btnY = 385 * s;
            const btnW = 220 * s;
            const btnH = 50 * s;

            ctx.shadowColor = 'rgba(0,0,255,0.3)';
            ctx.shadowBlur = 20 * s;
            const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
            grad.addColorStop(0, '#2979FF');
            grad.addColorStop(1, '#0D47A1');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 12);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${20*s}px Arial`;
            ctx.fillText('🔄 VOLVER A JUGAR', W / 2, btnY + btnH / 2);

            // Detectar clic en botón
            const handler = () => {
                canvas.removeEventListener('click', handler);
                canvas.removeEventListener('touchstart', handler);
                juego.gameOver = false;
                juego.menu = true;
            };
            canvas.addEventListener('click', handler);
            canvas.addEventListener('touchstart', handler);
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            teclas[key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && jugador) jugador.saltar();
            if (e.key === 'g' && jugador) {
                const g = jugador.lanzarGranada(mouseX, mouseY);
                if (g) granadas.push(g);
            }
            if ((e.key === 'e' || e.key === 'q') && jugador) jugador.cambiarArma();
        });

        document.addEventListener('keyup', (e) => {
            teclas[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mousePresionado = true;
                if (jugador && jugador.vivo && !juego.gameOver && !juego.menu) disparar();
            }
        });

        canvas.addEventListener('mouseup', () => { mousePresionado = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (touch) {
                const rect = canvas.getBoundingClientRect();
                mouseX = touch.clientX - rect.left;
                mouseY = touch.clientY - rect.top;
                mousePresionado = true;
                if (jugador && jugador.vivo && !juego.gameOver && !juego.menu) disparar();
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (touch) {
                const rect = canvas.getBoundingClientRect();
                mouseX = touch.clientX - rect.left;
                mouseY = touch.clientY - rect.top;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            mousePresionado = false;
        }, { passive: false });

        // Disparo continuo
        setInterval(() => {
            if (mousePresionado && jugador && jugador.vivo && !juego.gameOver && !juego.menu) {
                disparar();
            }
        }, 80);

        // ============================================================
        // POLYFILL
        // ============================================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                r = typeof r === 'number' ? r : (r || 0);
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ============================================================
        // BUCLE PRINCIPAL
        // ============================================================
        function loop() {
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        // ============================================================
        // INICIAR
        // ============================================================
        juego.menu = true;
        loop();
    </script>
</body>
</html>
