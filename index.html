<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Survivor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        canvas {
            border: 2px solid #333;
            cursor: crosshair;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ANCHO = 800;
        const ALTO = 600;

        // ==================== COLORES ====================
        const COLORES = {
            NEGRO: '#000000',
            BLANCO: '#FFFFFF',
            ROJO: '#FF0000',
            VERDE: '#00FF00',
            AZUL: '#0066FF',
            AMARILLO: '#FFFF00',
            NARANJA: '#FF8C00',
            ROSA: '#FF6B9D',
            GRIS: '#808080',
            MORADO: '#9B59B6'
        };

        // ==================== ESTADO GLOBAL ====================
        let puntajeMaximo = parseInt(localStorage.getItem('zombiePuntajeMaximo')) || 0;
        let juegoActual = null;
        let enMenu = true;

        // ==================== CLASES ====================
        class Jugador {
            constructor(x, y, genero) {
                this.x = x;
                this.y = y;
                this.radio = 15;
                this.velocidad = 4;
                this.genero = genero;
                this.color = genero === 'hombre' ? COLORES.AZUL : COLORES.ROSA;
                this.arma_actual = 'pistola';
                this.balas_escopeta = 0;
                this.vivo = true;
                this.angulo = 0;
            }

            mover(teclas) {
                let dx = 0,
                    dy = 0;
                if (teclas['ArrowLeft'] || teclas['a']) dx = -this.velocidad;
                if (teclas['ArrowRight'] || teclas['d']) dx = this.velocidad;
                if (teclas['ArrowUp'] || teclas['w']) dy = -this.velocidad;
                if (teclas['ArrowDown'] || teclas['s']) dy = this.velocidad;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.707;
                    dy *= 0.707;
                }

                this.x += dx;
                this.y += dy;
                this.x = Math.max(this.radio, Math.min(ANCHO - this.radio, this.x));
                this.y = Math.max(this.radio, Math.min(ALTO - this.radio, this.y));
            }

            dibujar() {
                // Sombra
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10;

                // Cuerpo
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = COLORES.NEGRO;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;

                // Cara
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio - 4, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD5B8';
                ctx.fill();

                // Ojos
                ctx.fillStyle = COLORES.NEGRO;
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 3, 3, 0, Math.PI * 2);
                ctx.fill();

                // Boca (sonrisa)
                ctx.beginPath();
                ctx.arc(this.x, this.y + 3, 6, 0.1 * Math.PI, 0.9 * Math.PI);
                ctx.strokeStyle = COLORES.NEGRO;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Pelo según género
                if (this.genero === 'hombre') {
                    ctx.fillStyle = COLORES.NEGRO;
                    ctx.fillRect(this.x - 12, this.y - 19, 24, 5);
                } else {
                    ctx.strokeStyle = COLORES.NEGRO;
                    ctx.lineWidth = 2;
                    for (let i = -12; i <= 12; i += 5) {
                        ctx.beginPath();
                        ctx.moveTo(this.x + i, this.y - 15);
                        ctx.lineTo(this.x + i + 4, this.y - 28);
                        ctx.stroke();
                    }
                }
            }
        }

        class Zombi {
            constructor(x, y, nivel_resistencia, velocidad) {
                this.x = x;
                this.y = y;
                this.radio = 14;
                this.vida = nivel_resistencia;
                this.max_vida = nivel_resistencia;
                this.velocidad = velocidad;
                this.colores = [COLORES.VERDE, COLORES.NARANJA, COLORES.ROJO, COLORES.MORADO, '#8B0000'];
                this.color = this.colores[Math.min(nivel_resistencia - 1, 4)];
                this.tiempo_daño = 0;
            }

            mover_hacia(objetivo) {
                const dx = objetivo.x - this.x;
                const dy = objetivo.y - this.y;
                const distancia = Math.sqrt(dx * dx + dy * dy);
                if (distancia > 0) {
                    this.x += (dx / distancia) * this.velocidad;
                    this.y += (dy / distancia) * this.velocidad;
                }
            }

            dibujar() {
                // Sombra
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;

                // Cuerpo
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = COLORES.NEGRO;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;

                // Ojos rojos brillantes
                const grad = ctx.createRadialGradient(this.x - 4, this.y - 2, 0, this.x - 4, this.y - 2, 4);
                grad.addColorStop(0, '#FF4444');
                grad.addColorStop(1, '#990000');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x - 4, this.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();

                // Pupilas
                ctx.fillStyle = COLORES.NEGRO;
                ctx.beginPath();
                ctx.arc(this.x - 3, this.y - 1, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 1, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Barra de vida
                if (this.vida < this.max_vida) {
                    const ancho_barra = this.radio * 2.5;
                    const vida_porcentaje = this.vida / this.max_vida;
                    const y_barra = this.y - this.radio - 12;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(this.x - ancho_barra / 2, y_barra, ancho_barra, 5);
                    ctx.fillStyle = vida_porcentaje > 0.5 ? COLORES.VERDE : COLORES.ROJO;
                    ctx.fillRect(this.x - ancho_barra / 2, y_barra, ancho_barra * vida_porcentaje, 5);
                }

                // Dientes
                ctx.fillStyle = COLORES.BLANCO;
                for (let i = -3; i <= 3; i += 6) {
                    ctx.fillRect(this.x + i - 1, this.y + 5, 3, 4);
                }
            }
        }

        class Bala {
            constructor(x, y, angulo, tipo = 'pistola') {
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.velocidad = tipo === 'pistola' ? 12 : 9;
                this.radio = tipo === 'pistola' ? 4 : 7;
                this.dx = Math.cos(angulo) * this.velocidad;
                this.dy = Math.sin(angulo) * this.velocidad;
                this.dano = tipo === 'pistola' ? 1 : 3;
                this.trail = [];
                this.tiempo_vida = 0;
            }

            mover() {
                this.tiempo_vida++;
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();
                this.x += this.dx;
                this.y += this.dy;
            }

            dibujar() {
                // Estela
                for (let i = 0; i < this.trail.length; i++) {
                    const alpha = i / this.trail.length * 0.5;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, this.radio * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = this.tipo === 'pistola' ?
                        `rgba(255, 255, 0, ${alpha})` :
                        `rgba(255, 165, 0, ${alpha})`;
                    ctx.fill();
                }

                // Bala principal
                const grad = ctx.createRadialGradient(
                    this.x - 2, this.y - 2, 0,
                    this.x, this.y, this.radio
                );
                if (this.tipo === 'pistola') {
                    grad.addColorStop(0, '#FFFF88');
                    grad.addColorStop(1, '#CCAA00');
                } else {
                    grad.addColorStop(0, '#FFAA44');
                    grad.addColorStop(1, '#CC6600');
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Brillo
                ctx.beginPath();
                ctx.arc(this.x - 1, this.y - 2, this.radio * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }
        }

        class ArmaEnSuelo {
            constructor(x, y, tipo) {
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.radio = 12;
                this.activo = true;
                this.tiempo = 0;
                this.flotando = 0;
            }

            dibujar() {
                if (!this.activo) return;
                this.tiempo++;
                this.flotando = Math.sin(this.tiempo * 0.05) * 3;

                // Efecto de brillo
                ctx.shadowColor = 'rgba(255, 165, 0, 0.5)';
                ctx.shadowBlur = 20;

                // Círculo base
                const grad = ctx.createRadialGradient(
                    this.x, this.y + this.flotando, 0,
                    this.x, this.y + this.flotando, this.radio
                );
                grad.addColorStop(0, '#FFAA44');
                grad.addColorStop(1, '#CC6600');
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.flotando, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = COLORES.BLANCO;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;

                // Texto "E"
                ctx.fillStyle = COLORES.BLANCO;
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', this.x, this.y + this.flotando + 1);

                // Texto "Escopeta"
                ctx.fillStyle = COLORES.BLANCO;
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('ESCOPETA', this.x, this.y + this.flotando + this.radio + 3);
            }
        }

        // ==================== CLASE PRINCIPAL DEL JUEGO ====================
        class Juego {
            constructor(genero) {
                this.jugador = new Jugador(ANCHO / 2, ALTO / 2, genero);
                this.zombis = [];
                this.balas = [];
                this.armas_suelo = [];
                this.puntuacion = 0;
                this.tiempo_inicio = Date.now();
                this.ultimo_spawn = 0;
                this.juego_terminado = false;
                this.velocidad_base = 1.8;
                this.zombis_por_spawn = 1;
                this.tiempo_entre_spawn = 1200;
                this.ultimo_disparo = 0;
                this.tiempo_entre_disparos = 150;
                this.teclas = {};
                this.mouseX = ANCHO / 2;
                this.mouseY = ALTO / 2;
                this.particulas = [];
                this.spawn_contador = 0;
                this.arma_spawn_timer = 0;

                this.setupEventListeners();
                this.buclePrincipal();
            }

            setupEventListeners() {
                const keyHandler = (e) => {
                    const key = e.key.toLowerCase();
                    this.teclas[key] = e.type === 'keydown';
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                        e.preventDefault();
                    }
                };

                document.addEventListener('keydown', keyHandler);
                document.addEventListener('keyup', keyHandler);

                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    this.mouseX = (e.clientX - rect.left) * scaleX;
                    this.mouseY = (e.clientY - rect.top) * scaleY;
                });

                canvas.addEventListener('click', () => {
                    if (this.jugador.vivo && !this.juego_terminado) {
                        this.disparar();
                    }
                });

                // Prevenir click derecho
                canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            disparar() {
                const tiempo_actual = Date.now();
                if (tiempo_actual - this.ultimo_disparo < this.tiempo_entre_disparos) return;

                const dx = this.mouseX - this.jugador.x;
                const dy = this.mouseY - this.jugador.y;
                const angulo = Math.atan2(dy, dx);

                if (this.jugador.arma_actual === 'pistola') {
                    this.balas.push(new Bala(this.jugador.x, this.jugador.y, angulo, 'pistola'));
                    this.ultimo_disparo = tiempo_actual;
                } else if (this.jugador.arma_actual === 'escopeta' && this.jugador.balas_escopeta > 0) {
                    for (let i = -2; i <= 2; i++) {
                        const angulo_escopeta = angulo + (i * 0.12);
                        this.balas.push(new Bala(this.jugador.x, this.jugador.y, angulo_escopeta, 'escopeta'));
                    }
                    this.jugador.balas_escopeta--;
                    if (this.jugador.balas_escopeta === 0) {
                        this.jugador.arma_actual = 'pistola';
                    }
                    this.ultimo_disparo = tiempo_actual;
                }
            }

            spawnZombi(minutos) {
                const nivel_resistencia = Math.min(minutos + 1, 5);
                const lado = Math.floor(Math.random() * 4);
                let x, y;
                const margen = 30;
                if (lado === 0) { x = Math.random() * ANCHO;
                    y = -margen; } else if (lado === 1) { x = Math.random() * ANCHO;
                    y = ALTO + margen; } else if (lado === 2) { x = -margen;
                    y = Math.random() * ALTO; } else { x = ANCHO + margen;
                    y = Math.random() * ALTO; }

                // Evitar spawn cerca del jugador
                const dist = Math.sqrt((x - this.jugador.x) ** 2 + (y - this.jugador.y) ** 2);
                if (dist < 200) {
                    x = Math.random() * ANCHO;
                    y = Math.random() * ALTO;
                }

                let velocidad = this.velocidad_base;
                if (minutos >= 3) {
                    velocidad = this.velocidad_base + (Math.random() - 0.3) * 2.5;
                    velocidad = Math.max(0.8, velocidad);
                }

                this.zombis.push(new Zombi(x, y, nivel_resistencia, velocidad));
            }

            actualizar() {
                if (!this.jugador.vivo || this.juego_terminado) return;

                const tiempo_actual = Date.now();
                const minutos = Math.floor((tiempo_actual - this.tiempo_inicio) / 60000);

                // Mover jugador
                this.jugador.mover(this.teclas);

                // Actualizar balas
                for (let i = this.balas.length - 1; i >= 0; i--) {
                    const bala = this.balas[i];
                    bala.mover();
                    if (bala.x < -20 || bala.x > ANCHO + 20 || bala.y < -20 || bala.y > ALTO + 20) {
                        this.balas.splice(i, 1);
                    }
                }

                // Actualizar zombis y colisiones
                for (let i = this.zombis.length - 1; i >= 0; i--) {
                    const zombi = this.zombis[i];
                    zombi.mover_hacia(this.jugador);

                    // Colisión con jugador
                    const distancia = Math.sqrt(
                        (zombi.x - this.jugador.x) ** 2 +
                        (zombi.y - this.jugador.y) ** 2
                    );
                    if (distancia < this.jugador.radio + zombi.radio) {
                        this.jugador.vivo = false;
                        this.juego_terminado = true;
                        return;
                    }

                    // Colisión con balas
                    for (let j = this.balas.length - 1; j >= 0; j--) {
                        const bala = this.balas[j];
                        const distBala = Math.sqrt(
                            (bala.x - zombi.x) ** 2 +
                            (bala.y - zombi.y) ** 2
                        );
                        if (distBala < bala.radio + zombi.radio) {
                            zombi.vida -= bala.dano;
                            // Efecto de partículas
                            this.crearParticulas(zombi.x, zombi.y, '#FF4444', 8);
                            this.balas.splice(j, 1);

                            if (zombi.vida <= 0) {
                                this.zombis.splice(i, 1);
                                this.puntuacion++;

                                // Probabilidad de soltar arma
                                if (Math.random() < 0.12) {
                                    this.armas_suelo.push(new ArmaEnSuelo(zombi.x, zombi.y, 'escopeta'));
                                }
                            }
                            break;
                        }
                    }
                }

                // Actualizar armas en suelo
                for (let i = this.armas_suelo.length - 1; i >= 0; i--) {
                    const arma = this.armas_suelo[i];
                    if (arma.activo) {
                        const distancia = Math.sqrt(
                            (arma.x - this.jugador.x) ** 2 +
                            (arma.y - this.jugador.y) ** 2
                        );
                        if (distancia < this.jugador.radio + arma.radio) {
                            this.jugador.arma_actual = 'escopeta';
                            this.jugador.balas_escopeta = 5;
                            arma.activo = false;
                            this.armas_suelo.splice(i, 1);
                            this.crearParticulas(arma.x, arma.y, '#FFAA44', 15);
                        }
                    }
                }

                // Spawn de zombis
                const spawnRate = Math.max(300, 1200 - (minutos * 40));
                if (tiempo_actual - this.ultimo_spawn > spawnRate) {
                    this.zombis_por_spawn = 1 + Math.floor(minutos * 0.5);
                    const cantidad = Math.min(this.zombis_por_spawn, 12);

                    for (let i = 0; i < cantidad; i++) {
                        this.spawnZombi(minutos);
                    }
                    this.ultimo_spawn = tiempo_actual;
                }
            }

            crearParticulas(x, y, color, cantidad) {
                for (let i = 0; i < cantidad; i++) {
                    const angulo = Math.random() * Math.PI * 2;
                    const velocidad = 1 + Math.random() * 3;
                    this.particulas.push({
                        x: x,
                        y: y,
                        dx: Math.cos(angulo) * velocidad,
                        dy: Math.sin(angulo) * velocidad,
                        vida: 30 + Math.random() * 20,
                        vida_max: 50,
                        radio: 2 + Math.random() * 3,
                        color: color
                    });
                }
            }

            actualizarParticulas() {
                for (let i = this.particulas.length - 1; i >= 0; i--) {
                    const p = this.particulas[i];
                    p.x += p.dx;
                    p.y += p.dy;
                    p.dy += 0.05;
                    p.vida--;
                    if (p.vida <= 0) {
                        this.particulas.splice(i, 1);
                    }
                }
            }

            dibujarParticulas() {
                for (const p of this.particulas) {
                    const alpha = p.vida / p.vida_max;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radio * alpha, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            dibujar() {
                ctx.clearRect(0, 0, ANCHO, ALTO);

                // Fondo con efecto de niebla
                const grad = ctx.createRadialGradient(
                    this.jugador.x, this.jugador.y, 50,
                    this.jugador.x, this.jugador.y, 500
                );
                grad.addColorStop(0, '#1a1a2e');
                grad.addColorStop(1, '#0a0a0a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, ANCHO, ALTO);

                // Dibujar elementos
                for (const arma of this.armas_suelo) {
                    arma.dibujar();
                }

                for (const zombi of this.zombis) {
                    zombi.dibujar();
                }

                for (const bala of this.balas) {
                    bala.dibujar();
                }

                this.jugador.dibujar();
                this.dibujarParticulas();

                // UI
                this.dibujarUI();
            }

            dibujarUI() {
                const tiempo_actual = Date.now();
                const minutos = Math.floor((tiempo_actual - this.tiempo_inicio) / 60000);
                const segundos = Math.floor((tiempo_actual - this.tiempo_inicio) / 1000) % 60;

                // Panel de información
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.roundRect(5, 5, 200, 125, 8);
                ctx.fill();

                ctx.fillStyle = COLORES.BLANCO;
                ctx.font = '18px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                ctx.fillStyle = '#FFD700';
                ctx.fillText(`💀 Zombis: ${this.puntuacion}`, 15, 10);

                ctx.fillStyle = '#00CCFF';
                ctx.fillText(`⏱ ${minutos}:${segundos.toString().padStart(2, '0')}`, 15, 40);

                ctx.fillStyle = '#FF6B6B';
                let arma_texto = `🔫 ${this.jugador.arma_actual.toUpperCase()}`;
                if (this.jugador.arma_actual === 'escopeta') {
                    arma_texto += ` (${this.jugador.balas_escopeta})`;
                }
                ctx.fillText(arma_texto, 15, 70);

                const nivel = Math.min(Math.floor((tiempo_actual - this.tiempo_inicio) / 60000) + 1, 5);
                ctx.fillStyle = '#FFD93D';
                ctx.fillText(`⭐ Nivel: ${nivel}`, 15, 100);
            }

            buclePrincipal() {
                if (!this.juego_terminado) {
                    this.actualizar();
                    this.actualizarParticulas();
                    this.dibujar();
                    requestAnimationFrame(() => this.buclePrincipal());
                } else {
                    this.mostrarGameOver();
                }
            }

            mostrarGameOver() {
                const esRecord = this.puntuacion > puntajeMaximo;
                if (esRecord) {
                    puntajeMaximo = this.puntuacion;
                    localStorage.setItem('zombiePuntajeMaximo', String(puntajeMaximo));
                }

                let esperando = true;

                const drawGameOver = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    // Título
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Efecto de sangre
                    for (let i = 0; i < 20; i++) {
                        ctx.fillStyle = `rgba(139, 0, 0, ${0.1 + Math.random() * 0.1})`;
                        ctx.beginPath();
                        ctx.arc(
                            Math.random() * ANCHO,
                            Math.random() * ALTO,
                            10 + Math.random() * 30,
                            0, Math.PI * 2
                        );
                        ctx.fill();
                    }

                    ctx.fillStyle = ROJO;
                    ctx.font = 'bold 60px Arial';
                    ctx.fillText('💀 GAME OVER', ANCHO / 2, 150);

                    ctx.fillStyle = BLANCO;
                    ctx.font = '40px Arial';
                    ctx.fillText(`Puntuación: ${this.puntuacion}`, ANCHO / 2, 240);

                    if (esRecord) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = 'bold 36px Arial';
                        ctx.fillText('🏆 ¡NUEVO RÉCORD!', ANCHO / 2, 310);
                    } else {
                        ctx.fillStyle = COLORES.GRIS;
                        ctx.font = '28px Arial';
                        ctx.fillText(`Récord: ${puntajeMaximo}`, ANCHO / 2, 310);
                    }

                    // Botón de reinicio
                    const btnX = ANCHO / 2 - 100;
                    const btnY = 400;
                    const btnW = 200;
                    const btnH = 50;

                    // Sombra del botón
                    ctx.shadowColor = 'rgba(0,0,255,0.3)';
                    ctx.shadowBlur = 20;

                    const grad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
                    grad.addColorStop(0, '#0066FF');
                    grad.addColorStop(1, '#0044AA');
                    ctx.fillStyle = grad;
                    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    ctx.fillStyle = BLANCO;
                    ctx.font = '24px Arial';
                    ctx.fillText('🔄 Volver a jugar', ANCHO / 2, btnY + btnH / 2);

                    if (esperando) {
                        const handler = (e) => {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = canvas.width / rect.width;
                            const scaleY = canvas.height / rect.height;
                            const x = (e.clientX - rect.left) * scaleX;
                            const y = (e.clientY - rect.top) * scaleY;

                            if (x > btnX && x < btnX + btnW &&
                                y > btnY && y < btnY + btnH) {
                                esperando = false;
                                canvas.removeEventListener('click', handler);
                                this.mostrarMenu();
                            }
                        };
                        canvas.addEventListener('click', handler);

                        // También permitir presionar Enter
                        const keyHandler = (e) => {
                            if (e.key === 'Enter') {
                                esperando = false;
                                canvas.removeEventListener('keydown', keyHandler);
                                this.mostrarMenu();
                            }
                        };
                        document.addEventListener('keydown', keyHandler);
                    }

                    ctx.shadowBlur = 0;
                };

                drawGameOver();
            }

            mostrarMenu() {
                enMenu = true;
                let generoSeleccionado = null;

                const drawMenu = () => {
                    ctx.clearRect(0, 0, ANCHO, ALTO);

                    // Fondo con efecto
                    const grad = ctx.createRadialGradient(ANCHO / 2, ALTO / 2, 0, ANCHO / 2, ALTO / 2, 400);
                    grad.addColorStop(0, '#1a1a3e');
                    grad.addColorStop(1, '#0a0a0a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, ANCHO, ALTO);

                    // Título con sombra
                    ctx.shadowColor = 'rgba(255,0,0,0.3)';
                    ctx.shadowBlur = 30;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.fillStyle = ROJO;
                    ctx.font = 'bold 65px Arial';
                    ctx.fillText('🧟 ZOMBIE SURVIVOR', ANCHO / 2, 100);

                    ctx.shadowBlur = 0;

                    // Subtítulo
                    ctx.fillStyle = COLORES.GRIS;
                    ctx.font = '20px Arial';
                    ctx.fillText('Selecciona tu personaje', ANCHO / 2, 170);

                    // Botones
                    const btnHombre = { x: ANCHO / 2 - 170, y: 240, w: 150, h: 60 };
                    const btnMujer = { x: ANCHO / 2 + 20, y: 240, w: 150, h: 60 };

                    // Botón Hombre
                    ctx.shadowColor = 'rgba(0,0,255,0.3)';
                    ctx.shadowBlur = 15;
                    const gradH = ctx.createLinearGradient(btnHombre.x, btnHombre.y, btnHombre.x, btnHombre.y + btnHombre.h);
                    gradH.addColorStop(0, '#4488FF');
                    gradH.addColorStop(1, '#0044AA');
                    ctx.fillStyle = gradH;
                    ctx.roundRect(btnHombre.x, btnHombre.y, btnHombre.w, btnHombre.h, 12);
                    ctx.fill();

                    // Botón Mujer
                    const gradM = ctx.createLinearGradient(btnMujer.x, btnMujer.y, btnMujer.x, btnMujer.y + btnMujer.h);
                    gradM.addColorStop(0, '#FF6B9D');
                    gradM.addColorStop(1, '#CC3388');
                    ctx.fillStyle = gradM;
                    ctx.roundRect(btnMujer.x, btnMujer.y, btnMujer.w, btnMujer.h, 12);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    // Texto de los botones
                    ctx.fillStyle = BLANCO;
                    ctx.font = 'bold 28px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Iconos
                    ctx.fillText('👨 Hombre', btnHombre.x + btnHombre.w / 2, btnHombre.y + btnHombre.h / 2);
                    ctx.fillText('👩 Mujer', btnMujer.x + btnMujer.w / 2, btnMujer.y + btnMujer.h / 2);

                    // Récord
                    if (puntajeMaximo > 0) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = '22px Arial';
                        ctx.fillText(`🏆 Récord: ${puntajeMaximo}`, ANCHO / 2, 360);
                    }

                    // Instrucciones
                    ctx.fillStyle = COLORES.GRIS;
                    ctx.font = '16px Arial';
                    ctx.fillText('🎮 WASD o Flechas: Moverse | Click: Disparar', ANCHO / 2, 420);

                    // Créditos
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '12px Arial';
                    ctx.fillText('v1.0 - Hecho con ❤️', ANCHO / 2, 580);

                    if (enMenu) {
                        const handler = (e) => {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = canvas.width / rect.width;
                            const scaleY = canvas.height / rect.height;
                            const x = (e.clientX - rect.left) * scaleX;
                            const y = (e.clientY - rect.top) * scaleY;

                            if (x > btnHombre.x && x < btnHombre.x + btnHombre.w &&
                                y > btnHombre.y && y < btnHombre.y + btnHombre.h) {
                                enMenu = false;
                                canvas.removeEventListener('click', handler);
                                juegoActual = new Juego('hombre');
                            } else if (x > btnMujer.x && x < btnMujer.x + btnMujer.w &&
                                y > btnMujer.y && y < btnMujer.y + btnMujer.h) {
                                enMenu = false;
                                canvas.removeEventListener('click', handler);
                                juegoActual = new Juego('mujer');
                            }
                        };
                        canvas.addEventListener('click', handler);
                    }
                };

                drawMenu();
            }
        }

        // ==================== POLYFILL ROUNDRECT ====================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                this.closePath();
                return this;
            };
        }

        // ==================== INICIAR JUEGO ====================
        // Mostrar el menú directamente
        const juegoInicial = new Juego();
        juegoInicial.mostrarMenu();
    </script>
</body>
</html>
