<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zombie Survivor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #gameContainer {
            position: relative;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #1a1a2e;
            touch-action: none;
            width: 100% !important;
            height: 100% !important;
        }
        
        #mobileControls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 15;
            pointer-events: none;
            height: 200px;
            align-items: flex-end;
        }
        
        #joystickZone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            touch-action: none;
            pointer-events: all;
            z-index: 20;
            display: none;
        }
        #joystickKnob {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            border: 2px solid rgba(255,255,255,0.25);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        #actionButtons {
            position: absolute;
            bottom: 20px;
            right: 15px;
            display: none;
            gap: 10px;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        #actionButtons .btn-row {
            display: flex;
            gap: 10px;
            pointer-events: none;
        }
        #actionButtons button {
            pointer-events: all;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            min-width: 50px;
            min-height: 50px;
        }
        #actionButtons button:active {
            background: rgba(255,255,255,0.35);
            transform: scale(0.9);
        }
        #actionButtons .btn-shoot {
            background: rgba(255,50,50,0.3);
            border-color: rgba(255,50,50,0.5);
            width: 70px;
            height: 70px;
            font-size: 1.6rem;
        }
        #actionButtons .btn-grenade {
            background: rgba(255,200,50,0.25);
            border-color: rgba(255,200,50,0.4);
        }
        #actionButtons .btn-jump {
            background: rgba(50,200,50,0.25);
            border-color: rgba(50,200,50,0.4);
        }
        #actionButtons .btn-switch {
            background: rgba(50,150,255,0.25);
            border-color: rgba(50,150,255,0.4);
            font-size: 0.9rem;
        }
        
        #musicToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            pointer-events: all;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: none;
        }

        @media (max-width: 768px) {
            #mobileControls { display: flex !important; }
            #joystickZone { display: block !important; }
            #actionButtons { display: flex !important; }
            #musicToggle { display: block !important; font-size: 12px; padding: 4px 8px; top: 5px; right: 5px; }
            #actionButtons button { width: 50px; height: 50px; font-size: 1rem; }
            #actionButtons .btn-shoot { width: 60px; height: 60px; font-size: 1.4rem; }
            #joystickZone { width: 110px; height: 110px; bottom: 15px; left: 15px; }
            #joystickKnob { width: 45px; height: 45px; }
        }
        @media (max-width: 480px) {
            #actionButtons button { width: 42px; height: 42px; font-size: 0.8rem; min-width: 35px; min-height: 35px; }
            #actionButtons .btn-shoot { width: 52px; height: 52px; font-size: 1.2rem; }
            #joystickZone { width: 90px; height: 90px; bottom: 10px; left: 10px; }
            #joystickKnob { width: 38px; height: 38px; }
            #actionButtons { bottom: 10px; right: 8px; gap: 6px; }
            #actionButtons .btn-row { gap: 6px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <button id="musicToggle">🔊 Música</button>
        
        <div id="joystickZone">
            <div id="joystickKnob"></div>
        </div>
        
        <div id="actionButtons">
            <div class="btn-row">
                <button class="btn-jump" id="btnJump">⬆</button>
                <button class="btn-grenade" id="btnGrenade">💣</button>
                <button class="btn-switch" id="btnSwitch">🔄</button>
            </div>
            <button class="btn-shoot" id="btnShoot">🔫</button>
        </div>
    </div>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let ANCHO, ALTO, ESCALA;
        
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            ANCHO = container.clientWidth;
            ALTO = container.clientHeight;
            canvas.width = ANCHO;
            canvas.height = ALTO;
            ESCALA = Math.min(ANCHO / 900, ALTO / 600);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==================== PLATAFORMAS ====================
        function getPlataformas() {
            const e = ESCALA;
            return [
                { x: 80*e, y: 460*e, w: 160*e, h: 12*e },
                { x: 350*e, y: 460*e, w: 160*e, h: 12*e },
                { x: 620*e, y: 460*e, w: 160*e, h: 12*e },
                { x: 200*e, y: 350*e, w: 140*e, h: 12*e },
                { x: 500*e, y: 350*e, w: 140*e, h: 12*e },
                { x: 80*e, y: 240*e, w: 120*e, h: 12*e },
                { x: 380*e, y: 240*e, w: 120*e, h: 12*e },
                { x: 680*e, y: 240*e, w: 120*e, h: 12*e }
            ];
        }

        // ==================== COLORES ====================
        const C = {
            NEGRO: '#000000',
            BLANCO: '#FFFFFF',
            ROJO: '#FF1744',
            VERDE: '#00E676',
            AZUL: '#2979FF',
            AMARILLO: '#FFEA00',
            NARANJA: '#FF9100',
            ROSA: '#FF4081',
            GRIS: '#78909C',
            MORADO: '#7C4DFF',
            PIEL: '#FFCCBC'
        };

        // ==================== ESTADO GLOBAL ====================
        let puntajeMaximo = parseInt(localStorage.getItem('zombiePuntajeMaximo')) || 0;
        let juegoActual = null;
        let enMenu = true;
        let esMovil = window.innerWidth <= 768;
        let musicaActiva = true;
        let audioCtx = null;
        let musicaInterval = null;
        let joystickX = 0;
        let joystickY = 0;
        let mouseX = 0;
        let mouseY = 0;

        // ==================== MUSICA ====================
        function iniciarMusica() {
            if (!musicaActiva) return;
            try {
                if (audioCtx) {
                    try { audioCtx.close(); } catch(e) {}
                }
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                function tocarNota(frec, duracion, volumen = 0.06) {
                    if (!audioCtx || !musicaActiva) return;
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.value = frec;
                        gain.gain.value = volumen;
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracion);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + duracion);
                    } catch(e) {}
                }

                if (musicaInterval) clearInterval(musicaInterval);
                musicaInterval = setInterval(() => {
                    if (!musicaActiva || !juegoActual || juegoActual.juegoTerminado) return;
                    const notas = [180, 220, 260, 300, 340, 380, 420];
                    const nota = notas[Math.floor(Math.random() * notas.length)];
                    const duracion = 0.15 + Math.random() * 0.25;
                    const vol = 0.03 + Math.random() * 0.05;
                    tocarNota(nota, duracion, vol);
                    
                    if (Math.random() > 0.5) {
                        setTimeout(() => {
                            tocarNota(nota * 1.25, duracion * 0.5, vol * 0.6);
                        }, 80 + Math.random() * 120);
                    }
                }, 500 + Math.random() * 300);
            } catch(e) {}
        }

        function detenerMusica() {
            if (musicaInterval) {
                clearInterval(musicaInterval);
                musicaInterval = null;
            }
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
                audioCtx = null;
            }
        }

        function toggleMusica() {
            musicaActiva = !musicaActiva;
            document.getElementById('musicToggle').textContent = musicaActiva ? '🔊 Música' : '🔇 Música';
            if (musicaActiva) iniciarMusica();
            else detenerMusica();
        }
        document.getElementById('musicToggle').addEventListener('click', toggleMusica);

        // ==================== UTILIDADES ====================
        function distancia(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function aleatorio(min, max) {
            return Math.random() * (max - min) + min;
        }

        // ==================== PARTÍCULAS ====================
        let particulas = [];

        function crearParticulas(x, y, color, cantidad = 10, velocidad = 3) {
            const e = ESCALA;
            for (let i = 0; i < cantidad; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const vel = (1 + Math.random() * velocidad) * e;
                particulas.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angulo) * vel,
                    dy: Math.sin(angulo) * vel - 1*e,
                    vida: 20 + Math.random() * 20,
                    vidaMax: 40,
                    radio: (2 + Math.random() * 4) * e,
                    color: color
                });
            }
        }

        function actualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.1 * ESCALA;
                p.vida--;
                if (p.vida <= 0) {
                    particulas.splice(i, 1);
                }
            }
        }

        function dibujarParticulas() {
            for (const p of particulas) {
                const alpha = p.vida / p.vidaMax;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radio * alpha, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // ==================== CLASES ====================
        class Personaje {
            constructor(x, y, genero) {
                const e = ESCALA;
                this.x = x;
                this.y = y;
                this.ancho = 30*e;
                this.alto = 50*e;
                this.velX = 0;
                this.velY = 0;
                this.velocidad = 4.5 * e;
                this.fuerzaSalto = -11 * e;
                this.genero = genero;
                this.vivo = true;
                this.enSuelo = false;
                this.saltosRestantes = 2;
                this.mirandoDerecha = true;
                this.arma_actual = 'pistola';
                this.balas_escopeta = 0;
                this.balas_metralleta = 30;
                this.max_metralleta = 30;
                this.animacionFrame = 0;
                this.tiempoAnimacion = 0;
                this.anguloArma = 0;
                this.corazones = 3;
                this.maxCorazones = 3;
                this.invulnerable = 0;
                this.granadas = 3;
                this.maxGranadas = 3;
                this.tiempoRecarga = 0;
                this.recargando = false;
            }

            get centroX() { return this.x + this.ancho / 2; }
            get centroY() { return this.y + this.alto / 2; }

            saltar() {
                if (this.saltosRestantes > 0) {
                    this.velY = this.fuerzaSalto;
                    this.saltosRestantes--;
                    this.enSuelo = false;
                    crearParticulas(this.centroX, this.y + this.alto, C.BLANCO, 8, 2);
                }
            }

            mover(teclas, mx, my) {
                const e = ESCALA;
                const plataformas = getPlataformas();
                let dx = 0;
                
                if (teclas['ArrowLeft'] || teclas['a'] || joystickX < -0.3) dx = -this.velocidad;
                if (teclas['ArrowRight'] || teclas['d'] || joystickX > 0.3) dx = this.velocidad;
                
                const anguloMouse = Math.atan2(my - this.centroY, mx - this.centroX);
                this.anguloArma = anguloMouse;
                if (Math.abs(anguloMouse) < Math.PI / 2) {
                    this.mirandoDerecha = true;
                } else {
                    this.mirandoDerecha = false;
                }

                this.velX = dx;
                this.x += this.velX;

                this.velY += 0.5 * e;
                if (this.velY > 12*e) this.velY = 12*e;
                this.y += this.velY;

                this.enSuelo = false;
                for (const p of plataformas) {
                    if (this.velY >= 0 &&
                        this.x + this.ancho > p.x + 5 && this.x < p.x + p.w - 5 &&
                        this.y + this.alto > p.y && this.y + this.alto < p.y + p.h + 15) {
                        this.y = p.y - this.alto;
                        this.velY = 0;
                        this.enSuelo = true;
                        this.saltosRestantes = 2;
                    }
                }

                if (this.y + this.alto >= ALTO - 50*e) {
                    this.y = ALTO - 50*e - this.alto;
                    this.velY = 0;
                    this.enSuelo = true;
                    this.saltosRestantes = 2;
                }

                this.x = Math.max(0, Math.min(ANCHO - this.ancho, this.x));

                if (Math.abs(this.velX) > 0.5*e) {
                    this.tiempoAnimacion += 0.15;
                    if (this.tiempoAnimacion > 1) {
                        this.tiempoAnimacion = 0;
                        this.animacionFrame = (this.animacionFrame + 1) % 4;
                    }
                } else {
                    this.animacionFrame = 0;
                    this.tiempoAnimacion = 0;
                }

                if (this.invulnerable > 0) this.invulnerable--;
                
                if (this.recargando) {
                    this.tiempoRecarga++;
                    if (this.tiempoRecarga > 60) {
                        this.balas_metralleta = this.max_metralleta;
                        this.recargando = false;
                        this.tiempoRecarga = 0;
                    }
                }
            }

            disparar(mx, my) {
                if (this.arma_actual === 'pistola') {
                    const angulo = Math.atan2(my - this.centroY, mx - this.centroX);
                    const e = ESCALA;
                    const bala = new Bala(this.centroX + Math.cos(angulo) * 20*e, 
                                         this.centroY + Math.sin(angulo) * 20*e - 5*e, 
                                         angulo, 'pistola');
                    return bala;
                } else if (this.arma_actual === 'escopeta' && this.balas_escopeta > 0) {
                    const angulo = Math.atan2(my - this.centroY, mx - this.centroX);
                    const e = ESCALA;
                    const balas = [];
                    for (let i = -3; i <= 3; i++) {
                        const anguloEscopeta = angulo + (i * 0.08);
                        balas.push(new Bala(this.centroX + Math.cos(angulo) * 20*e,
                                           this.centroY + Math.sin(angulo) * 20*e - 5*e,
                                           anguloEscopeta, 'escopeta'));
                    }
                    this.balas_escopeta--;
                    if (this.balas_escopeta === 0) {
                        this.arma_actual = 'pistola';
                    }
                    return balas;
                } else if (this.arma_actual === 'metralleta' && this.balas_metralleta > 0) {
                    const angulo = Math.atan2(my - this.centroY, mx - this.centroX);
                    const e = ESCALA;
                    this.balas_metralleta--;
                    if (this.balas_metralleta === 0) {
                        this.recargando = true;
                        this.tiempoRecarga = 0;
                    }
                    return [new Bala(this.centroX + Math.cos(angulo) * 20*e,
                                   this.centroY + Math.sin(angulo) * 20*e - 5*e,
                                   angulo, 'metralleta')];
                }
                return null;
            }

            lanzarGranada(mx, my) {
                if (this.granadas <= 0) return null;
                const angulo = Math.atan2(my - this.centroY, mx - this.centroX);
                this.granadas--;
                return new Granada(this.centroX, this.centroY, angulo);
            }

            cambiarArma() {
                const armas = ['pistola', 'escopeta', 'metralleta'];
                const idx = armas.indexOf(this.arma_actual);
                let nuevaIdx = (idx + 1) % armas.length;
                let intentos = 0;
                while ((armas[nuevaIdx] === 'escopeta' && this.balas_escopeta === 0) ||
                       (armas[nuevaIdx] === 'metralleta' && this.balas_metralleta === 0)) {
                    nuevaIdx = (nuevaIdx + 1) % armas.length;
                    intentos++;
                    if (intentos > 3) break;
                }
                this.arma_actual = armas[nuevaIdx];
                this.recargando = false;
                this.tiempoRecarga = 0;
            }

            recibirDaño(daño) {
                if (this.invulnerable > 0) return false;
                this.corazones -= daño;
                this.invulnerable = 60;
                crearParticulas(this.centroX, this.centroY, C.ROJO, 20, 5);
                if (this.corazones <= 0) {
                    this.corazones = 0;
                    this.vivo = false;
                }
                return true;
            }

            dibujar() {
                const e = ESCALA;
                ctx.save();
                
                if (this.invulnerable > 0 && Math.floor(this.invulnerable / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                const x = this.x;
                const y = this.y;
                const dir = this.mirandoDerecha ? 1 : -1;

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 15*e;
                ctx.shadowOffsetY = 5*e;

                if (this.genero === 'hombre') {
                    const grad = ctx.createLinearGradient(x, y, x + this.ancho, y);
                    grad.addColorStop(0, '#1a237e');
                    grad.addColorStop(0.5, '#283593');
                    grad.addColorStop(1, '#1a237e');
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 10*e;
                    ctx.beginPath();
                    ctx.roundRect(x + 3*e, y + 12*e, 24*e, 24*e, 3*e);
                    ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.arc(x + 10*e, y + 18*e, 5*e, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 20*e, y + 18*e, 5*e, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#4a2c0a';
                    ctx.fillRect(x + 3*e, y + 32*e, 24*e, 4*e);
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(x + 12*e, y + 32*e, 6*e, 4*e);
                    
                    ctx.fillStyle = '#1a237e';
                    ctx.fillRect(x, y + 14*e, 5*e, 8*e);
                    ctx.fillRect(x + 25*e, y + 14*e, 5*e, 8*e);
                } else {
                    const grad = ctx.createLinearGradient(x, y, x + this.ancho, y);
                    grad.addColorStop(0, '#4a148c');
                    grad.addColorStop(0.5, '#7b1fa2');
                    grad.addColorStop(1, '#4a148c');
                    ctx.fillStyle = grad;
                    ctx.shadowBlur = 10*e;
                    
                    ctx.beginPath();
                    ctx.roundRect(x + 5*e, y + 12*e, 20*e, 20*e, 4*e);
                    ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.arc(x + 11*e, y + 18*e, 4*e, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 19*e, y + 18*e, 4*e, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#6a1b9a';
                    ctx.beginPath();
                    ctx.moveTo(x + 4*e, y + 32*e);
                    ctx.quadraticCurveTo(x + 15*e, y + 38*e, x + 26*e, y + 32*e);
                    ctx.lineTo(x + 28*e, y + 42*e);
                    ctx.quadraticCurveTo(x + 15*e, y + 46*e, x + 2*e, y + 42*e);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.fillStyle = '#4a148c';
                    ctx.fillRect(x + 8*e, y + 28*e, 14*e, 3*e);
                    
                    ctx.fillStyle = '#4a148c';
                    ctx.fillRect(x + 2*e, y + 14*e, 4*e, 6*e);
                    ctx.fillRect(x + 24*e, y + 14*e, 4*e, 6*e);
                }

                ctx.shadowBlur = 0;

                ctx.fillStyle = C.PIEL;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2, y + 9*e, 12*e, 0, Math.PI * 2);
                ctx.fill();

                if (this.genero === 'hombre') {
                    ctx.fillStyle = '#2c1810';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2, y + 4*e, 13*e, -Math.PI, 0);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 8*e, y + 6*e, 8*e, Math.PI * 0.5, Math.PI * 1.5);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 22*e, y + 6*e, 8*e, -Math.PI * 0.5, Math.PI * 0.5);
                    ctx.fill();
                    ctx.fillRect(x + 5*e, y + 2*e, 20*e, 4*e);
                    
                    ctx.strokeStyle = '#1a1a1a';
                    ctx.lineWidth = 2*e;
                    ctx.beginPath();
                    ctx.arc(x + 10*e, y + 8*e, 6*e, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(x + 20*e, y + 8*e, 6*e, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(20,20,20,0.7)';
                    ctx.beginPath();
                    ctx.arc(x + 10*e, y + 8*e, 5*e, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 20*e, y + 8*e, 5*e, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#8D6E63';
                    ctx.beginPath();
                    ctx.moveTo(x + 6*e, y + 4*e);
                    ctx.quadraticCurveTo(x + 2*e, y + 12*e, x + 4*e, y + 28*e);
                    ctx.quadraticCurveTo(x + 8*e, y + 32*e, x + 12*e, y + 28*e);
                    ctx.quadraticCurveTo(x + 10*e, y + 16*e, x + 6*e, y + 4*e);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(x + 24*e, y + 4*e);
                    ctx.quadraticCurveTo(x + 28*e, y + 12*e, x + 26*e, y + 28*e);
                    ctx.quadraticCurveTo(x + 22*e, y + 32*e, x + 18*e, y + 28*e);
                    ctx.quadraticCurveTo(x + 20*e, y + 16*e, x + 24*e, y + 4*e);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2, y + 2*e, 14*e, -Math.PI, 0);
                    ctx.fill();
                    
                    ctx.fillStyle = '#6D4C41';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2 + 12*e * dir, y, 5*e, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#E91E63';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2 + 14*e * dir, y - 2*e, 3*e, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2 + 10*e * dir, y - 2*e, 3*e, 0, Math.PI * 2);
                    ctx.fill();
                    
                    const ojoX = x + this.ancho / 2 + (this.mirandoDerecha ? 4*e : -4*e);
                    
                    ctx.fillStyle = C.BLANCO;
                    ctx.beginPath();
                    ctx.arc(ojoX - 4*e, y + 8*e, 4*e, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ojoX + 4*e, y + 8*e, 4*e, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#5D4037';
                    ctx.beginPath();
                    ctx.arc(ojoX - 3*e + (this.mirandoDerecha ? 1*e : -1*e), y + 9*e, 2.5*e, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ojoX + 5*e + (this.mirandoDerecha ? 1*e : -1*e), y + 9*e, 2.5*e, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#E57373';
                    ctx.beginPath();
                    ctx.arc(x + this.ancho / 2, y + 15*e, 4*e, 0, Math.PI);
                    ctx.fill();
                }

                ctx.fillStyle = C.PIEL;
                const brazoY = y + 18*e;
                const brazoX = x + (this.mirandoDerecha ? this.ancho : -8*e);
                ctx.fillRect(brazoX - 3*e, brazoY, 6*e, 14*e);

                const manoX = brazoX + (this.mirandoDerecha ? 3*e : -3*e);
                const manoY = brazoY + 12*e;
                this.dibujarArma(manoX, manoY);

                ctx.fillStyle = this.genero === 'hombre' ? '#1a237e' : '#4a148c';
                const paso = this.animacionFrame * 0.3;
                const offset1 = Math.sin(paso) * 3*e;
                const offset2 = Math.sin(paso + Math.PI) * 3*e;
                ctx.fillRect(x + 5*e, y + 38*e, 6*e, 12*e + offset1);
                ctx.fillRect(x + 19*e, y + 38*e, 6*e, 12*e + offset2);

                ctx.fillStyle = '#4E342E';
                ctx.fillRect(x + 3*e, y + 50*e + offset1, 10*e, 4*e);
                ctx.fillRect(x + 17*e, y + 50*e + offset2, 10*e, 4*e);

                ctx.restore();

                this.dibujarCorazones();
            }

            dibujarArma(manoX, manoY) {
                const e = ESCALA;
                const angulo = this.anguloArma;
                const largo = 20*e;
                const dir = this.mirandoDerecha ? 1 : -1;

                ctx.save();
                ctx.translate(manoX, manoY);
                ctx.rotate(angulo * dir);

                if (this.arma_actual === 'pistola') {
                    ctx.fillStyle = '#37474F';
                    ctx.shadowBlur = 5*e;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, -3*e, largo, 6*e);
                    ctx.fillRect(largo - 5*e, -5*e, 5*e, 10*e);
                    ctx.fillStyle = '#546E7A';
                    ctx.fillRect(largo - 2*e, -4*e, 4*e, 8*e);
                } else if (this.arma_actual === 'escopeta') {
                    ctx.fillStyle = '#5D4037';
                    ctx.shadowBlur = 5*e;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, -4*e, largo + 5*e, 8*e);
                    ctx.fillStyle = '#795548';
                    ctx.fillRect(largo + 3*e, -5*e, 4*e, 10*e);
                    ctx.fillStyle = '#4E342E';
                    ctx.fillRect(-8*e, -3*e, 10*e, 6*e);
                } else if (this.arma_actual === 'metralleta') {
                    ctx.fillStyle = '#263238';
                    ctx.shadowBlur = 5*e;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, -3*e, largo + 8*e, 6*e);
                    ctx.fillStyle = '#37474F';
                    ctx.fillRect(largo + 4*e, -4*e, 6*e, 8*e);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(5*e, 2*e, 8*e, 6*e);
                }

                ctx.restore();
            }

            dibujarCorazones() {
                const e = ESCALA;
                const startX = this.x - 10*e;
                const startY = this.y - 28*e;
                const spacing = 20*e;
                
                for (let i = 0; i < this.maxCorazones; i++) {
                    const x = startX + i * spacing;
                    const y = startY;
                    ctx.font = `${20*e}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (i < this.corazones) {
                        ctx.fillStyle = '#FF1744';
                        ctx.shadowColor = '#FF1744';
                        ctx.shadowBlur = 15*e;
                        ctx.fillText('❤️', x + 8*e, y + 10*e);
                    } else {
                        ctx.fillStyle = '#333';
                        ctx.shadowBlur = 0;
                        ctx.fillText('🖤', x + 8*e, y + 10*e);
                    }
                }
                ctx.shadowBlur = 0;
            }
        }

        // ==================== CLASES DE JUEGO ====================
        class Perro {
            constructor(x, y) {
                const e = ESCALA;
                this.x = x;
                this.y = y;
                this.ancho = 25*e;
                this.alto = 20*e;
                this.vivo = true;
                this.velocidad = 3.5 * e;
                this.tiempoAtaque = 0;
                this.objetivo = null;
                this.animacionFrame = 0;
                this.tiempoAnimacion = 0;
                this.mirandoDerecha = true;
            }

            get centroX() { return this.x + this.ancho / 2; }
            get centroY() { return this.y + this.alto / 2; }

            buscarObjetivo(zombis) {
                let masCercano = null;
                let distMinima = Infinity;
                for (const z of zombis) {
                    if (!z.vida) continue;
                    const dist = distancia(this.centroX, this.centroY, z.centroX, z.centroY);
                    if (dist < distMinima && dist < 400*ESCALA) {
                        distMinima = dist;
                        masCercano = z;
                    }
                }
                this.objetivo = masCercano;
            }

            mover(jugador) {
                const e = ESCALA;
                const plataformas = getPlataformas();
                if (!this.vivo) return;

                let dx = 0, dy = 0;
                if (this.objetivo && this.objetivo.vida) {
                    dx = this.objetivo.centroX - this.centroX;
                    dy = this.objetivo.centroY - this.centroY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 10*e) {
                        this.x += (dx / dist) * this.velocidad;
                        this.y += (dy / dist) * this.velocidad;
                    }
                    this.mirandoDerecha = dx > 0;
                } else {
                    dx = jugador.centroX - this.centroX;
                    dy = jugador.centroY - this.centroY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 60*e) {
                        this.x += (dx / dist) * this.velocidad * 0.5;
                        this.y += (dy / dist) * this.velocidad * 0.5;
                    }
                    this.mirandoDerecha = dx > 0;
                }

                for (const p of plataformas) {
                    if (this.x + this.ancho > p.x + 2 && this.x < p.x + p.w - 2 &&
                        this.y + this.alto > p.y && this.y + this.alto < p.y + p.h + 10) {
                        this.y = p.y - this.alto;
                    }
                }

                if (this.y + this.alto >= ALTO - 50*e) {
                    this.y = ALTO - 50*e - this.alto;
                }

                this.x = Math.max(0, Math.min(ANCHO - this.ancho, this.x));
                this.y = Math.max(0, Math.min(ALTO - 50*e - this.alto, this.y));

                this.tiempoAnimacion += 0.15;
                if (this.tiempoAnimacion > 1) {
                    this.tiempoAnimacion = 0;
                    this.animacionFrame = (this.animacionFrame + 1) % 4;
                }
                if (this.tiempoAtaque > 0) this.tiempoAtaque--;
            }

            atacar(zombis) {
                if (this.tiempoAtaque > 0 || !this.objetivo || !this.objetivo.vida) return false;
                const dist = distancia(this.centroX, this.centroY, this.objetivo.centroX, this.objetivo.centroY);
                if (dist < 40*ESCALA) {
                    this.objetivo.recibirDaño(2);
                    this.tiempoAtaque = 30;
                    crearParticulas(this.objetivo.centroX, this.objetivo.centroY, '#FF6B00', 15, 4);
                    if (!this.objetivo.vida) {
                        this.objetivo = null;
                        return true;
                    }
                }
                return false;
            }

            dibujar() {
                const e = ESCALA;
                if (!this.vivo) return;
                const x = this.x;
                const y = this.y;
                const dir = this.mirandoDerecha ? 1 : -1;

                ctx.save();

                ctx.fillStyle = '#8D6E63';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10*e;
                ctx.beginPath();
                ctx.roundRect(x + 4*e, y + 6*e, 17*e, 12*e, 4*e);
                ctx.fill();

                ctx.fillStyle = '#8D6E63';
                ctx.shadowBlur = 5*e;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? 6*e : -6*e), y + 6*e, 8*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#6D4C41';
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? 12*e : -12*e), y + 8*e, 4*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? 15*e : -15*e), y + 7*e, 2*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = C.BLANCO;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? 8*e : -8*e), y + 4*e, 3*e, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#4a2c0a';
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? 9*e : -9*e), y + 5*e, 1.5*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#6D4C41';
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? -2*e : 2*e), y + 1*e, 5*e, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + (this.mirandoDerecha ? 6*e : -6*e), y + 1*e, 5*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#D32F2F';
                ctx.fillRect(x + 4*e, y + 10*e, 17*e, 3*e);

                ctx.fillStyle = '#6D4C41';
                const paso = this.animacionFrame * 0.3;
                ctx.fillRect(x + 3*e, y + 18*e + Math.sin(paso) * 2*e, 4*e, 6*e);
                ctx.fillRect(x + 9*e, y + 18*e + Math.sin(paso + Math.PI) * 2*e, 4*e, 6*e);
                ctx.fillRect(x + 15*e, y + 18*e + Math.sin(paso + Math.PI * 0.5) * 2*e, 4*e, 6*e);

                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 3*e;
                ctx.beginPath();
                const colaX = this.mirandoDerecha ? x : x + this.ancho;
                ctx.moveTo(colaX, y + 8*e);
                ctx.quadraticCurveTo(colaX + (this.mirandoDerecha ? -8*e : 8*e), y - 4*e, colaX + (this.mirandoDerecha ? -12*e : 12*e), y - 8*e);
                ctx.stroke();

                ctx.restore();

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${8*e}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('🐕‍🦺 REX', this.centroX, y - 6*e);
            }
        }

        class Zombi {
            constructor(x, y, nivel) {
                const e = ESCALA;
                this.x = x;
                this.y = y;
                this.ancho = 28*e;
                this.alto = 44*e;
                this.vida = nivel;
                this.maxVida = nivel;
                this.velocidad = 1 * e + nivel * 0.15 * e;
                this.nivel = nivel;
                this.radio = 16*e;
                this.tiempoAtaque = 0;
                this.animacionFrame = 0;
                this.tiempoAnimacion = 0;
                this.tipo = 'normal';
                this.tiempoDisparo = 0;
                this.puedeDisparar = false;
            }

            get centroX() { return this.x + this.ancho / 2; }
            get centroY() { return this.y + this.alto / 2; }

            configurar(minutos) {
                // A partir del minuto 2, algunos zombis disparan
                if (minutos >= 2) {
                    const prob = Math.min(0.25 + (minutos - 2) * 0.03, 0.45);
                    this.tipo = Math.random() < prob ? 'disparador' : 'normal';
                    this.puedeDisparar = this.tipo === 'disparador';
                    if (this.puedeDisparar) {
                        this.velocidad *= 0.7;
                    }
                }
            }

            moverHacia(objetivo) {
                const e = ESCALA;
                const plataformas = getPlataformas();
                const dx = objetivo.centroX - this.centroX;
                const dy = objetivo.centroY - this.centroY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 20*e) {
                    const movX = (dx / dist) * this.velocidad;
                    const movY = (dy / dist) * this.velocidad;
                    this.x += movX;
                    this.y += movY;
                }

                for (const p of plataformas) {
                    if (this.x + this.ancho > p.x + 2 && this.x < p.x + p.w - 2 &&
                        this.y + this.alto > p.y && this.y + this.alto < p.y + p.h + 10) {
                        this.y = p.y - this.alto;
                    }
                }

                this.x = Math.max(0, Math.min(ANCHO - this.ancho, this.x));
                this.y = Math.max(0, Math.min(ALTO - 50*e - this.alto, this.y));

                this.tiempoAnimacion += 0.1;
                if (this.tiempoAnimacion > 1) {
                    this.tiempoAnimacion = 0;
                    this.animacionFrame = (this.animacionFrame + 1) % 4;
                }
            }

            dibujar() {
                const e = ESCALA;
                const x = this.x;
                const y = this.y;
                const colores = [C.VERDE, C.NARANJA, C.ROJO, C.MORADO, '#8B0000'];
                const color = colores[Math.min(this.nivel - 1, colores.length - 1)];

                ctx.save();

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10*e;
                ctx.shadowOffsetY = 3*e;

                ctx.fillStyle = color;
                ctx.shadowBlur = 8*e;
                ctx.beginPath();
                ctx.roundRect(x + 3*e, y + 6*e, 22*e, 28*e, 4*e);
                ctx.fill();

                ctx.shadowBlur = 0;

                ctx.fillStyle = '#2E7D32';
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2, y + 8*e, 12*e, 0, Math.PI * 2);
                ctx.fill();

                const grad = ctx.createRadialGradient(x + this.ancho / 2 - 4*e, y + 6*e, 0, x + this.ancho / 2 - 4*e, y + 6*e, 5*e);
                grad.addColorStop(0, '#FF1744');
                grad.addColorStop(1, '#B71C1C');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 - 4*e, y + 6*e, 3.5*e, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + 4*e, y + 6*e, 3.5*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = C.NEGRO;
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 - 3*e, y + 7*e, 1.5*e, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + this.ancho / 2 + 5*e, y + 7*e, 1.5*e, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = C.BLANCO;
                for (let i = -6*e; i <= 6*e; i += 4*e) {
                    ctx.fillRect(x + this.ancho / 2 + i - 1*e, y + 12*e, 3*e, 4*e);
                }

                ctx.fillStyle = '#1B5E20';
                const paso = this.animacionFrame * 0.2;
                ctx.fillRect(x - 4*e, y + 14*e + Math.sin(paso) * 3*e, 5*e, 12*e);
                ctx.fillRect(x + this.ancho - 1*e, y + 14*e + Math.sin(paso + Math.PI) * 3*e, 5*e, 12*e);

                ctx.fillStyle = color;
                const paso2 = this.animacionFrame * 0.3;
                ctx.fillRect(x + 4*e, y + 34*e + Math.sin(paso2) * 2*e, 7*e, 10*e + Math.sin(paso2) * 2*e);
                ctx.fillRect(x + 17*e, y + 34*e + Math.sin(paso2 + Math.PI) * 2*e, 7*e, 10*e + Math.sin(paso2 + Math.PI) * 2*e);

                ctx.restore();

                if (this.tipo === 'disparador') {
                    ctx.fillStyle = 'rgba(255,0,0,0.3)';
                    ctx.font = `${10*e}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('🔫', this.centroX, y - 16*e);
                }

                if (this.vida < this.maxVida) {
                    const anchoBarra = this.ancho + 10*e;
                    const xBarra = x - 5*e;
                    const yBarra = y - 12*e;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(xBarra, yBarra, anchoBarra, 4*e);
                    ctx.fillStyle = this.vida / this.maxVida > 0.5 ? C.VERDE : C.ROJO;
                    ctx.fillRect(xBarra, yBarra, anchoBarra * (this.vida / this.maxVida), 4*e);
                }
            }

            recibirDaño(daño) {
                this.vida -= daño;
                crearParticulas(this.centroX, this.centroY, C.ROJO, 10, 3);
                return this.vida <= 0;
            }
        }

        class Bala {
            constructor(x, y, angulo, tipo = 'pistola', esEnemiga = false) {
                const e = ESCALA;
                this.x = x;
                this.y = y;
                this.tipo = tipo;
                this.esEnemiga = esEnemiga;
                this.velocidad = tipo === 'pistola' ? 14*e : tipo === 'metralleta' ? 16*e : 10*e;
                this.radio = tipo === 'pistola' ? 4*e : tipo === 'metralleta' ? 3*e : 8*e;
                this.dx = Math.cos(angulo) * this.velocidad;
                this.dy = Math.sin(angulo) * this.velocidad;
                this.dano = tipo === 'escopeta' ? 3 : tipo === 'metralleta' ? 1 : 1;
                this.trail = [];
                this.vida = 80;
            }

            mover() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();
                this.x += this.dx;
                this.y += this.dy;
                this.vida--;
            }

            dibujar() {
                const e = ESCALA;
                for (let i = 0; i < this.trail.length; i++) {
                    const alpha = i / this.trail.length * 0.4;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, this.radio * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = this.esEnemiga ?
                        `rgba(255, 0, 0, ${alpha})` :
                        this.tipo === 'pistola' ? `rgba(255, 255, 0, ${alpha})` : 
                        this.tipo === 'metralleta' ? `rgba(0, 200, 255, ${alpha})` :
                        `rgba(255, 165, 0, ${alpha})`;
                    ctx.fill();
                }

                const grad = ctx.createRadialGradient(
                    this.x - 2*e, this.y - 2*e, 0,
                    this.x, this.y, this.radio
                );
                if (this.esEnemiga) {
                    grad.addColorStop(0, '#FF6666');
                    grad.addColorStop(1, '#CC0000');
                } else if (this.tipo === 'pistola') {
                    grad.addColorStop(0, '#FFFF88');
                    grad.addColorStop(1, '#CCAA00');
                } else if (this.tipo === 'metralleta') {
                    grad.addColorStop(0, '#88FFFF');
                    grad.addColorStop(1, '#0099CC');
                } else {
                    grad.addColorStop(0, '#FFAA44');
                    grad.addColorStop(1, '#CC6600');
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - 1*e, this.y - 2*e, this.radio * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }
        }

        class Granada {
            constructor(x, y, angulo) {
                const e = ESCALA;
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angulo) * 3 * e;
                this.vy = Math.sin(angulo) * 3 * e - 2 * e;
                this.radio = 10 * e;
                this.alive = true;
                this.timer = 90;
                this.exploto = false;
                this.explosionRadio = 0;
                this.maxExplosion = 130 * e;
                this.explosionTimer = 0;
            }

            mover() {
                const e = ESCALA;
                const plataformas = getPlataformas();
                if (this.exploto) {
                    this.explosionTimer++;
                    this.explosionRadio += 4 * e;
                    if (this.explosionTimer > 25) this.alive = false;
                    return;
                }

                this.timer--;
                this.vy += 0.3 * e;
                this.x += this.vx;
                this.y += this.vy;

                for (const p of plataformas) {
                    if (this.x > p.x && this.x < p.x + p.w &&
                        this.y + this.radio > p.y && this.y + this.radio < p.y + p.h + 10) {
                        this.y = p.y - this.radio;
                        this.vy *= -0.3;
                    }
                }

                if (this.y + this.radio > ALTO - 50*e) {
                    this.y = ALTO - 50*e - this.radio;
                    this.vy *= -0.3;
                }

                if (this.timer <= 0) {
                    this.exploto = true;
                }
            }

            colisionaCon(zombi) {
                if (this.exploto) return false;
                const dist = distancia(this.x, this.y, zombi.centroX, zombi.centroY);
                return dist < this.radio + 16*ESCALA;
            }

            dibujar() {
                const e = ESCALA;
                if (this.exploto) {
                    const alpha = 1 - (this.explosionTimer / 25);
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.explosionRadio);
                    grad.addColorStop(0, `rgba(255,200,50,${alpha * 0.9})`);
                    grad.addColorStop(0.3, `rgba(255,100,20,${alpha * 0.7})`);
                    grad.addColorStop(0.7, `rgba(200,50,0,${alpha * 0.5})`);
                    grad.addColorStop(1, `rgba(100,20,0,0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.explosionRadio, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.shadowColor = '#ff8800';
                    ctx.shadowBlur = 40*e;
                    ctx.fillStyle = `rgba(255,200,100,${alpha * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.explosionRadio * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    return;
                }

                ctx.shadowColor = '#333';
                ctx.shadowBlur = 8*e;
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(this.x - 3*e, this.y - 12*e, 6*e, 4*e);
                if (Math.floor(this.timer / 10) % 2 === 0) {
                    ctx.fillStyle = '#ff3333';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 5*e, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            getDaño(zombi) {
                if (!this.exploto) return 0;
                const dist = distancia(this.x, this.y, zombi.centroX, zombi.centroY);
                if (dist < this.explosionRadio) {
                    const factor = 1 - (dist / this.explosionRadio);
                    return Math.floor(8 * factor);
                }
                return 0;
            }
        }

        class ArmaSuelo {
            constructor(x, y, tipo) {
                const e = ESCALA;
                this.x = x;
                this.y = this.encontrarPiso(x, y);
                this.tipo = tipo;
                this.radio = 14 * e;
                this.activo = true;
                this.tiempo = 0;
                this.flotando = 0;
                this.timer = 600;
            }

            encontrarPiso(x, y) {
                const e = ESCALA;
                const plataformas = getPlataformas();
                let pisoY = ALTO - 50 * e;
                for (const p of plataformas) {
                    if (x > p.x && x < p.x + p.w && y < p.y) {
                        if (p.y < pisoY) pisoY = p.y;
                    }
                }
                return pisoY - 20 * e;
            }

            dibujar() {
                const e = ESCALA;
                if (!this.activo || this.timer <= 0) return;
                this.tiempo++;
                this.flotando = Math.sin(this.tiempo * 0.05) * 4 * e;

                ctx.save();

                ctx.shadowColor = 'rgba(255, 165, 0, 0.5)';
                ctx.shadowBlur = 25 * e;

                const grad = ctx.createRadialGradient(
                    this.x, this.y + this.flotando, 0,
                    this.x, this.y + this.flotando, this.radio
                );
                grad.addColorStop(0, '#FFB74D');
                grad.addColorStop(1, '#E65100');
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.flotando, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = C.BLANCO;
                ctx.lineWidth = 2 * e;
                ctx.stroke();

                ctx.shadowBlur = 0;

                ctx.fillStyle = C.BLANCO;
                ctx.font = `${16*e}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🔫', this.x, this.y + this.flotando);

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = `${9*e}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(this.tipo.toUpperCase(), this.x, this.y + this.flotando + this.radio + 4*e);

                ctx.restore();
            }
        }

        class CorazonSuelo {
            constructor(x, y) {
                const e = ESCALA;
                this.x = x;
                this.y = y;
                this.radio = 15 * e;
                this.activo = true;
                this.tiempo = 0;
                this.flotando = 0;
                this.timer = 600;
            }

            dibujar() {
                const e = ESCALA;
                if (!this.activo || this.timer <= 0) return;
                this.tiempo++;
                this.flotando = Math.sin(this.tiempo * 0.05) * 4 * e;

                ctx.save();

                ctx.shadowColor = 'rgba(255, 0, 0, 0.5)';
                ctx.shadowBlur = 30 * e;

                ctx.font = `${30*e}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('❤️', this.x, this.y + this.flotando);

                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = `${8*e}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('+1 VIDA', this.x, this.y + this.flotando + 18*e);

                ctx.restore();
            }
        }

        // ==================== CLASE PRINCIPAL DEL JUEGO ====================
        class Juego {
            constructor(genero) {
                const e = ESCALA;
                this.jugador = new Personaje(ANCHO / 2 - 15*e, ALTO - 100*e, genero);
                this.zombis = [];
                this.balas = [];
                this.balasEnemigas = [];
                this.armasSuelo = [];
                this.granadas = [];
                this.granadasSuelo = [];
                this.corazonesSuelo = [];
                this.perro = null;
                this.puntuacion = 0;
                this.tiempoInicio = Date.now();
                this.ultimoSpawn = 0;
                this.juegoTerminado = false;
                this.zombisPorSpawn = 1;
                this.tiempoEntreSpawn = 1500;
                this.teclas = {};
                this.mouseX = ANCHO / 2;
                this.mouseY = ALTO / 2;
                this.mousePresionado = false;
                this.tiempoAtaqueZombi = 0;
                this.disparoCooldown = 0;
                this.minutoActual = 0;
                this.eliminadosParaCorazon = 0;
                this.corazonesRecogidos = 0;
                this.perroActivo = false;
                this.juegoIniciado = true;
                this.tiempoUltimoReinicio = Date.now();

                this.setupEventListeners();
                this.buclePrincipal();
            }

            setupEventListeners() {
                const keyHandler = (e) => {
                    const key = e.key.toLowerCase();
                    this.teclas[key] = e.type === 'keydown';
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                        e.preventDefault();
                    }
                    if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && e.type === 'keydown') {
                        this.jugador.saltar();
                    }
                    if (e.key === 'g' && e.type === 'keydown') {
                        const granada = this.jugador.lanzarGranada(this.mouseX, this.mouseY);
                        if (granada) this.granadas.push(granada);
                    }
                    if ((e.key === 'e' || e.key === 'q') && e.type === 'keydown') {
                        this.jugador.cambiarArma();
                    }
                };

                document.addEventListener('keydown', keyHandler);
                document.addEventListener('keyup', keyHandler);

                // Mouse
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                });

                canvas.addEventListener('mousedown', (e) => {
                    if (e.button === 0) {
                        this.mousePresionado = true;
                        if (this.jugador.vivo && !this.juegoTerminado) {
                            this.disparar();
                        }
                    }
                });

                canvas.addEventListener('mouseup', () => {
                    this.mousePresionado = false;
                });

                // Touch
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        const rect = canvas.getBoundingClientRect();
                        this.mouseX = touch.clientX - rect.left;
                        this.mouseY = touch.clientY - rect.top;
                        this.mousePresionado = true;
                        if (this.jugador.vivo && !this.juegoTerminado) {
                            this.disparar();
                        }
                    }
                }, { passive: false });

                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        const rect = canvas.getBoundingClientRect();
                        this.mouseX = touch.clientX - rect.left;
                        this.mouseY = touch.clientY - rect.top;
                    }
                }, { passive: false });

                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.mousePresionado = false;
                }, { passive: false });

                // Disparo continuo
                setInterval(() => {
                    if (this.mousePresionado && this.jugador.vivo && !this.juegoTerminado) {
                        this.disparar();
                    }
                }, 100);

                // Joystick
                const joystickZone = document.getElementById('joystickZone');
                const joystickKnob = document.getElementById('joystickKnob');

                function handleJoystick(clientX, clientY) {
                    const rect = joystickZone.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const maxDist = rect.width / 2 - 20;
                    
                    let dx = clientX - centerX;
                    let dy = clientY - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    joystickX = dx / maxDist;
                    joystickY = dy / maxDist;
                    
                    joystickKnob.style.transform = `translate(${-50 + (dx / maxDist) * 50}%, ${-50 + (dy / maxDist) * 50}%)`;
                }

                function resetJoystick() {
                    joystickX = 0;
                    joystickY = 0;
                    joystickKnob.style.transform = 'translate(-50%, -50%)';
                }

                joystickZone.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        handleJoystick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                joystickZone.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (touch) {
                        handleJoystick(touch.clientX, touch.clientY);
                    }
                }, { passive: false });

                joystickZone.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    resetJoystick();
                }, { passive: false });

                // Botones móviles
                document.getElementById('btnJump').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.jugador.vivo && !this.juegoTerminado) this.jugador.saltar();
                }, { passive: false });
                document.getElementById('btnJump').addEventListener('mousedown', () => {
                    if (this.jugador.vivo && !this.juegoTerminado) this.jugador.saltar();
                });

                document.getElementById('btnGrenade').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.jugador.vivo && !this.juegoTerminado) {
                        const granada = this.jugador.lanzarGranada(this.mouseX, this.mouseY);
                        if (granada) this.granadas.push(granada);
                    }
                }, { passive: false });
                document.getElementById('btnGrenade').addEventListener('mousedown', () => {
                    if (this.jugador.vivo && !this.juegoTerminado) {
                        const granada = this.jugador.lanzarGranada(this.mouseX, this.mouseY);
                        if (granada) this.granadas.push(granada);
                    }
                });

                document.getElementById('btnSwitch').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.jugador.vivo && !this.juegoTerminado) this.jugador.cambiarArma();
                }, { passive: false });
                document.getElementById('btnSwitch').addEventListener('mousedown', () => {
                    if (this.jugador.vivo && !this.juegoTerminado) this.jugador.cambiarArma();
                });

                document.getElementById('btnShoot').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.jugador.vivo && !this.juegoTerminado) {
                        this.mousePresionado = true;
                        this.disparar();
                    }
                }, { passive: false });
                document.getElementById('btnShoot').addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.mousePresionado = false;
                }, { passive: false });
                document.getElementById('btnShoot').addEventListener('mousedown', () => {
                    if (this.jugador.vivo && !this.juegoTerminado) {
                        this.mousePresionado = true;
                        this.disparar();
                    }
                });
                document.getElementById('btnShoot').addEventListener('mouseup', () => {
                    this.mousePresionado = false;
                });
            }

            disparar() {
                if (this.disparoCooldown > 0) return;
                if (!this.jugador.vivo) return;

                const balas = this.jugador.disparar(this.mouseX, this.mouseY);
                if (balas) {
                    if (Array.isArray(balas)) {
                        this.balas.push(...balas);
                    } else {
                        this.balas.push(balas);
                    }
                    this.disparoCooldown = 8;
                    const angulo = Math.atan2(this.mouseY - this.jugador.centroY, this.mouseX - this.jugador.centroX);
                    const e = ESCALA;
                    crearParticulas(this.jugador.centroX + Math.cos(angulo) * 25*e,
                                   this.jugador.centroY + Math.sin(angulo) * 25*e, '#FFD700', 5, 2);
                }
            }

            spawnZombi(minutos) {
                const e = ESCALA;
                const nivelResistencia = Math.min(minutos + 1, 8);
                const margen = 80 * e;
                let x, y;
                let intentos = 0;
                
                do {
                    const lado = Math.floor(Math.random() * 4);
                    if (lado === 0) { x = Math.random() * ANCHO; y = -margen; }
                    else if (lado === 1) { x = Math.random() * ANCHO; y = ALTO - 50*e + margen; }
                    else if (lado === 2) { x = -margen; y = Math.random() * (ALTO - 50*e); }
                    else { x = ANCHO + margen; y = Math.random() * (ALTO - 50*e); }
                    intentos++;
                } while (distancia(x, y, this.jugador.centroX, this.jugador.centroY) < 200*e && intentos < 20);

                const zombi = new Zombi(x, y, nivelResistencia);
                zombi.configurar(minutos);
                return zombi;
            }

            actualizar() {
                const e = ESCALA;
                if (!this.jugador.vivo || this.juegoTerminado) return;

                const tiempoActual = Date.now();
                const minutos = Math.floor((tiempoActual - this.tiempoInicio) / 60000);
                this.minutoActual = minutos;

                this.jugador.mover(this.teclas, this.mouseX, this.mouseY);
                this.disparoCooldown = Math.max(0, this.disparoCooldown - 1);

                // Spawn del perro en el minuto 2
                if (minutos >= 2 && !this.perroActivo && !this.perro) {
                    this.perro = new Perro(this.jugador.x - 40*e, this.jugador.y);
                    this.perroActivo = true;
                    crearParticulas(this.perro.centroX, this.perro.centroY, '#FFD700', 30, 5);
                }

                // Actualizar perro
                if (this.perro && this.perro.vivo) {
                    this.perro.buscarObjetivo(this.zombis);
                    this.perro.mover(this.jugador);
                    if (this.perro.atacar(this.zombis)) {
                        this.puntuacion += 5;
                        this.eliminadosParaCorazon++;
                        if (this.eliminadosParaCorazon >= 20) {
                            this.eliminadosParaCorazon = 0;
                            const cx = this.perro.centroX + aleatorio(-50*e, 50*e);
                            const cy = this.perro.centroY + aleatorio(-50*e, 50*e);
                            this.corazonesSuelo.push(new CorazonSuelo(
                                Math.max(20*e, Math.min(ANCHO - 20*e, cx)),
                                Math.max(20*e, Math.min(ALTO - 80*e, cy))
                            ));
                        }
                    }
                    this.zombis = this.zombis.filter(z => z.vida > 0);
                }

                // Granadas en el suelo (cada 30 segundos)
                if (Math.random() < 0.001 && this.granadasSuelo.length < 3) {
                    const x = 50*e + Math.random() * (ANCHO - 100*e);
                    const y = 50*e + Math.random() * (ALTO - 150*e);
                    this.granadasSuelo.push({
                        x: x,
                        y: y,
                        radio: 12*e,
                        activo: true
                    });
                    crearParticulas(x, y, '#FFD700', 10, 3);
                }

                // Recoger granadas del suelo
                for (let i = this.granadasSuelo.length - 1; i >= 0; i--) {
                    const g = this.granadasSuelo[i];
                    if (!g.activo) {
                        this.granadasSuelo.splice(i, 1);
                        continue;
                    }
                    const dist = distancia(g.x, g.y, this.jugador.centroX, this.jugador.centroY);
                    if (dist < 35*e) {
                        if (this.jugador.granadas < this.jugador.maxGranadas) {
                            this.jugador.granadas++;
                            g.activo = false;
                            this.granadasSuelo.splice(i, 1);
                            crearParticulas(g.x, g.y, '#FFD700', 15, 4);
                        }
                    }
                }

                // Recoger corazones del suelo
                for (let i = this.corazonesSuelo.length - 1; i >= 0; i--) {
                    const c = this.corazonesSuelo[i];
                    if (!c.activo) {
                        this.corazonesSuelo.splice(i, 1);
                        continue;
                    }
                    const dist = distancia(c.x, c.y, this.jugador.centroX, this.jugador.centroY);
                    if (dist < 30*e) {
                        if (this.jugador.corazones < this.jugador.maxCorazones) {
                            this.jugador.corazones++;
                            c.activo = false;
                            this.corazonesSuelo.splice(i, 1);
                            crearParticulas(c.x, c.y, '#FF1744', 20, 5);
                            this.corazonesRecogidos++;
                        }
                    }
                }

                // Actualizar balas del jugador
                for (let i = this.balas.length - 1; i >= 0; i--) {
                    const bala = this.balas[i];
                    bala.mover();
                    if (bala.x < -20*e || bala.x > ANCHO + 20*e || bala.y < -20*e || bala.y > ALTO + 20*e || bala.vida <= 0) {
                        this.balas.splice(i, 1);
                    }
                }

                // Actualizar balas enemigas
                for (let i = this.balasEnemigas.length - 1; i >= 0; i--) {
                    const bala = this.balasEnemigas[i];
                    bala.mover();
                    if (bala.x < -20*e || bala.x > ANCHO + 20*e || bala.y < -20*e || bala.y > ALTO + 20*e || bala.vida <= 0) {
                        this.balasEnemigas.splice(i, 1);
                    }
                    if (this.jugador.vivo) {
                        const dist = distancia(bala.x, bala.y, this.jugador.centroX, this.jugador.centroY);
                        if (dist < bala.radio + 15*e) {
                            this.jugador.recibirDaño(1);
                            this.balasEnemigas.splice(i, 1);
                            if (!this.jugador.vivo) {
                                this.juegoTerminado = true;
                                return;
                            }
                        }
                    }
                }

                // Actualizar granadas
                for (let i = this.granadas.length - 1; i >= 0; i--) {
                    const granada = this.granadas[i];
                    granada.mover();
                    
                    if (!granada.exploto) {
                        for (const zombi of this.zombis) {
                            if (granada.colisionaCon(zombi)) {
                                granada.exploto = true;
                                break;
                            }
                        }
                    }
                    
                    if (!granada.alive) {
                        this.granadas.splice(i, 1);
                        continue;
                    }
                    
                    if (granada.exploto) {
                        for (const zombi of this.zombis) {
                            const daño = granada.getDaño(zombi);
                            if (daño > 0) {
                                if (zombi.recibirDaño(daño)) {
                                    this.puntuacion += 10 + minutos;
                                    this.eliminadosParaCorazon++;
                                    if (this.eliminadosParaCorazon >= 20) {
                                        this.eliminadosParaCorazon = 0;
                                        const cx = zombi.centroX + aleatorio(-50*e, 50*e);
                                        const cy = zombi.centroY + aleatorio(-50*e, 50*e);
                                        this.corazonesSuelo.push(new CorazonSuelo(
                                            Math.max(20*e, Math.min(ANCHO - 20*e, cx)),
                                            Math.max(20*e, Math.min(ALTO - 80*e, cy))
                                        ));
                                    }
                                    if (Math.random() < 0.15) {
                                        const tipos = ['escopeta', 'metralleta'];
                                        const tipo = tipos[Math.floor(Math.random() * tipos.length)];
                                        this.armasSuelo.push(new ArmaSuelo(zombi.x, zombi.y, tipo));
                                    }
                                    crearParticulas(zombi.centroX, zombi.centroY, C.VERDE, 20, 5);
                                }
                            }
                        }
                    }
                }

                // Actualizar zombis
                for (let i = this.zombis.length - 1; i >= 0; i--) {
                    const zombi = this.zombis[i];
                    zombi.moverHacia(this.jugador);

                    const dist = distancia(zombi.centroX, zombi.centroY, this.jugador.centroX, this.jugador.centroY);
                    if (dist < 30*e) {
                        if (this.tiempoAtaqueZombi <= 0) {
                            this.jugador.recibirDaño(1);
                            this.tiempoAtaqueZombi = 40;
                            if (!this.jugador.vivo) {
                                this.juegoTerminado = true;
                                return;
                            }
                        }
                    }

                    // Disparo de zombis
                    if (zombi.puedeDisparar && dist < 350*e && dist > 50*e) {
                        zombi.tiempoDisparo++;
                        if (zombi.tiempoDisparo > 60 + Math.random() * 40) {
                            zombi.tiempoDisparo = 0;
                            const angulo = Math.atan2(this.jugador.centroY - zombi.centroY,
                                                    this.jugador.centroX - zombi.centroX);
                            this.balasEnemigas.push(new Bala(zombi.centroX, zombi.centroY, angulo, 'pistola', true));
                            crearParticulas(zombi.centroX, zombi.centroY, '#FF6B6B', 5, 2);
                        }
                    }

                    // Colisión con balas del jugador
                    for (let j = this.balas.length - 1; j >= 0; j--) {
                        const bala = this.balas[j];
                        const distBala = distancia(bala.x, bala.y, zombi.centroX, zombi.centroY);
                        if (distBala < bala.radio + 16*e) {
                            if (zombi.recibirDaño(bala.dano)) {
                                this.zombis.splice(i, 1);
                                this.puntuacion += 5 + Math.floor(minutos * 0.5);
                                this.eliminadosParaCorazon++;
                                if (this.eliminadosParaCorazon >= 20) {
                                    this.eliminadosParaCorazon = 0;
                                    const cx = zombi.centroX + aleatorio(-50*e, 50*e);
                                    const cy = zombi.centroY + aleatorio(-50*e, 50*e);
                                    this.corazonesSuelo.push(new CorazonSuelo(
                                        Math.max(20*e, Math.min(ANCHO - 20*e, cx)),
                                        Math.max(20*e, Math.min(ALTO - 80*e, cy))
                                    ));
                                }
                                if (Math.random() < 0.12) {
                                    const tipos = ['escopeta', 'metralleta'];
                                    const tipo = tipos[Math.floor(Math.random() * tipos.length)];
                                    this.armasSuelo.push(new ArmaSuelo(zombi.x, zombi.y, tipo));
                                }
                                crearParticulas(zombi.centroX, zombi.centroY, C.VERDE, 20, 5);
                            }
                            this.balas.splice(j, 1);
